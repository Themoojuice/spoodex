/* ---------------- cards: shared canvas kit for the title card and wrapped ---------------- */
// iNat serves most photos (all-rights-reserved ones) without CORS headers, so drawing them taints the canvas and blocks PNG export.
// Cards are drawn with every photo for on-screen viewing/screenshots; the PNG download falls back to name plates for those.
function loadImg(url, cors) {
  return new Promise(res => {
    if (!url) return res(null);
    const im = new Image();
    if (cors) im.crossOrigin = 'anonymous';
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = url;
  });
}
async function cardPhotos(list) {
  return Promise.all(list.map(async g => {
    const url = photoSize(g.cover, 'medium');
    // separate URL for the CORS load, so a copy cached from a plain <img>/CSS load (no CORS headers) can't be reused.
    // (Not '?cors': S3 treats that as a request for the bucket's CORS config.)
    const open = url ? await loadImg(url + (url.includes('?') ? '&' : '?') + 'spoodex=card', true) : null;
    return { g, open, any: open || await loadImg(url, false) };
  }));
}
function cardKit(cv) {
  const W = 1080, H = 1350, x = cv.getContext('2d');

  const fit = (t, max) => { t = String(t); if (x.measureText(t).width <= max) return t; while (t.length > 1 && x.measureText(t + '…').width > max) t = t.slice(0, -1); return t + '…'; };
  const text = (t, px, py, font, color, align = 'left', max = 920) => { x.font = font; x.fillStyle = color; x.textAlign = align; x.fillText(fit(t, max), px, py); };
  const rule = y => { x.strokeStyle = C.line; x.lineWidth = 1; x.beginPath(); x.moveTo(80, y); x.lineTo(1000, y); x.stroke(); };
  const K = { x, C, text, rule, tainted:false };
  K.frame = kicker => {
    x.fillStyle = C.bg; x.fillRect(0, 0, W, H);
    x.fillStyle = C.panel; x.fillRect(36, 36, W - 72, H - 72);
    x.strokeStyle = C.line; x.lineWidth = 3; x.strokeRect(36, 36, W - 72, H - 72);
    x.lineWidth = 1; x.strokeRect(52, 52, W - 104, H - 104);
    try { x.letterSpacing = '6px'; } catch {}
    text(kicker, 80, 118, '600 24px "IBM Plex Mono", monospace', C.muted);
    try { x.letterSpacing = '0px'; } catch {}
  };

  K.tile = (t, cx, cy, tw, th, photosOnly) => {
    x.fillStyle = C.panel2; x.fillRect(cx, cy, tw, th);
    const im = t && (photosOnly ? t.open : t.any);
    if (im) {
      if (!t.open) K.tainted = true;
      const s = Math.max(tw / im.width, th / im.height), sw = tw / s, sh = th / s;
      x.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, cx, cy, tw, th);
    } else if (t) text(t.g.name[0], cx + tw / 2, cy + th / 2 + 40, 'italic 400 140px Fraunces, Georgia, serif', C.line, 'center');
    else text('???', cx + tw / 2, cy + th / 2 + 18, '400 52px "Special Elite", monospace', C.dim, 'center');

      if (tr) { x.font = '600 20px "IBM Plex Mono", monospace'; const w = x.measureText(tr.n.toUpperCase()).width + 20;
        x.fillStyle = tr.c; x.fillRect(cx + tw - w - 10, cy + 10, w, 32); x.strokeStyle = '#2b2419'; x.lineWidth = 2; x.strokeRect(cx + tw - w - 10, cy + 10, w, 32);
        text(tr.n.toUpperCase(), cx + tw - 20, cy + 33, '600 20px "IBM Plex Mono", monospace', tr.lv === 5 || tr.lv === 4 ? '#fff' : '#2b2419', 'right'); }
      x.shadowBlur = 0;
      text(t.g.name, cx + tw / 2, cy + th + 44, 'italic 400 34px Fraunces, Georgia, serif', C.ink, 'center', tw - 10);
      if (cnOf(t.g.id)) text(cnOf(t.g.id), cx + tw / 2, cy + th + 70, '400 20px "IBM Plex Mono", monospace', C.muted, 'center', tw - 10);

  };

    const cw = 920 / stats.length;
    stats.forEach(([n, l], i) => {
      const cx = 80 + cw * i + cw / 2;

      text(l, cx, y + 98, '400 20px "IBM Plex Mono", monospace', C.muted, 'center', cw - 10);

  K.footer = y => {
    text(`Photos © ${who()} via iNaturalist`, 80, y, '400 19px "IBM Plex Mono", monospace', C.muted);
    text(`Rarity: by iNat records in ${scopeLabel(S.prefs.scope)}, red rarest`, 80, y + 28, '400 19px "IBM Plex Mono", monospace', C.muted);

}
const CARD_FONTS = ['600 72px Fraunces', 'italic 400 34px Fraunces', '600 48px Caveat', '400 20px "IBM Plex Mono"', '600 20px "IBM Plex Mono"', '400 52px "Special Elite"'];
// Mounts a finished card (canvas + download/share) into el; draw(cv, photosOnly) returns true if it used non-CORS photos
async function mountCard(el, draw, name) {

  const cv = document.createElement('canvas'); cv.className = 'cardcanvas';
  const tainted = draw(cv, false);

      <button class="primary" data-act="cardPng">⬇ Download PNG</button>
      ${navigator.canShare ? '<button data-act="cardShare">📤 Share…</button>' : ''}
      <button data-act="share">🔗 Copy link</button></div>
    ${tainted ? `<p class="small muted">iNaturalist doesn't allow some of these photos to be copied into a downloaded image, so the PNG shows name plates in their place. For the version with every photo, screenshot the card above.</p>` : ''}`;

function cardBlob() {
  const cv = document.createElement('canvas');
  S.card.draw(cv, true);   // redraw with CORS-safe photos only, so the canvas stays exportable
  return new Promise(res => cv.toBlob(res, 'image/png'));
}
async function cardExport(share) {
  if (!S.card) return;
  const blob = await cardBlob(); if (!blob) return toast('Could not create the image.');
  track(share ? 'card-share' : 'card-download');
  const file = new File([blob], `${S.card.name}.png`, { type:'image/png' });
  if (share && navigator.canShare?.({ files:[file] })) {
    try { await navigator.share({ files:[file], title:'My SPOODEX' }); } catch {}
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const rarestFirst = (a,b) => starsFor(b.id) - starsFor(a.id) || (refCount(a.id) ?? -1) - (refCount(b.id) ?? -1) || b.obs.length - a.obs.length;

/* ---------------- title card: a shareable picture of your collection ---------------- */
function drawTitleCard(cv, tiles, photosOnly) {
  const M = S.M, K = cardKit(cv), { C, text } = K;
  K.frame(`SPOODEX · ${TIERS[M.tier].name.toUpperCase()}`);
  text(who(), 80, 200, '600 72px Fraunces, Georgia, serif', C.ink);
  text(generatedTitle(M), 80, 260, '600 48px Caveat, cursive', C.accent);
  for (let i = 0; i < 6; i++) K.tile(tiles[i], 80 + (i % 3) * 313, 300 + Math.floor(i / 3) * 371, 293, 293, photosOnly);
  const st = myStanding('state') || myStanding('country');
  const stats = [[fmt(M.G.size), M.G.size === 1 ? 'GENUS' : 'GENERA'], [fmt(M.S.size), 'SPECIES'], [fmt(prestige(M)), 'PRESTIGE ✦']];

/* ---------------- wrapped: a year in spoods ---------------- */
function wrappedData(Y) {
  const M = S.M, ys = String(Y), obs = M.obs.filter(o => (o.d || '').startsWith(ys));
  const gen = new Map();
  obs.forEach(o => { const gid = genusOf(o.anc); if (gid) gen.set(gid, (gen.get(gid) || 0) + 1); });
  const newG = M.genera.filter(g => (g.first.d || '').startsWith(ys));
  const newS = [...M.S.values()].filter(s => (s.first.d || '').startsWith(ys)).sort((a,b) => starsFor(b.id, 's') - starsFor(a.id, 's'));
  const months = Array(12).fill(0); obs.forEach(o => months[+o.d.slice(5, 7) - 1]++);
  const days = [...new Set(obs.map(o => o.d))].sort();
  const locals = {}; obs.forEach(o => o.pl.forEach(p => { if (S.places[p]?.l === 20) locals[p] = (locals[p] || 0) + 1; }));
  const topLocal = Object.entries(locals).sort((a,b) => b[1] - a[1]).slice(0, 3).map(([p, c]) => ({ n:S.places[p].n, c }));
  const firstCell = new Map();
  M.obs.forEach(o => { if (o.lat == null) return; const k = cellKey(o.lat, o.lng, .25); if (!firstCell.has(k)) firstCell.set(k, o.d); });
  let run = 0, best = 0;
  days.forEach(d => { if (M.dayDisc.has(d)) { run++; best = Math.max(best, run); } else run = 0; });
  const busiest = months.indexOf(Math.max(...months));
  const topG = [...gen].sort((a,b) => b[1] - a[1]).map(([id, c]) => ({ g:M.G.get(id), c })).filter(x => x.g);
  return { Y, obs, gen, newG:[...newG].sort(rarestFirst), newS, months, days:days.length, topLocal, busiest, topG,
    newCells:[...firstCell.values()].filter(d => (d || '').startsWith(ys)).length, best,
    beh:obs.filter(o => o.beh.length).length, pioneers:myPioneers().filter(p => (p.d || '').startsWith(ys)), fav:undefined, share:undefined };
}
async function wrappedExtras(W) {

    const o = f.results[0];
    W.fav = o && o.faves_count ? { id:o.id, f:o.faves_count, n:o.taxon?.name || 'Salticidae', r:o.taxon?.rank || '', ph:o.photos?.[0]?.url || '' } : null;
    if (pid) {
      const t = await api('/observations/taxonomy', { taxon_id:SALTICIDAE, place_id:pid, verifiable:true, year:W.Y });
      const root = t.results.find(x => x.id === SALTICIDAE), mine = W.obs.filter(o => inPlace(o, pid)).length;

// Sent by hand rather than with GoatCounter's count.js, which always forwards location.search (our ?u=/?vs=/?crew= usernames).
// Only the page path, screen width, a query-less referrer and a few event names leave the browser: no usernames, places or cookies.
const GOATCOUNTER = 'https://themoojuice.goatcounter.com/count';
function track(path, event = true) {
  try {
    if (!/^https?:$/.test(location.protocol) || /^(localhost|127\.|\[::1\]|0\.0\.0\.0)|\.(localhost|test)$/.test(location.hostname)) return;
    const q = new URLSearchParams({ p:path, t:event ? path : 'SPOODEX', r:event ? '' : (document.referrer || '').split(/[?#]/)[0],
      s:String(screen.width), e:String(event), rnd:Math.random().toString(36).slice(2, 7) });
    const url = `${GOATCOUNTER}?${q}`;
    if (!navigator.sendBeacon || !navigator.sendBeacon(url)) new Image().src = url;
  } catch {}
}

/* ---------------- landing: real jumping spiders before anyone types a username ---------------- */
// Hand-picked (owner to confirm, HANDOVER §12): the world's most-recorded genera plus a few favourites. The owner's research-grade
// photos come first; someone else's only for a genus he hasn't photographed, and only CC0, CC BY or CC BY-NC, always credited.
const OWNER = 'themoojuice';
const LAND = [53600, 53810, 51934, 194789, 362604, 51780, 68910, 68064, 125445, 244360, 61762, 858508];   // Maratus, Phidippus, Portia, Mopsus, Cosmophasis, Myrmarachne, Salticus, Menemerus, Plexippus, Hasarius, Evarcha, Zenodorus
const LAND_PIN = {};   // genus id -> one of the owner's observation ids, to pin a particular photo
const LAND_TTL = 14 * 864e5;
const OK_LIC = { 'cc0':'CC0', 'cc-by':'CC BY', 'cc-by-nc':'CC BY-NC' };
const PH_FIELDS = '(id:!t,taxon:(id:!t,ancestor_ids:!t),user:(login:!t,name:!t),photos:(url:!t,license_code:!t,attribution:!t))';
// "(c) Jane Doe, some rights reserved (CC BY-NC)" -> "Jane Doe"
const byName = (attr, user) => (/^\(c\)\s*(.+?),\s*(?:some|no|all) rights reserved/i.exec(attr || '') || [])[1] || user?.name || user?.login || '';
const creditTxt = (by, lic) => `© ${by}${OK_LIC[lic] ? ', ' + OK_LIC[lic] : ''}`;
const genusIn = (o, ids) => ids.find(id => o.taxon?.id === id || (o.taxon?.ancestor_ids || []).includes(id));
let landBusy = false;
async function loadLanding(fetch = true) {
  let L = store.get('landing', 0);   // 0 = never fetched (keeps the placeholders)
  paintLanding(L);
  if (landBusy || !fetch || (L && Date.now() - L.ts < LAND_TTL)) return;
  landBusy = true;
  try {
    const got = {};
    const take = (o, mine) => {
      const gid = genusIn(o, LAND), p = (o.photos || []).find(p => mine || OK_LIC[p.license_code]);
      if (gid && p && !got[gid]) got[gid] = { o:o.id, u:p.url, by:mine ? OWNER : byName(p.attribution, o.user), lic:mine ? null : p.license_code };
    };
    const pins = Object.values(LAND_PIN);
    if (pins.length) (await api('/observations', { id:pins.join(','), user_login:OWNER, fields:PH_FIELDS }, API2)).results.forEach(o => take(o, true));
    // his most-faved research-grade record of each genus
    (await api('/observations', { user_login:OWNER, taxon_id:LAND.join(','), quality_grade:'research', photos:true, order_by:'votes', order:'desc', per_page:200, fields:PH_FIELDS }, API2)).results.forEach(o => take(o, true));
    for (const gid of LAND.filter(id => !got[id])) {
      const d = await api('/observations', { taxon_id:gid, quality_grade:'research', photo_license:Object.keys(OK_LIC).join(','), order_by:'votes', order:'desc', per_page:10, fields:PH_FIELDS }, API2);
      d.results.forEach(o => take(o, false));
    }
    (await api('/taxa/' + LAND.join(','))).results.forEach(cnFrom);
    saveShared();
    L = { ts:Date.now(), items:LAND.filter(id => got[id]).map(id => ({ g:id, n:S.nodes[id]?.n || '', cn:cnOf(id), ...got[id] })) };
    store.set('landing', L);
    paintLanding(L);
  } catch (e) { console.warn(e); if (!L) paintLanding(null); }
  landBusy = false;
}
function paintLanding(L) {
  const el = $('#landPhotos'); if (!el) return;
  if (L === null) { el.innerHTML = ''; return; }   // offline on a first visit: nothing to show

  el.innerHTML = L.items.map(x => `<a class="lcard" href="https://www.inaturalist.org/observations/${+x.o}" target="_blank" rel="noopener" title="Open this record on iNaturalist">

    ${x.cn ? `<span class="cn">${esc(x.cn)}</span>` : ''}<span class="cr" title="${esc(creditTxt(x.by, x.lic))}">${esc(creditTxt(x.by, x.lic))}</span></a>`).join('');
}

    <p>${isGuest() ? 'Browsing as a guest.' : `Viewing <b>${esc(S.login)}</b> (public data only). Last sync ${esc((S.u.meta.lastSync||'').slice(0,16).replace('T',' '))}.`}</p>
    <div class="row"><label>Chassis skin <select data-pref="chassis">${['auto','notebook','kit','cabinet'].map(c => `<option ${S.prefs.chassis===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label><input type="checkbox" data-pref="peek" ${S.prefs.peek?'checked':''}> Unlock all modules (prototype peek)</label></div>
    <div class="row" style="margin-top:14px">
      ${isGuest() ? '' : '<button data-act="share">🔗 Copy share link</button><button data-act="full">Full resync</button>'}
      <button data-act="switch">Switch user</button>
      <button data-act="wipe">Forget this user's cache</button>
    </div>
    ${installHtml()}
    <p class="small muted" style="margin-top:14px">Anonymous visit counts via GoatCounter: no cookies, no usernames, no locations.</p>
    <p class="small muted">Weather lookups send your home base, and the destination of a dated trip, rounded to ~10 km, to Open-Meteo.</p>
    <p class="small muted" id="storeInfo">Saved in this browser${store.db ? ' (IndexedDB)' : ' (localStorage, about 5 MB at most)'}.</p></div></div></div>`;
  store.usage().then(b => { const el = $('#storeInfo'); if (el && b) el.textContent += ` This site is using about ${(b / 1048576).toFixed(1)} MB.`; });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-genus],[data-close],[data-filter],[data-scan],[data-act],[data-base],[data-layer],[data-trip]');
  if (!t) return;
  if (t.dataset.close && e.target !== t && !e.target.closest('.x')) return;
  if (t.dataset.genus) { e.preventDefault(); openGenus(+t.dataset.genus); return; }
  if (t.dataset.close) { $('#modalRoot').innerHTML = ''; return; }
  if (t.dataset.tab) { e.preventDefault(); $('#modalRoot').innerHTML = ''; S.tab = t.dataset.tab; if (S.tab === 'crew') { S.evOpen = null; S.evBroken = false; } updateUrl(); render(); return; }
  if (t.dataset.filter) { S.prefs.filter = t.dataset.filter; savePrefs(); render(); return; }
  if (t.dataset.layer) { S.prefs.layer = t.dataset.layer; savePrefs(); render(); return; }
  if (t.dataset.scan) { const c = pointFor(t.dataset.scan); if (S.tab !== 'map') { S.tab = 'map'; render(); } if (c) runScan(c.lat, c.lng); return; }
  if (t.dataset.base) { e.preventDefault(); const [lat, lng, ...rest] = t.dataset.base.split('|'); setBase(lat, lng, rest.join('|')); return; }
  if (t.dataset.trip) { e.preventDefault(); const [lat, lng, area, ...rest] = t.dataset.trip.split('|'); setTrip(lat, lng, rest.join('|'), +area || null); return; }
  const a = t.dataset.act;
  if (a === 'peek') { S.prefs.peek = true; savePrefs(); render(); }
  if (a === 'full') { $('#modalRoot').innerHTML = ''; doSync(true); }
  if (a === 'share') copyLink();
  const val = t.dataset.v;
  if (a === 'lscope') { S.prefs.ladderScope = val; savePrefs(); ladderErr = null; render(); }
  if (a === 'lsort') { S.prefs.ladderSort = val; savePrefs(); render(); }
  if (a === 'ladderRefresh') { ladderErr = null; loadLadder(true); }
  if (a === 'vs') { S.tab = 'compare'; render(); loadCompare(val); }
  if (a === 'crewAdd') {
    if (S.crew.logins.some(l => l.toLowerCase() === val.toLowerCase())) toast(`${val} is already in your crew.`);
    else if (S.crew.logins.length >= CREW_MAX) toast(`Your crew is full (you plus ${CREW_MAX}). Remove someone on the Crew tab first.`);
    else { setCrew([...S.crew.logins, val]); toast(`${val} added to your crew.`); }
  }
  if (a === 'crewDel') setCrew(S.crew.logins.filter(l => l !== val));
  if (a === 'crewRefresh') { crewErr = null; loadCrew(true); }
  if (a === 'card') openTitleCard();
  if (a === 'wanted') { e.preventDefault(); openCase(+val); }
  if (a === 'wantedRetry') { wantedErr = null; wantedTs = 0; loadWanted(); }
  if (a === 'idaid' && !matchMedia('(pointer:coarse)').matches) {
    const w = window.open(ID_AID, 'spoodex-idaid', 'popup,width=1280,height=880');
    if (w) { e.preventDefault(); w.focus(); }
  }
  if (a === 'needsid') { e.preventDefault(); S.prefs.layer = 'needsid'; savePrefs(); S.tab = 'dex'; render(); }
  if (a === 'leadFilter') { S.prefs.leadFilter = val === 'all' ? null : val; savePrefs(); render(); }
  if (a === 'sets') { e.preventDefault(); S.prefs.layer = 'sets'; savePrefs(); S.tab = 'dex'; render(); }
  if (a === 'wview') { S.prefs.wantedView = val; savePrefs(); render(); }
  if (a === 'bountyGo') { e.preventDefault(); S.prefs.wantedView = 'bounty'; savePrefs(); S.tab = 'wanted'; render(); }
  if (a === 'scanHist') { const H = S.u.scanHist?.[+val]; if (H) { if (Date.now() - H.ts < SCAN_TTL) { S.u.mscan = H; saveUser(); drawScanArea(H, H.km); paintScan(); } else runScan(H.lat, H.lng, H.km, H.per); } }
  if (a === 'bountyRefresh') { e.preventDefault(); bountyErr = null; loadBounties(); render(); }
  if (a === 'newsDismiss') { S.u.news.dismissed = true; saveUser(); render(); }
  if (a === 'tripCase') { e.preventDefault(); openCase(+val, tripCtx()); }
  if (a === 'tripRetry') { tripErr = null; loadTrip(); }
  if (a === 'tripRefresh') { e.preventDefault(); tripErr = null; loadTrip(true); }
  if (a === 'tripClear') { e.preventDefault(); S.trip.cur = null; saveTrip(); tripErr = null; $('#view').innerHTML = ''; render(); }
  if (a === 'wrapped') openWrapped();
  if (a === 'wrYear') openWrapped(val);
  if (a === 'wrNext' && S.wr) { S.wr.i = Math.min(WR_SLIDES - 1, S.wr.i + 1); showWrapped(); }
  if (a === 'wrPrev' && S.wr) { S.wr.i = Math.max(0, S.wr.i - 1); showWrapped(); }
  if (a === 'reportRefresh') { e.preventDefault(); reportErr = null; loadReport(true); }
  if (a === 'cardPng') cardExport(false);
  if (a === 'cardShare') cardExport(true);
  if (a === 'geo') geolocate();
  if (['scanKm', 'scanPer', 'scanRetry'].includes(a)) { const P = scanPending || S.u.mscan;
    if (P) runScan(P.lat, P.lng, a === 'scanKm' ? kmVal(val) : P.km, a === 'scanPer' ? val : P.per); }
  if (a === 'scanTab') { S.prefs.scanTab = val; savePrefs(); paintScan(); }
  if (a === 'scanHome' && S.M.homeCell) runScan(S.M.homeCell.lat, S.M.homeCell.lng);
  if (a === 'pinHome' && S.u.mscan) { e.preventDefault(); setBase(S.u.mscan.lat, S.u.mscan.lng, S.u.mscan.near?.split(',')[0] || 'Map point'); }
  if (a === 'map3d') { S.prefs.map3d = val === '1'; savePrefs(); render(); }
  if (a === 'field') openField();
  if (a === 'fieldStart') fieldStart();
  if (a === 'fieldClose') closeField();
  if (a === 'fieldNext') { e.preventDefault(); F.pick++; paintField(); }
  if (a === 'fieldRescan') { F.scanK = null; F.scanErr = null; fieldScanNow(); }
  if (a === 'wxRetry') loadWx(true);
  if (a === 'install') installApp();
  if (a === 'evNew') { S.evDraft = evDraftNew(); render(); }
  if (a === 'evCancel') { S.evDraft = null; render(); }
  if (a === 'evMode' && S.evDraft) { const D = S.evDraft; S.evDraft = { ...evDraftNew(val), n:D.n, p:val === 'dare' ? null : D.p, pn:val === 'dare' ? '' : D.pn }; render(); }
  if (a === 'evPreset' && S.evDraft) { evPreset(S.evDraft, val); render(); }
  if (a === 'evPlacePick' && S.evDraft) {
    e.preventDefault();
    const D = S.evDraft, h = D.hits.find(x => String(x.id) === val);
    if (h) { Object.assign(D, { p:h.id, pn:h.name, hits:[], t:[] }); S.places[h.id] = { n:h.name, l:h.l }; render(); ensureRefPlace(h.id).then(() => { saveShared(); if (S.evDraft) render(); }).catch(err => toast(err.message)); }
  }
  if (a === 'evPlaceClear' && S.evDraft) { Object.assign(S.evDraft, { p:null, pn:'', open:false, t:[] }); render(); }
  if (a === 'evDarePick' && S.evDraft) { e.preventDefault(); S.evDraft.q = val; S.evDraft.dhits = []; render(); }
  if (a === 'evCreate') evCreate();
  if (a === 'evOpen' && S.events[val]) { e.preventDefault(); $('#modalRoot').innerHTML = ''; S.evOpen = val; S.evDraft = null; S.evBroken = false; S.tab = 'crew'; S.events[val].ts = Date.now(); updateUrl(); render(); }
  if (a === 'evBack') { e.preventDefault(); S.evOpen = null; updateUrl(); render(); }
  if (a === 'evRefresh') { evErr[val] = null; loadEvent(val, true); render(); }
  if (a === 'evCopy') copyLink();
  if (a === 'evRematch') evRematch(val);
  if (a === 'evDareBack') evDareBack(val);
  if (a === 'evCard') openEventCard(val);
  if (a === 'evDel') { delete S.events[val]; evSave(); render(); }
  if (a === 'clearBase') { delete S.u.base; saveUser(); S.M = buildModel(); render(); }
  if (a === 'guest') startGuest();
  if (a === 'openDex') enterApp();
  if (a === 'tipsDone') { S.prefs.tipsDone = true; savePrefs(); render(); }
  if (a === 'sample') { $('#loginInput').value = SAMPLE_LOGIN; onboard(SAMPLE_LOGIN); }
  if (a === 'switch') { store.del('lastLogin'); location.href = location.pathname; }
  if (a === 'wipe') { store.del(ukey(S.login)); store.del('lastLogin'); store.flush().finally(() => location.href = location.pathname); }
});
document.addEventListener('submit', async e => {
  const f = e.target.dataset.form; if (!f) return;
  e.preventDefault();
  if (f === 'compare') loadCompare(e.target.login.value);
  if (f === 'crew') setCrew(e.target.logins.value.split(/[\s,;]+/));
  if (f === 'evPlace' && S.evDraft) {
    const q = e.target.q.value.trim(), D = S.evDraft; if (!q) return;
    try { const d = await api('/places/autocomplete', { q, per_page:8 }); D.hits = d.results.map(x => ({ id:x.id, name:x.display_name || x.name, l:x.admin_level ?? null })); D.msg = D.hits.length ? '' : 'No places found.'; }
    catch (err) { D.msg = err.message; }
    render();
  }
  if (f === 'evDare' && S.evDraft) {
    const q = e.target.q.value.trim(), D = S.evDraft; if (!q) return;
    try {
      const d = await api('/taxa/autocomplete', { q, taxon_id:SALTICIDAE, rank:'genus,species', per_page:8 });
      d.results.forEach(addNode);
      D.dhits = d.results.filter(x => ['genus', 'species'].includes(x.rank)).map(x => ({ code:(x.rank === 'genus' ? 'g' : 's') + x.id, name:x.name, rank:x.rank }));
      D.msg = D.dhits.length ? '' : 'No jumping spider genus or species by that name.';
    } catch (err) { D.msg = err.message; }
    render();
  }
  if (f === 'placeSearch') {
    const q = e.target.q.value.trim(); if (!q) return;
    const out = $('#placeResults'); out.textContent = 'Searching…';
    try {
      const d = await api('/places/autocomplete', { q, per_page:8 });
      out.innerHTML = d.results.filter(p => p.location).map(p => {
        const [lat, lng] = p.location.split(','), label = p.display_name || p.name;
        return `<div><a href="#" data-base="${esc(`${lat}|${lng}|${label}`)}">${esc(label)}</a></div>`;
      }).join('') || 'No places found.';
    } catch (err) { out.textContent = err.message; }
  }
  if (f === 'tripSearch') {
    const q = e.target.q.value.trim(); if (!q) return;
    const out = $('#tripResults'); out.textContent = 'Searching…';
    try {
      const d = await api('/places/autocomplete', { q, per_page:8 });
      out.innerHTML = d.results.filter(p => p.location).map(p => {
        const [lat, lng] = p.location.split(','), label = p.display_name || p.name;
        // Countries, states and big regions are planned as a whole; towns and parks by what's within TRIP_KM
        const area = [0, 10].includes(p.admin_level) || p.bbox_area > 4 ? p.id : '';
        return `<div><a href="#" data-trip="${esc(`${lat}|${lng}|${area}|${label}`)}">${esc(label)}</a>${area ? ' <span class="muted">(whole region)</span>' : ''}</div>`;
      }).join('') || 'No places found.';
    } catch (err) { out.textContent = err.message; }
  }
});
// Event form: typing updates the draft without redrawing (keeps focus); toggles redraw
document.addEventListener('input', e => { const k = e.target.dataset?.evf; if (S.evDraft && ['n', 'r', 'd1', 'd2'].includes(k)) S.evDraft[k] = e.target.value; });
document.addEventListener('change', async e => {
  if (e.target.dataset.tripm && S.trip.cur) { S.trip.cur.m = +e.target.value; saveTrip(); render(); return; }
  if (e.target.dataset.tripd && S.trip.cur) {   // dates set the month too
    const t = S.trip.cur, v = e.target.value || null; t[e.target.dataset.tripd] = v;
    if (t.d1 && (!t.d2 || t.d2 < t.d1)) t.d2 = t.d1;
    if (t.d1) t.m = +t.d1.slice(5, 7) - 1;
    saveTrip(); render(); return;
  }
  const evf = e.target.dataset.evf, D = S.evDraft;
  if (evf && D) {
    if (evf === 'open') { D.open = e.target.checked; render(); }
    else if (evf === 'qsq') { D.q = e.target.value || null; render(); }
    else D[evf] = e.target.value;
    return;
  }
  if (e.target.dataset.evt && D) {
    const id = +e.target.dataset.evt;
    if (!e.target.checked) D.t = D.t.filter(x => x !== id);
    else if (D.t.length >= EV_TARGETS) { e.target.checked = false; toast(`Up to ${EV_TARGETS} targets.`); }
    else D.t.push(id);
    return;
  }
  const p = e.target.dataset.pref; if (!p) return;
  S.prefs[p] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; savePrefs();
  if (p === 'scope') { try { await ensureRef(S.prefs.scope); } catch (err) { toast(err.message); } S.M = buildModel(); }
  render();
  if ($('#modalRoot').innerHTML && ['chassis','peek'].includes(p)) settings();
});
$('#syncBtn').addEventListener('click', () => doSync(false));
$('#shareBtn').addEventListener('click', copyLink);
$('#menuBtn').addEventListener('click', settings);
$('#revSkip').addEventListener('click', () => { revSkip = true; document.querySelectorAll('#revGrid .rcard').forEach(flipCard); });
$('#loginForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#loginInput').value.trim().replace(/^@/, ''); if (v) onboard(v); });

// ?u=<login> opens that SPOODEX (importing it if needed); ?vs=<login> jumps to Compare.
// Otherwise a returning player opens straight from cache, then quietly syncs.
// Shared caches get their defaults when the script loads, before IndexedDB is open; re-read them once it is.
const PERSISTED = ['nodes', 'places', 'info', 'ref', 'observers', 'pheno', 'ladder', 'crew', 'pioneer', 'report', 'haunts', 'trip', 'elev', 'wx', 'events', 'frontier', 'ownph'];
(async function boot() {
  track(location.pathname, false);
  registerSW(); netState();
  await store.init();
  for (const k of PERSISTED) S[k] = store.get(k, S[k]);
  const q = new URLSearchParams(location.search);
  const u = (q.get('u') || '').trim().replace(/^@/, '');
  S.pendingVs = (q.get('vs') || '').trim() || null;
  S.pendingCrew = q.get('crew') ? q.get('crew').split(',') : null;
  S.pendingEv = (q.get('ev') || '').trim() || null;
  const target = u || store.get('lastLogin');
  if (target && store.get(ukey(target))) {
    loadUser(target);
    try { S.M = buildModel(); enterApp(); doSync(false); return; } catch (e) { console.warn(e); }
  }
  loadLanding(!u && !S.pendingEv);   // photos for a first-time visitor; with ?u= the import goes first
  if (u) { $('#loginInput').value = u; onboard(u); }
  else if (S.pendingEv) startGuest();   // an event link opened by someone new: view it as a guest
})();
</script>
