/* ---------------- mastery fix-it: point at the exact records that could tick a box ---------------- */
function fixIt(g, k) {
  if (isGuest()) return '';
  const base = `https://www.inaturalist.org/observations?user_id=${encodeURIComponent(S.login)}&taxon_id=${g.id}&verifiable=any`;
  const count = f => g.obs.filter(f).length, s = n => n === 1 ? '' : 's';
  const has = (o, attr) => o.ann.some(a => a.startsWith(attr + '|'));
  const link = (url, text) => `<div class="fix small">↳ <a href="${esc(url)}" target="_blank" rel="noopener">${text} ↗</a></div>`;
  const tip = text => `<div class="fix small muted">↳ ${text}</div>`;
  switch (k) {
    case 'male': case 'female': {
      const n = count(o => !has(o, '9'));
      return n ? link(`${base}&without_term_id=9`, `${n} record${s(n)} with no sex annotation. Annotate any adults`) : tip('Every record is sexed. Go find the other one!');
    }
    case 'juv': {
      const n = count(o => !has(o, '1'));
      return n ? link(`${base}&without_term_id=1`, `${n} record${s(n)} with no life-stage annotation. Mark any juveniles`) : tip('Look for small, pale, often differently-patterned individuals.');
    }
    case 'feed':  return link(base, 'Photographed it with prey? Add "feeding" or "prey" to the description or a tag');
    case 'court': return link(base, 'Caught a display? Add "courtship" or "display" to the description or a tag');
    case 'egg':   return link(base, 'Got an egg sac, retreat or moult? Add an Evidence annotation or mention it in the description');
    case 'supported': {
      const n = count(o => !(o.ct && o.ct.includes(g.id)));
      return n ? link(`${base}&quality_grade=needs_id`, `${n} record${s(n)} not yet community-supported. Add sharper photos or @mention an identifier`) : '';
    }
    case 'species': {
      const n = count(o => o.t.l > 10);
      return n ? link(`${base}&hrank=genus&lrank=genus`, `${n} record${s(n)} stuck at genus. Try keying one to species`) : '';
    }
    case 'places': return tip(`Fieldwork: record it somewhere ~10 km from your ${g.c01.size} existing localit${g.c01.size === 1 ? 'y' : 'ies'}.`);
    case 'months': { const p = peakInfo(g.id); return tip(`Fieldwork: record it in a new month${p && !p.few ? ` (peak ${esc(p.text)})` : ''}.`); }
    default: return '';
  }
}

/* ---------------- spood score: each wild record out of 100, from public iNat signals (v2.10; SPEC-spood-score.md, tools/spood_score.py) ---------------- */

const myWKey = () => S.prefs.scoreW === 'mine' && S.u?.duelW ? 'mine' : SCORE_PRESETS[S.prefs.scoreW] ? S.prefs.scoreW : 'balanced';
const myW = () => myWKey() === 'mine' ? S.u.duelW : SCORE_PRESETS[myWKey()].w;
const wName = k => k === 'mine' ? 'Mine' : SCORE_PRESETS[k].n;
const SCORE_FIELDS = '(id:!t,description:!t,faves_count:!t,num_identification_disagreements:!t,photos:(id:!t),identifications:(current:!t,body:!t,user:(login:!t),taxon:(rank_level:!t)),comments:(body:!t,user:(login:!t)))';

const SCORE_REC_FIELDS = `(id:!t,observed_on:!t,created_at:!t,quality_grade:!t,captive:!t,description:!t,tags:!t,community_taxon_id:!t,faves_count:!t,num_identification_disagreements:!t,taxon:${TAXON_FIELDS},identifications:(current:!t,body:!t,user:(login:!t),taxon:${TAXON_FIELDS}),annotations:(controlled_attribute_id:!t,controlled_value_id:!t,votes:(vote_flag:!t)),photos:(id:!t,url:!t),comments:(body:!t,user:(login:!t)))`;
// One record's score inputs, kept small: f faves, d disagreements, n photos, o [rank level of each other person's current ID, their login],
// c comments from others, w / x the secret / surprise words found in the description, IDs and comments ('' when none)
function trimScore(o, login) {

const scorePid = () => S.M?.home.country || null;

// The country's reference tree (with stop rates) and its top identifiers, once per reference refresh

// Score inputs for a save {obs, sc}: every record once a week, new records by id in between. Returns true when something new arrived.
async function readScores(login, save, force = false) {

const domPart = sc => Object.keys(SCORE_W).reduce((b, k) => SCORE_W[k] * sc.parts[k] > SCORE_W[b] * sc.parts[b] ? k : b, 'secret');

function fitWeights(duels) {
  const K = Object.keys(SCORE_W), prior = K.map(k => SCORE_W[k] / 10), X = [];

  for (const [a, b, win] of duels) {
    const pa = parts(a), pb = parts(b);
    if (!pa || !pb) continue;
    const x = K.map(k => pa[k] - pb[k]);

  const out = Object.fromEntries(K.map((k, j) => [k, Math.round(100 * w[j] / tot)]));
  const top = K.reduce((b, k) => out[k] > out[b] ? k : b, K[0]);
  out[top] += 100 - K.reduce((a, k) => a + out[k], 0);   // rounding: the total stays 100

}

/* ---------------- reveal ceremony ---------------- */
// After a sync: a full-screen photo for each new genus, and for each mystery spood that has been identified to genus since.
// Items: {g genus, isNew, o the record that was a mystery spood, more (identified records not shown)}.
const SOLVED_SHOWN = 3;
function celebrations(fresh, solved) {
  const freshIds = new Set(fresh.map(g => g.id));
  const items = fresh.map(g => ({ g, isNew:true, o:solved.find(o => genusOf(o.anc) === g.id) }));
  const old = solved.filter(o => !freshIds.has(genusOf(o.anc)));
  old.slice(0, SOLVED_SHOWN).forEach(o => items.push({ g:S.M.G.get(genusOf(o.anc)), o }));
  const out = items.filter(x => x.g);
  if (old.length > SOLVED_SHOWN && out.length) out[out.length - 1].more = old.length - SOLVED_SHOWN;
  return out;
}
const aGenus = n => (/^[AEIOU]/i.test(n) ? 'an ' : 'a ') + n;
let revealList = [];   // what's still to come; a ceremony queued while another is on screen joins the end
function revealQueue(list) {
  revealList.push(...list);
  if (!$('#reveal')) revealNext();
}
function revealNext() {
  const list = revealList, it = list.shift(); if (!it) return;
  if (it.hon) return honourReveal(it.hon, it.crew);
  if (it.merch) return merchReveal(it.merch);
  const g = it.g, o = it.o;
  const el = document.createElement('div');
  el.id = 'reveal';
  el.innerHTML = `<div class="rph" style="background-image:url('${esc(photoSize(o?.ph[0] || g.cover, 'large'))}')"></div>
    <div class="k">${o ? 'MYSTERY SPOOD IDENTIFIED' : 'NEW GENUS RECORDED'}</div><h2>${esc(g.name.toUpperCase())}</h2>${cnOf(g.id) ? `<p class="rcn">${esc(cnOf(g.id))}</p>` : ''}
    ${wowLine(g.id) ? `<p class="rwow">${esc(wowLine(g.id))}</p>` : ''}
    ${o ? `<p class="rcn">Your mystery spood is ${esc(aGenus(g.name))}!${it.isNew ? ' Card unlocked.' : ''}</p>` : ''}
    ${it.isNew && !o ? `<p>Your ${ordinal(g.discIndex)} jumping spider genus</p>` : ''}
    ${it.isNew ? `<p class="rworth">+${worthG(g.id)} ✦ prestige</p>` : ''}
    ${o ? `<p>Observed ${esc(o.d)}</p>` : `<p>First observed ${esc(g.first.d)}${g.first.lat != null ? ' · ' + cellLabel(g.first) : ''}</p>`}
    ${it.more ? `<p>…and ${plural(it.more, 'more mystery spood')} identified.</p>` : ''}
    ${!list.length && it.isNew && !isGuest() ? '<p style="margin-top:14px"><button class="primary" data-act="dexImage">📤 Share my SPOODEX</button></p>' : ''}
    <p style="margin-top:18px;font-size:12px">${list.length ? `${list.length} more… ` : ''}tap to continue</p>`;
  el.addEventListener('click', () => { el.remove(); revealNext(); });
  document.body.appendChild(el);
}

function lineageRows(M, T) {
  const tribeOf = id => { const L = lineage(id); return (L.find(n => n.r === 'tribe') || L.find(n => n.r === 'subfamily') || { n:'(unplaced)' }).n; };

  M.G.forEach((g, id) => { const k = tribeOf(id); (t[k] = t[k] || { a:0, b:0 }).a++; });
  T.G.forEach((g, id) => { const k = tribeOf(id); (t[k] = t[k] || { a:0, b:0 }).b++; });
  return Object.entries(t).sort((x,y) => (y[1].a + y[1].b) - (x[1].a + x[1].b))
    .map(([n, v]) => `<tr><td>${esc(n)}</td><td class="${v.a>v.b?'win':''}">${v.a}</td><td class="${v.b>v.a?'win':''}">${v.b}</td></tr>`).join('');
}

    const all = Math.max(mine, ref.g[g.id] || 0); return { g, mine, all, pc:mine / all }; }).filter(Boolean)

      S.ccph[id] = got; store.set('ccph', S.ccph); redraw();
    }
  } catch (e) { console.warn(e); }
  ccBusy = false;
}
// Recorded within 25 km of home first, then in season, then the wanted score (which already weighs recent records and season)
function nextThree() {
  const list = wantedList(homeCtx()); if (!list) return null;
  const rank = x => (x.near ? 2 : 0) + ((x.season ?? .5) >= .4 ? 1 : 0);   // an unknown season counts as middling, as in the wanted score
  return [...list].sort((a, b) => rank(b) - rank(a) || b.score - a.score).slice(0, NEXT_N);
}
let nextBusy = false;
async function loadNextThree(redraw) {
  const M = S.M, h = M.homeCell;
  if (nextBusy || !(M.home.state || M.home.country)) return;
  nextBusy = true; redraw();
  try {
    await ensureRef('state');
    if (h) { if (!S.u.scans[h.k]) await fetchScan(h.k); await scanActive(h.k); }
    redraw();
    // pictures first (one call each covers the ten likeliest), so the cards fill in before the season curves arrive
    const likely = wantedList(homeCtx()).slice(0, 10).map(x => x.id);
    await ensureInfo(likely); await ownerPhotos(likely); redraw();
    // season curves re-rank the likeliest few; repeat until the three on show all have theirs
    for (let round = 0, ids = wantedList(homeCtx()).slice(0, 8).map(x => x.id); round < 3 && ids.length; round++) {
      ensurePheno(ids);
      while (phenoBusy) await sleep(800);
      ids = nextThree().map(x => x.id).filter(id => !S.pheno[phenoKey(id)]);
    }
    const ids = nextThree().map(x => x.id);
    await ensureInfo(ids); await ownerPhotos(ids); await ensureCcPhotos(ids);
  } catch (e) { console.warn(e); }
  nextBusy = false; redraw();
}
function findCard(x) {

  const near = x.recent ? `🔥 Recorded within 25 km of home in the last ${ACTIVE_DAYS} days` : x.near ? `📍 ${fmt(x.near)} record${x.near === 1 ? '' : 's'} within 25 km of home`
    : `📚 ${fmt(x.state)} record${x.state === 1 ? '' : 's'} in ${where}`;
  const when = !p || p.few ? '' : p.text === 'year-round' ? '🌡 Recorded all year round' : p.now ? `🌡 In season now · peak ${esc(p.text)}` : `🗓 Peak ${esc(p.text)}`;
  return `<div class="fcard" data-act="wanted" data-v="${x.id}" title="Where and when to look">
    ${ph ? `<div class="ph" style="background-image:url('${esc(ph.u)}')"></div>` : '<div class="ph none"><i class="sil"></i></div>'}

const petGenera = (M = S.M) => [...new Set(M.pets.map(o => genusOf(o.anc)).filter(Boolean))];

function wildFor(id, ctx = homeCtx()) {

/* ---------------- place search: iNat places plus towns from a geocoder ---------------- */
// iNat has places for parks, regions and council areas but none for most small towns (Pambula, Eden, Mission Beach), so towns and
// localities come from Open-Meteo's geocoder (GeoNames). Only the typed text is sent. Towns in your home country first, then iNat places.
const GEO = 'https://geocoding-api.open-meteo.com/v1/search';
async function findPlaces(q) {
  const home = S.places[S.M?.home.country]?.n || '', name = q.split(',')[0].trim();
  const [ip, gp] = await Promise.allSettled([
    api('/places/autocomplete', { q, per_page:8 }),
    name.length < 2 ? Promise.resolve({}) : fetch(`${GEO}?${new URLSearchParams({ name, count:10, language:'en', format:'json' })}`)
      .then(r => r.ok ? r.json() : Promise.reject(new Error(`Place search returned ${r.status}`))),
  ]);
  if (ip.status === 'rejected' && gp.status === 'rejected') throw ip.reason;
  const places = (ip.value?.results || []).filter(p => p.location).map(p => { const [lat, lng] = p.location.split(',');
    // Countries, states and big regions are planned as a whole; towns and parks by what's within TRIP_KM
    return { lat:+lat, lng:+lng, label:p.display_name || p.name, area:[0, 10].includes(p.admin_level) || p.bbox_area > 4 ? p.id : null }; });
  const seen = new Set(places.map(p => p.label.split(',')[0].trim().toLowerCase()));
  const towns = (gp.value?.results || []).filter(p => !seen.has(String(p.name).toLowerCase()))
    .map(p => ({ lat:p.latitude, lng:p.longitude, label:[p.name, p.admin2 && p.admin2 !== p.name ? p.admin2 : '', p.admin1, p.country].filter(Boolean).join(', '), home:p.country === home }));
  return [...towns.filter(t => t.home), ...places, ...towns.filter(t => !t.home)].slice(0, 10);
}
// Results as they're typed (after a pause) and on Enter; a newer search replaces an older one's answer
let placeSeq = 0, placeTimer = null;
async function placeResults(form) {

    for (const [k, n, last] of hn.cells) {
      const e = cells.get(k) || { k, g:[], n:0, last:'' };
      e.g.push(x.id); e.n += n; if (last > e.last) e.last = last;
      cells.set(k, e);

/* ---------------- analytics: anonymous visit and event counts (GoatCounter) ---------------- */
// Sent by hand rather than with GoatCounter's count.js, which always forwards location.search (our ?u=/?vs=/?crew= usernames).
// Only the page path, screen width, a query-less referrer and a few event names leave the browser: no usernames, places or cookies.
const GOATCOUNTER = 'https://themoojuice.goatcounter.com/count';
function track(path, event = true) {
  try {
    if (!/^https?:$/.test(location.protocol) || /^(localhost|127\.|\[::1\]|0\.0\.0\.0)|\.(localhost|test)$/.test(location.hostname)) return;
    // ?ref=reddit (or any short word) on a posted link names the source: the Reddit and iNat apps often send no referrer
    const ref = (new URLSearchParams(location.search).get('ref') || '').match(/^[\w.-]{1,30}$/)?.[0];
    const q = new URLSearchParams({ p:path, t:event ? path : 'SPOODEX', r:event ? '' : ref ? 'ref:' + ref : (document.referrer || '').split(/[?#]/)[0],
      s:String(screen.width), e:String(event), rnd:Math.random().toString(36).slice(2, 7) });
    const url = `${GOATCOUNTER}?${q}`;
    if (!navigator.sendBeacon || !navigator.sendBeacon(url)) new Image().src = url;
  } catch {}
}

async function loadLanding(fetch = true) {
  let L = store.get('landing', 0);   // 0 = never fetched (keeps the placeholders)

  if (landBusy || !fetch || (L && Date.now() - L.ts < LAND_TTL)) return;

      if (gid && p && !got[gid]) got[gid] = { o:o.id, u:p.url, by:byName(p.attribution, o.user), lic:p.license_code };

    LAND.filter(id => OWNER_PICKS[id]).forEach(id => got[id] = { o:OWNER_PICKS[id][0], u:pickUrl(id), by:OWNER, lic:null });

function loadUser(login) {
  S.login = login;
  S.u = store.get(ukey(login), null) || { obs:{}, meta:{}, seen:[], scans:{}, completed:[] };
  S.u.scans = S.u.scans || {}; S.u.completed = S.u.completed || []; S.u.seen = S.u.seen || [];
  // v1.17: scans became squares (b:1); older circle scans are dropped and re-read when next needed
  for (const box of [S.u.scans, S.u.active || {}]) for (const k of Object.keys(box)) if (!box[k].b) delete box[k];
  store.set('lastLogin', login);
}
// Shareable state lives in the URL: ?u=<login>&vs=<rival>&crew=<a,b,…>. Locations never go in links.
function updateUrl() {
  const p = new URLSearchParams();
  if (S.login && !isGuest()) p.set('u', S.login);
  if (S.cmp?.M && S.cmp.login) p.set('vs', S.cmp.login);
  const evCode = S.tab === 'crew' && S.evOpen && S.events[S.evOpen]?.code;   // usernames, dates, a place id and taxon ids only
  if (evCode) p.set('ev', evCode);
  else if (S.tab === 'crew' && S.crew.logins.length) p.set('crew', S.crew.logins.join(','));
  const qs = p.toString();
  try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch {}
}

async function doSync(full) {
  const btn = $('#syncBtn'); btn.disabled = true; btn.innerHTML = '⟳<span class="lbl"> Syncing…</span>';
  const prevQuests = S.M ? buildQuests(S.M) : [];
  const prevSeen = new Set(S.u.seen), prevLeads = S.M ? S.M.leads.flatMap(l => l.obs.map(o => o.id)) : [];
  const prevRank = S.M && S.u.meta.lastSync ? rankTargets() : null, prevFull = S.u.meta.lastFull, prevN = Object.keys(S.u.obs).length;
  try {
    await sync({ full });
    if (S.u.meta.lastFull !== prevFull) for (const k of rankTargets().keys()) if (S.pioneer[k]) S.pioneer[k].rts = 0;
    if (S.M.homeCell) try { await scanActive(S.M.homeCell.k); } catch (e) { console.warn(e); }
    // quests completed by this sync
    const at = new Date().toISOString().slice(0,10);
    for (const q of prevQuests) if (!['scan','base'].includes(q.kind) && questDone(q, S.M) && !S.u.completed.some(c => c.id === q.id && c.at === at)) S.u.completed.push({ id:q.id, title:q.title, at });
    const fresh = S.M.genera.filter(g => !prevSeen.has(g.id));
    S.u.seen = S.M.genera.map(g => g.id); saveUser();
    if (S.tab !== 'map') render(); else paintMap3d();
    fillElev();
    // mystery spoods identified since the last sync: records that were above genus and now sit in a genus (no extra call)
    const solved = prevLeads.map(id => S.u.obs[id]).filter(o => o && !o.cap && genusOf(o.anc));
    const items = celebrations(fresh, solved);
    if (items.length) revealQueue(items);
    merchCheck(!!S.u.merch);
    if (!items.length && !isGuest() && !$('#reveal')) {
      const newN = Object.keys(S.u.obs).length - prevN, nx = merchOn() && merchNext();
      toast(`${newN > 0 ? `${plural(newN, 'new record')}, no new genera.` : 'No new records since the last check.'}${nx ? ` ${merchToGo(nx.at)} to your next reward.` : ''}`);
    }
    queueRanks(prevRank);
    loadHomeGhosts();
  } catch (e) { toast(e.message); }
  btn.disabled = false; btn.innerHTML = '⟳<span class="lbl"> Sync</span>';
  loadNews();
  if (S.crew.logins.length && !crewBusy && crewNeedsLoad()) loadCrew().then(() => { if (S.tab !== 'map') render(); });
}

// ---- weekly streaks ----
// A week (Monday to Sunday) counts when you record any wild jumping spider in it, identified or not. One missed week per calendar month
// is covered automatically (a freeze) as long as the week after it counts; two missed weeks in a row end the run. This week can't end
// it until it's over. By observed date, so uploading older photos can fill a gap.
const weekOf = d => Math.floor((Date.parse(d + 'T00:00:00Z') / 864e5 + 3) / 7);   // weeks since Monday 29 Dec 1969
const weekMonth = w => new Date((w * 7 - 3) * 864e5).toISOString().slice(0, 7);   // the month a week's Monday falls in
function weekStreak(days, today = todayIso()) {
  const set = new Set(days.filter(Boolean).map(weekOf)), now = weekOf(today), used = new Set();
  if (!set.size) return { run:0, best:0, frozen:0, thisWeek:false, freezeLeft:true };
  let run = 0, best = 0, frozen = 0;
  for (let w = Math.min(...set); w <= now; w++) {
    if (set.has(w)) { run++; best = Math.max(best, run); continue; }
    if (w === now) break;
    const m = weekMonth(w);
    if (run && !used.has(m) && (set.has(w + 1) || w + 1 === now)) { used.add(m); frozen++; continue; }
    run = 0; frozen = 0;
  }
  return { run, best, frozen, thisWeek:set.has(now), freezeLeft:!used.has(weekMonth(now)) };
}
function weekStreakHtml(W, long) {
  if (!W.best) return '';
  const fz = W.freezeLeft ? '1 freeze left this month' : 'this month\'s freeze is used';
  if (!W.run) return `<p class="streak">Weekly streak: record any wild spood this week to start one${long ? ` <span class="muted">(best ${plural(W.best, 'week')})</span>` : ''}</p>`;
  return `<p class="streak">🔥 <b>${plural(W.run, 'week')}</b> in a row · ${W.thisWeek ? 'this week ✓' : 'this week: not yet, any wild spood counts'}
    <span class="muted small">· ${fz}${W.frozen ? ` · ${plural(W.frozen, 'week')} covered` : ''}${long ? ` · best ${plural(W.best, 'week')}` : ''}</span></p>`;
}

// ---- genus of the month ----
// One genus a month per state, in season there: the owner's pick for the month (FEATURED) if there is one, else drawn from the state's
// most-recorded genera whose busiest months include this one. Record it during the month for a stamp in the trophy cabinet.
// The pick is kept per player (S.u.feat), so a season that loads later can't swap it mid-month.
const FEATURED = {};   // 'YYYY-MM' -> genus name, the owner's choice for everyone that month
const FEAT_MIN = 10, FEAT_POOL = 40;
let featWait = false;
function featPool() {
  const pid = phenoPlace(), ref = pid && S.ref['p' + pid];
  return ref ? Object.keys(ref.g).map(Number).filter(id => ref.g[id] >= FEAT_MIN).sort((a, b) => ref.g[b] - ref.g[a]).slice(0, FEAT_POOL) : [];

function featured() {
  const mk = todayIso().slice(0, 7), U = S.u.feat = S.u.feat || {};

    const live = pool.filter(x => { const p = peakInfo(x); return p && !p.few && p.now && p.text !== 'year-round'; }).sort((a, b) => a - b);   // seasonal ones only
    const from = live.length ? live : [...pool].sort((a, b) => a - b);

}

// ---- spooding weather in your calendar ----
const icsEsc = s => String(s).replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
function icsDownload(v) {
  const [d, from, to, off, stars, ...rest] = v.split('|'), txt = rest.join('|');
  const t = h => new Date(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10), +h) - off * 1000).toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const now = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//SPOODEX//Spooding weather//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
    `UID:spooding-${d}-${from}@spoodex`, `DTSTAMP:${now}`, `DTSTART:${t(from)}`, `DTEND:${t(to)}`,
    `SUMMARY:${icsEsc(`Spooding window ${'★'.repeat(+stars)}`)}`, `DESCRIPTION:${icsEsc(txt)}`,
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Spooding window', 'TRIGGER:-PT30M', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  saveFile(`spooding-${d}.ics`, ics, 'text/calendar');
  track('calendar');
}
function saveFile(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10e3);
}

// ---- the whole region in one table ----
const ST_RANK = { MISSING:0, DISCOVERED:1, SUPPORTED:2, MASTERED:3 };
function viewDexTable() {
  const M = S.M, P = S.prefs, sc = scopeGenera(), where = esc(scopeLabel(P.scope)), ref = refFor(P.scope);
  const sort = P.tblSort || 'tax', dir = P.tblDir === -1 ? -1 : 1;
  const groups = sc.ref ? treeGroups() : [];
  const row = id => { const g = M.G.get(id), L = lineage(id);
    return { id, g, name:S.nodes[id]?.n || '?', known:!!g || P.reveal, st:g ? g.state : 'MISSING', lv:g ? g.level : -1, n:g ? g.obs.length : 0,
      c:refCount(id), r:tierIn(ref?.g, id), first:g?.first.d || '', tribe:(L.find(n => n.r === 'tribe') || L.find(n => n.r === 'subfamily') || {}).n || '' }; };
  const all = groups.flatMap(s => [...s.drawers.values()].flatMap(d => d.ids)).map(row);
  ensureInfo(all.filter(x => x.known).map(x => x.id).slice(0, 300));
  const key = { name:x => x.known ? x.name : '~', st:x => ST_RANK[x.st] * 100 + x.lv, n:x => x.n, c:x => x.c ?? 1e9, r:x => x.r ? -x.r.lv : 0, first:x => x.first || '~' }[sort];
  const cmp = (a, b) => { const p = key(a), q = key(b); return (typeof p === 'string' ? p.localeCompare(q) : p - q) * dir || a.name.localeCompare(b.name); };
  const th = (k, l, cls = '') => `<th class="${cls}"><button class="thb${sort === k ? ' on' : ''}" data-act="tblSort" data-v="${k}">${l}${sort === k ? (dir === 1 ? ' ▲' : ' ▼') : ''}</button></th>`;
  const tr = x => `<tr class="${x.g ? 'have' : 'miss'}"><td><a href="#" data-genus="${x.id}">${x.known ? `<i>${esc(x.name)}</i>` : '???'}</a>${sort !== 'tax' ? ` <span class="small muted">${esc(x.tribe)}</span>` : ''}</td>
      <td class="hm cn">${x.known ? esc(cnOf(x.id)) : ''}</td><td>${x.g ? x.st.toLowerCase() : '<span class="muted">missing</span>'}</td><td class="n">${x.g ? `${x.g.level}/10` : ''}</td>
      <td class="n">${x.n ? fmt(x.n) : ''}</td><td class="n hm">${x.c != null ? fmt(x.c) : ''}</td><td class="hm">${rarityChip(x.r)}</td><td class="hm">${esc(x.first)}</td></tr>`;
  const stat = ids => { const f = ids.filter(id => M.G.has(id)), m = f.filter(id => M.G.get(id).state === 'MASTERED');
    return `${f.length} / ${ids.length} found (${pct(f.length, ids.length)}%)${m.length ? ` · ${m.length} mastered` : ''}`; };
  const byId = new Map(all.map(x => [x.id, x]));
  const body = sort === 'tax' ? groups.map(s => { const sIds = [...s.drawers.values()].flatMap(d => d.ids);
      return `<tr class="sgrp"><td colspan="8"><b>${esc(s.n)}</b> <span class="small">${stat(sIds)}</span></td></tr>`
        + [...s.drawers.values()].map(d => `<tr class="tgrp"><td colspan="8">${esc(d.n)} <span class="small muted">${d.r} · ${stat(d.ids)}</span></td></tr>${d.ids.map(id => tr(byId.get(id))).join('')}`).join(''); }).join('')
    : [...all].sort(cmp).map(tr).join('');
  const mast = all.filter(x => x.st === 'MASTERED').length;
  return `<div class="panel row" style="margin-bottom:14px">
      ${layerSwitch()}
      <b style="font-family:var(--head);font-size:20px">${sc.found} / ${sc.inScope.length || '?'}</b><span class="muted">genera on iNat in</span>
      <select data-pref="scope">${['country','state','world'].map(s => `<option value="${s}" ${P.scope === s ? 'selected' : ''}>${esc(s === 'world' ? 'World' : scopeLabel(s))}</option>`).join('')}</select>
      <label class="small"><input type="checkbox" data-pref="reveal" ${P.reveal ? 'checked' : ''}> reveal names</label></div>
    ${!sc.ref ? '<p class="muted">Loading reference collection…</p>' : `<p class="small">${mast ? `${mast} mastered · ` : ''}${sort === 'tax' ? 'Grouped by subfamily and tribe as on iNat' : `Sorted by ${{ name:'genus', st:'status', n:'your records', c:'iNat records', r:'rarity', first:'first recorded' }[sort]} · <a href="#" data-act="tblSort" data-v="tax">back to taxonomic order</a>`}.
      Includes genera you've recorded outside ${where}. <a href="#" data-act="csv" data-v="g">📥 Download as a spreadsheet</a></p>
    <div class="panel tablewrap"><table class="cmp dextable"><thead><tr>${th('name', 'Genus')}<th class="hm">Common name</th>${th('st', 'Status')}<th class="n">Mastery</th>${th('n', 'Your records', 'n')}${th('c', `iNat records`, 'n hm')}${th('r', 'Rarity', 'hm')}${th('first', 'First recorded', 'hm')}</tr></thead>

// ---- spooding now: tell your crew you're out (the one feature that needs the SPOODEX server, server/) ----
// Only "out until <time>" is stored, never where; entries expire on their own. Without a server address the panel doesn't appear.
const SERVER = '';   // 'https://spoodex.<account>.workers.dev' once server/ is deployed (server/README.md)
const srvUrl = () => SERVER || (/^(localhost|127\.0\.0\.1|.+\.localhost|192\.168\.\d+\.\d+|10\.\d+\.\d+\.\d+)$/.test(location.hostname) ? `http://${location.hostname}:8787` : '');
const OUT_TTL = 120e3, OUT_POLL = 180e3;
S.out = { at:0, list:[], ok:null, busy:false };
async function srv(path, opts = {}) {
  const r = await fetch(srvUrl() + path, opts.body ? { ...opts, headers:{ 'content-type':'application/json' } } : opts);
  if (!r.ok) throw new Error(`The SPOODEX server answered ${r.status}`);
  return r.json();
}
const outOn = () => !!srvUrl() && !!S.u && !isGuest() && S.crew.logins.length > 0;
const outCrew = () => S.out.list.filter(x => !isMe(x.u) && x.until > Date.now());
const outMe = () => S.out.list.find(x => isMe(x.u) && x.until > Date.now());
async function loadOut(force) {
  if (!outOn() || S.out.busy || (!force && Date.now() - S.out.at < OUT_TTL)) return;
  S.out.busy = true;
  try { const d = await srv(`/out?u=${encodeURIComponent([S.login, ...S.crew.logins].join(','))}`); S.out.list = d.out || []; S.out.ok = true; }
  catch (e) { console.warn(e); S.out.ok = false; }
  S.out.at = Date.now(); S.out.busy = false;
  paintOut();
  if (!$('#app').classList.contains('hidden')) navHtml();
}
async function outSet(h) {
  try {
    if (h) { const d = await srv('/out', { method:'POST', body:JSON.stringify({ u:S.login, h }) }); S.out.list = [...S.out.list.filter(x => !isMe(x.u)), d]; track('spooding-now'); }
    else { await srv(`/out?u=${encodeURIComponent(S.login)}`, { method:'DELETE' }); S.out.list = S.out.list.filter(x => !isMe(x.u)); }
    S.out.ok = true;
  } catch (e) { toast(e.message); }
  paintOut();
}
const hhmm = t => new Date(t).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
function outHtml() {

  const me = outMe(), them = outCrew();

    ${S.out.ok == null ? '<p class="small muted">Checking…</p>' : them.length ? them.map(x => `<p><b>${esc(x.u)}</b> is out spooding <span class="small muted">since ${hhmm(x.at)}, until about ${hhmm(x.until)}</span></p>`).join('')
      : '<p class="small muted">Nobody in your crew is out right now.</p>'}
    ${me ? `<p>You're out until about <b>${hhmm(me.until)}</b> <button class="small" data-act="outGo" data-v="0">I'm back</button></p>`

/* ---------------- display case: a read-only showpiece link (v2.5) ---------------- */
// ?u=<login>&case shows that naturalist's 9 rarest genera (or ?u=<login>&case=<taxon id>,<taxon id>,… for their own picks, at most 9)
// on one page, without tabs and without touching the visitor's own SPOODEX: no lastLogin, no account, crew or events. Taxon ids only,
// never places (HANDOVER §9). The case owner's records are cached like a Compare rival, up to CASE_KEEP of them, newest first.
const CASE_N = 9, CASE_KEEP = 3;
const caseIds = (M, picks) => {
  const mine = (picks || []).filter(id => M.G.get(id)?.cover).slice(0, CASE_N);
  // the rarest from home first: a genus never recorded in the country would otherwise always outrank it; overseas ones fill any gap
  const home = g => refCount(g.id) != null ? 0 : 1;
  return mine.length ? mine : [...M.genera].filter(g => g.cover).sort((a, b) => home(a) - home(b) || rarestFirst(a, b)).slice(0, CASE_N).map(g => g.id);
};
const caseLink = (login, picks) => `${location.origin}${location.pathname.replace(/(index|spoodex)\.html$/, '')}?u=${encodeURIComponent(login)}&case${picks?.length ? '=' + picks.join(',') : ''}`;
function caseParts(login, M, ids) {
  const pid = M.home.country, hl = headline('country'), where = S.places[pid]?.n || '';
  const card = id => {
    const g = M.G.get(id), r = pid ? rarityOf(id, 'g', pid) : null, c = pid ? S.ref['p' + pid]?.g?.[id] : null;
    return `<a class="ccard${r && r.lv >= 2 ? ` rar rar${r.lv}` : ''}"${r && r.lv >= 2 ? ` style="--rc:${r.c}"` : ''} href="https://www.inaturalist.org/observations/${g.coverObs}" target="_blank" rel="noopener" title="Open the record on iNaturalist">
      <span class="ph" style="background-image:url('${esc(photoSize(g.cover, 'medium'))}')"></span>
      <span class="meta"><span class="nm"><i>${esc(g.name)}</i></span>${cnOf(id) ? `<span class="cn">${esc(cnOf(id))}</span>` : ''}
        ${r ? `<span class="rl">${rarityChip(r)} ${c != null ? `${fmt(c)} iNat record${c === 1 ? '' : 's'} in ${esc(where)}` : `recorded outside ${esc(where)}`}</span>` : ''}</span></a>`;
  };
  return { head:`<div class="hand">${titleHtml(M, login)}</div><p>Level <b>${M.G.size}</b>${hl ? ` · ${headlineHtml(hl)}` : ''}</p>`,
    cards:ids.length ? `<div class="casegrid">${ids.map(card).join('')}</div>` : '<p>No genera recorded yet.</p>' };
}
function caseHtml(login, { head, cards }) {
  const mine = store.get('lastLogin'), own = mine && store.get(ukey(mine)) && mine.toLowerCase() !== login.toLowerCase();
  const self = mine && mine.toLowerCase() === login.toLowerCase();
  return `<div class="casehead stk">${stickerHtml(stickerFor(login))}<div class="small muted mono">DISPLAY CASE</div>
      <h1>${esc(login)}</h1>${head}</div>${cards}
    <p class="row" style="margin-top:18px">${self ? `<a class="btnlink" href="?u=${encodeURIComponent(mine)}">Open my SPOODEX</a>`
      : own ? `<a class="btnlink" href="?u=${encodeURIComponent(mine)}&vs=${encodeURIComponent(login)}">Compare with mine</a>` : ''}
      ${self ? '' : `<a class="${own ? '' : 'btnlink'}" href="${location.pathname}">${own ? 'Open my SPOODEX' : 'Start your own SPOODEX'}</a>`}</p>`;
}
// The owner's default case, drawn at once for a first-time visitor (the case link in the launch posts) while the live one loads.
// Regenerate on ?u=themoojuice&case with caseSnapCode() in the console and paste over this line.
const CASE_SNAP = {"login":"themoojuice","ts":"2026-10-12","head":"<div class=\"hand\">Masterful <i>Mopsus</i></div><p>Level <b>58</b> · <b>57 / 81</b> genera on iNat in Australia · +1 elsewhere</p>","cards":"<div class=\"casegrid\"><a class=\"ccard rar rar5\" style=\"--rc:#c8322a\" href=\"https://www.inaturalist.org/observations/254324145\" target=\"_blank\" rel=\"noopener\" title=\"Open the record on iNaturalist\">\n      <span class=\"ph\" style=\"background-image:url('https://static.inaturalist.org/photos/455516695/medium.jpeg')\"></span>\n      <span class=\"meta\"><span class=\"nm\"><i>Maddisonia</i></span>\n        <span class=\"rl\"><span class=\"rchip\" style=\"--rc:#c8322a\" title=\"Exceptional: rarity by how few iNat records it has\">Exceptional</span> 1 iNat record in Australia</span></span></a><a class=\"ccard rar rar5\" style=\"--rc:#c8322a\" href=\"https://www.inaturalist.org/observations/383764989\" target=\"_blank\" rel=\"noopener\" title=\"Open the record on iNaturalist\">\n      <span class=\"ph\" style=\"background-image:url('https://static.inaturalist.org/photos/702453385/medium.jpg')\"></span>\n      <span class=\"meta\"><span class=\"nm\"><i>Metacyrba</i></span>\n        <span class=\"rl\"><span class=\"rchip\" style=\"--rc:#c8322a\" title=\"Exceptional: rarity by how few iNat records it has\">Exceptional</span> 1 iNat record in Australia</span></span></a><a class=\"ccard rar rar5\" style=\"--rc:#c8322a\" href=\"https://www.inaturalist.org/observations/327118838\" target=\"_blank\" rel=\"noopener\" title=\"Open the record on iNaturalist\">\n      <span class=\"ph\" style=\"background-image:url('https://static.inaturalist.org/photos/592571470/medium.jpg')\"></span>\n      <span class=\"meta\"><span class=\"nm\"><i>Huntiglennia</i></span>\n        <span class=\"rl\"><span class=\"rchip\" style=\"--rc:#c8322a\" title=\"Exceptional: rarity by how few iNat records it has\">Exceptional</span> 2 iNat records in Australia</span></span></a><a class=\"ccard rar rar4\" style=\"--rc:#2f6fb5\" href=\"https://www.inaturalist.org/observations/377396401\" target=\"_blank\" rel=\"noopener\" title=\"Open the record on iNaturalist\">\n      <span class=\"ph\" style=\"background-image:url('https://static.inaturalist.org/photos/690135137/medium.jpg')\"></span>\n      <span class=\"meta\"><span class=\"nm\"><i>Yamangalea</i></span>\n        <span class=\"rl\"><span class=\"rchip\" style=\"--rc:#2f6fb5\" title=\"Rare: rarity by how few iNat records it has\">Rare</span> 5 iNat records in Australia</span></span></a><a class=\"ccard rar rar4\" style=\"--rc:#2f6fb5\" href=\"https://www.inaturalist.org/observations/318585969\" target=\"_blank\" rel=\"noopener\" title=\"Open the record on iNaturalist\">\n      <span class=\"ph\" style=\"background-image:url('https://static.inaturalist.org/photos/575808691/medium.jpg')\"></span>\n      <span class=\"meta\"><span class=\"nm\"><i>Psenuc</i></span>\n        <span class=\"rl\"><span class=\"rchip\" style=\"--rc:#2f6fb5\" title=\"Rare: rarity by how few iNat records it has\">Rare</span> 5 iNat records in Australia</span></span></a><a class=\"ccard rar rar4\" style=\"--rc:#2f6fb5\" href=\"https://www.inaturalist.org/observations/407294211\" target=\"_blank\" rel=\"noopener\" title=\"Open the record on iNaturalist\">\n      <span class=\"ph\" style=\"background-image:url('https://static.inaturalist.org/photos/748447456/medium.jpg')\"></span>\n      <span class=\"meta\"><span class=\"nm\"><i>Chalcolecta</i></span>\n        <span class=\"rl\"><span class=\"rchip\" style=\"--rc:#2f6fb5\" title=\"Rare: rarity by how few iNat records it has\">Rare</span> 5 iNat records in Australia</span></span></a><a class=\"ccard rar rar4\" style=\"--rc:#2f6fb5\" href=\"https://www.inaturalist.org/observations/407662657\" target=\"_blank\" rel=\"noopener\" title=\"Open the record on iNaturalist\">\n      <span class=\"ph\" style=\"background-image:url('https://static.inaturalist.org/photos/749193560/medium.jpg')\"></span>\n      <span class=\"meta\"><span class=\"nm\"><i>Porius</i></span>\n        <span class=\"rl\"><span class=\"rchip\" style=\"--rc:#2f6fb5\" title=\"Rare: rarity by how few iNat records it has\">Rare</span> 6 iNat records in Australia</span></span></a><a class=\"ccard rar rar4\" style=\"--rc:#2f6fb5\" href=\"https://www.inaturalist.org/observations/407331877\" target=\"_blank\" rel=\"noopener\" title=\"Open the record on iNaturalist\">\n      <span class=\"ph\" style=\"background-image:url('https://static.inaturalist.org/photos/748527016/medium.jpg')\"></span>\n      <span class=\"meta\"><span class=\"nm\"><i>Coccorchestes</i></span>\n        <span class=\"rl\"><span class=\"rchip\" style=\"--rc:#2f6fb5\" title=\"Rare: rarity by how few iNat records it has\">Rare</span> 6 iNat records in Australia</span></span></a><a class=\"ccard rar rar3\" style=\"--rc:#e0b81c\" href=\"https://www.inaturalist.org/observations/281010169\" target=\"_blank\" rel=\"noopener\" title=\"Open the record on iNaturalist\">\n      <span class=\"ph\" style=\"background-image:url('https://static.inaturalist.org/photos/504762407/medium.jpg')\"></span>\n      <span class=\"meta\"><span class=\"nm\"><i>Phintella</i></span>\n        <span class=\"rl\"><span class=\"rchip\" style=\"--rc:#e0b81c\" title=\"Scarce: rarity by how few iNat records it has\">Scarce</span> 17 iNat records in Australia</span></span></a></div>"};
const caseSnapCode = () => `const CASE_SNAP = ${JSON.stringify({ login:S.caseLogin, ts:new Date().toISOString().slice(0, 10), ...caseParts(S.caseLogin, S.M, caseIds(S.M, [])) })};`;
async function showCase(login, picksQ) {
  track('case');
  const picks = (picksQ || '').split(',').map(Number).filter(n => Number.isInteger(n) && n > 0);
  $('#onboard').classList.add('hidden'); $('#app').classList.add('hidden');
  const box = document.createElement('main'); box.id = 'caseView'; box.className = 'wrap'; document.body.append(box);
  const cases = store.get('cases', {}), key = login.toLowerCase(), hit = cases[key];
  const save = hit?.save || { obs:{}, meta:{} };
  S.prefs = { ...S.prefs, scope:'country' };   // the case speaks for its owner's country; never saved
  const draw = async () => {
    S.M = buildModel(save.obs, null);
    if (S.M.home.country) await ensureRefPlace(S.M.home.country).catch(() => {});
    const ids = caseIds(S.M, picks);
    await ensureInfo(ids).catch(() => {});
    box.innerHTML = caseHtml(login, caseParts(login, S.M, ids));
  };
  S.caseLogin = login;
  if (hit) await draw();
  else if (CASE_SNAP?.login === key && !picks.length) box.innerHTML = caseHtml(login, CASE_SNAP);
  else box.innerHTML = `<div class="panel" style="margin-top:24px"><h2>Opening ${esc(poss(login))} display case</h2><p class="small mono" id="caseLog">Asking iNaturalist…</p></div>`;
  try {
    await importRecords(login, save, { log:line => { const el = $('#caseLog'); if (el) el.textContent = line; } });
    saveShared();
    cases[key] = { save, ts:Date.now() };
    const keep = Object.entries(cases).sort((a, b) => b[1].ts - a[1].ts).slice(0, CASE_KEEP);
    if (!store.set('cases', Object.fromEntries(keep))) store.del('cases');
    await draw();
  } catch (e) { if (!hit && !$('#caseView .casegrid')) box.innerHTML = `<div class="panel" style="margin-top:24px"><p>${esc(noUser(e, login))}</p><a class="btnlink" href="${location.pathname}">Open SPOODEX</a></div>`; }
}
// The owner's side: pick up to 9 genera for the case, then copy or share the link
function caseEditor() {
  const M = S.M, picks = (S.u.casePicks || []).filter(id => M.G.has(id)), shown = caseIds(M, picks);
  const all = [...M.genera].filter(g => g.cover).sort(rarestFirst);
  $('#modalRoot').innerHTML = `<div class="overlay" data-close="1"><div class="modal" style="width:min(880px,100%)"><button class="x" data-close="1">✕</button><div class="body">
    <h2>Display case</h2>
    <p class="small">A page of your ${shown.length === CASE_N ? 9 : shown.length} ${picks.length ? 'chosen' : 'rarest'} genera for anyone with the link. No places are shown.</p>
    <p class="row"><button class="primary" data-act="caseCopy">🔗 Copy link</button>${navigator.share ? '<button data-act="caseShare">📤 Share</button>' : ''}
      <a href="${esc(caseLink(S.login, picks))}" target="_blank" rel="noopener">Preview ↗</a></p>
    <h3 style="margin-top:14px">${picks.length ? `Your picks (${picks.length} of ${CASE_N})` : `Your ${CASE_N} rarest, until you pick your own`}</h3>
    <div class="casepick">${all.map(g => `<button class="${picks.includes(g.id) ? 'on' : ''}" data-act="casePick" data-v="${g.id}" aria-pressed="${picks.includes(g.id)}">
      <span class="ph" style="background-image:url('${esc(photoSize(g.cover, 'small'))}')"></span><i>${esc(g.name)}</i></button>`).join('')}</div></div></div></div>`;
}
function casePick(id) {
  const picks = (S.u.casePicks || []).filter(x => S.M.G.has(x));
  S.u.casePicks = picks.includes(id) ? picks.filter(x => x !== id) : picks.length < CASE_N ? [...picks, id] : picks;
  if (picks.length >= CASE_N && !picks.includes(id)) toast(`A case holds ${CASE_N}. Unpick one first.`);
  saveUser(); caseEditor();
}
async function caseShare(native) {
  const url = caseLink(S.login, (S.u.casePicks || []).filter(id => S.M.G.has(id)));
  if (native && navigator.share) { try { await navigator.share({ title:`${poss(S.login)} SPOODEX display case`, url }); } catch {} return; }
  try { await navigator.clipboard.writeText(url); toast('Display case link copied'); } catch { window.prompt('Copy this link:', url); }
}

// ?u=<login> opens that SPOODEX (importing it if needed); ?vs=<login> jumps to Compare.
// Otherwise a returning player opens straight from cache, then quietly syncs.
// Shared caches get their defaults when the script loads, before IndexedDB is open; re-read them once it is.
const PERSISTED = ['nodes', 'places', 'info', 'ref', 'observers', 'pheno', 'ladder', 'crew', 'pioneer', 'haunts', 'trip', 'elev', 'wx', 'events', 'frontier', 'ownph', 'notes', 'lore', 'facts', 'ccph'];
(async function boot() {
  track(location.pathname, false);
  registerSW(); netState();
  await store.init();
  for (const k of PERSISTED) S[k] = store.get(k, S[k]);
  // a read cut short by closing the page is saved as still queued, which would block every later refresh
  for (const E of Object.values(S.events)) delete E.queued;
  store.del('report');   // the Spood Report (This week tab) was removed in v2.2
  const q = new URLSearchParams(location.search);
  const u = cleanLogin(q.get('u'));
  S.pendingVs = cleanLogin(q.get('vs')) || null;
  S.pendingCrew = q.get('crew') ? q.get('crew').split(',').map(cleanLogin).filter(Boolean) : null;
  S.pendingEv = (q.get('ev') || '').trim() || null;
  $('#landSticker').src = STICKERS[1]; $('#impSticker').src = STICKERS[3];
  if (u && q.has('case')) { showCase(u, q.get('case')); return; }
  const target = u || cleanLogin(store.get('lastLogin'));
  if (target && store.get(ukey(target))) {
    loadUser(target);
    try { S.M = buildModel(); enterApp(); doSync(false); return; } catch (e) { console.warn(e); }
  }
  loadLanding(!u && !S.pendingEv);   // photos for a first-time visitor; with ?u= the import goes first
  if (u) { $('#loginInput').value = u; onboard(u); }
  else if (S.pendingEv) { const ev = evParse(S.pendingEv); if (ev?.m === 'dare') { loadLanding(true); dareBanner(ev); } else startGuest(); }   // an event link opened by someone new: a dare gets the landing (v2.5), the rest open as a guest
})();
</script>
