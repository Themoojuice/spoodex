<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPOODEX</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e7d8b9">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="SPOODEX">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ---------- Chassis themes: the instrument evolves with the player ---------- */
:root, [data-chassis="notebook"] {
  --bg:#e7d8b9; --panel:#f5ecd6; --panel2:#efe2c3; --ink:#2b2419; --muted:#6d604a;
  --accent:#a8412a; --lit:#2f6b3a; --line:#c4ad84; --dim:#cdbb96; --glow:none;
  --head:'Special Elite', 'Courier New', monospace; --body:'IBM Plex Mono', ui-monospace, monospace;
  --radius:4px; --paper:repeating-linear-gradient(0deg, transparent 0 27px, rgba(80,60,30,.08) 27px 28px);
}
[data-chassis="kit"] {
  /* Field guide: herbarium paper, eucalypt sage, ochre */
  --bg:#e4e2d3; --panel:#faf7ee; --panel2:#efebdc; --ink:#23291f; --muted:#5f6a56;
  --accent:#b5651d; --lit:#4f7a45; --line:#b9b89e; --dim:#d9d8c4; --glow:none;
  --head:'Fraunces', Georgia, serif; --radius:8px;
  --paper:radial-gradient(circle at 20% 10%, rgba(120,140,90,.08), transparent 40%), radial-gradient(circle at 90% 80%, rgba(180,120,40,.06), transparent 45%);
}
[data-chassis="cabinet"] {
  /* Museum specimen cabinet: walnut, brass, cream labels */
  --bg:#2e221a; --panel:#f6eedb; --panel2:#ebdfc2; --ink:#2a2118; --muted:#6e5c46;
  --accent:#8f6420; --lit:#3f6b3a; --line:#b89f72; --dim:#dccfb0; --glow:none;
  --head:'Fraunces', Georgia, serif; --radius:3px;
  --paper:repeating-linear-gradient(95deg, rgba(0,0,0,.05) 0 3px, transparent 3px 9px, rgba(255,220,170,.025) 9px 11px, transparent 11px 17px);
}
[data-chassis="cabinet"] header.top { background:#1f1712; border-bottom-color:#8f6420; color:#efe4cc; }
[data-chassis="cabinet"] header.top .muted, [data-chassis="cabinet"] .brand .sub { color:#c9b48f; }
[data-chassis="cabinet"] header.top h1 { color:#e2bf7a; }
[data-chassis="cabinet"] nav.tabs button { color:#efe4cc; }
[data-chassis="cabinet"] header.top .lvl button { color:var(--ink); }
[data-chassis="cabinet"] nav.tabs button.on { color:var(--ink); }
[data-chassis="cabinet"] #view > h2, [data-chassis="cabinet"] #view > h3, [data-chassis="cabinet"] #view > p,
[data-chassis="cabinet"] #tripPlan > h2, [data-chassis="cabinet"] #tripPlan > p { color:#efe4cc; }
[data-chassis="cabinet"] #view > h3 .muted { color:#c9b48f; }
[data-chassis="cabinet"] .panel, [data-chassis="cabinet"] .card { box-shadow:0 2px 0 #1a120d, 0 6px 16px rgba(0,0,0,.35); }
[data-chassis="cabinet"] .panel { border-top:3px solid #b08a45; }
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:var(--bg); background-image:var(--paper); color:var(--ink); font:14px/1.5 var(--body); min-height:100vh; }
a { color:var(--accent); }
button, select, input { font:inherit; color:inherit; }
button { cursor:pointer; background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:6px 12px; }
button:hover { border-color:var(--accent); }
button.primary { background:var(--accent); color:var(--panel); border-color:var(--accent); font-weight:600; }
input, select { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:6px 10px; }
h1,h2,h3 { font-family:var(--head); font-weight:400; margin:0 0 8px; letter-spacing:.02em; }
.wrap { max-width:1180px; margin:0 auto; padding:0 16px 60px; }
.muted { color:var(--muted); }
.small { font-size:12px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
.bar { height:10px; background:var(--dim); border-radius:99px; overflow:hidden; min-width:80px; flex:1; }
.bar > i { display:block; height:100%; background:var(--lit); box-shadow:var(--glow); }
.chip { display:inline-block; padding:2px 8px; border:1px solid var(--line); border-radius:99px; font-size:12px; background:var(--panel2); }
.chip.on { background:var(--accent); color:var(--panel); border-color:var(--accent); }
.hand { font-family:'Caveat', cursive; font-size:20px; color:var(--accent); }
.hidden { display:none !important; }
.btnlink { display:inline-block; padding:6px 12px; border-radius:var(--radius); background:var(--accent); color:var(--panel); text-decoration:none; font-weight:600; border:1px solid var(--accent); }
table.cmp { width:100%; border-collapse:collapse; font-size:13px; }
table.cmp td, table.cmp th { padding:4px 6px; border-bottom:1px solid var(--dim); text-align:left; }
.card.gilded { border:2px solid #b08a45; box-shadow:inset 0 0 0 2px #e2bf7a; }
.leaflet-popup-content button { font:13px var(--body); }
.pheno { display:grid; grid-template-columns:repeat(12,1fr); gap:3px; height:80px; align-items:end; max-width:420px; }
.pheno div { height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
.pheno i { display:block; width:100%; min-height:2px; background:var(--dim); border-radius:2px 2px 0 0; }
.pheno i.now { background:var(--accent); }
.pheno span { font-size:10px; color:var(--muted); }
.inseason { color:var(--lit); }
.fix { margin:1px 0 4px 26px; }
.card .rar { position:absolute; top:6px; right:6px; z-index:2; font-size:11px; color:#e2bf7a; text-shadow:0 1px 2px #000; letter-spacing:1px; }
.sprow { display:flex; gap:10px; align-items:center; padding:4px 0; border-bottom:1px dashed var(--dim); }
.sprow .thumb { width:42px; height:42px; flex:none; border-radius:var(--radius); background:var(--panel2) center/cover; }
.sprow .thumb.unknown { filter:grayscale(1) sepia(.6) blur(3px) brightness(.6); }
.sprow:not(.have) { color:var(--muted); }
.vs { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:stretch; }
.vs .side { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; text-align:center; }
.vsmark { align-self:center; font:600 38px var(--head); color:#e2bf7a; text-shadow:0 2px 0 #8f6420; }
.mosaic { display:grid; grid-template-columns:1fr 1fr; gap:3px; aspect-ratio:1; max-width:220px; margin:0 auto 10px; }
.mosaic i { background:var(--panel2) center/cover; border-radius:2px; }
.prestige { font:600 30px var(--head); color:var(--accent); margin-top:6px; }
.envy .big { font-size:17px; margin:4px 0; }
.envy .big b { font:600 30px var(--head); color:var(--accent); }
.tug { display:flex; height:18px; border-radius:99px; overflow:hidden; border:1px solid var(--line); margin:12px 0 4px; }
.tug i:first-child { background:var(--lit); } .tug i:last-child { background:var(--accent); }
.jewels { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.jewel { position:relative; border-radius:var(--radius); overflow:hidden; aspect-ratio:4/5; background:var(--panel2) center/cover; border:2px solid #b08a45; box-shadow:inset 0 0 0 2px #e2bf7a; cursor:pointer; }
.jewel .lab { position:absolute; left:0; right:0; bottom:0; padding:8px; background:linear-gradient(transparent, rgba(20,12,6,.88) 40%); color:#f6eedb; }
.stars { color:#e2bf7a; letter-spacing:2px; }
td.win { font-weight:700; color:var(--lit); }
.tablewrap { overflow-x:auto; }
table.ladder { width:100%; border-collapse:collapse; }
table.ladder td, table.ladder th { padding:6px 8px; border-bottom:1px solid var(--dim); text-align:left; vertical-align:middle; }
table.ladder th { font-weight:400; color:var(--muted); font-size:12px; white-space:nowrap; }
table.ladder .n, table.cmp .n { text-align:right; font-variant-numeric:tabular-nums; }
table.ladder th.sorted, table.ladder td.sorted { color:var(--accent); font-weight:600; }
table.ladder td.rk { font:600 18px var(--head); width:3em; white-space:nowrap; }
table.ladder td.who { white-space:nowrap; }
table.ladder td.acts { white-space:nowrap; text-align:right; }
table.ladder td.acts button { padding:3px 8px; font-size:12px; }
table.ladder tr.me td { background:var(--panel2); font-weight:600; }
table.ladder tr.me td:first-child { box-shadow:inset 4px 0 0 var(--accent); }
table.ladder tr.pending td { color:var(--muted); }
.avatar { width:28px; height:28px; border-radius:50%; background:var(--panel2) center/cover; display:inline-block; vertical-align:middle; margin-right:8px; border:1px solid var(--line); }
table.matrix td.have, table.matrix th.have { text-align:center; color:var(--lit); white-space:nowrap; }
table.matrix tr.solo td { background:var(--panel2); }
table.matrix tr.solo td:last-child { color:var(--accent); font-weight:600; }
table.matrix tr.all td:last-child { color:var(--lit); }
.report .mast { font:400 44px/1.1 'Special Elite', 'Courier New', monospace; text-align:center; border-bottom:3px double var(--line); padding-bottom:6px; }
.report .dateline { text-align:center; font-size:12px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); margin:6px 0 10px; }
.report .headline { justify-content:space-around; text-align:center; }
.report .headline b { display:block; font:600 34px var(--head); color:var(--accent); }
.report .headline span { font-size:12px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
p.story { margin:0 0 8px; padding-bottom:8px; border-bottom:1px dashed var(--dim); }
.wslide { min-height:400px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px 8px; }
.wslide .kick { letter-spacing:.3em; font-size:12px; color:var(--muted); }
.wslide .huge { font:600 76px/1.05 var(--head); color:var(--accent); margin:10px 0; }
.wslide .huge .unit { font-size:26px; display:block; color:var(--ink); font-weight:400; }
.wslide .line { font-size:16px; margin:4px 0; }
.wslide .mosaic.wide { grid-template-columns:repeat(3,1fr); aspect-ratio:3/2; max-width:330px; width:100%; }
.wslide .favpic { display:block; width:220px; margin:10px auto 0; }
.wslide .cardcanvas { max-width:360px; }
.wdots { display:flex; gap:6px; } .wdots i { width:8px; height:8px; border-radius:50%; background:var(--dim); } .wdots i.on { background:var(--accent); }
.feed { padding:6px 0; border-bottom:1px dashed var(--dim); }
nav.tabs button .news { color:var(--accent); font-size:10px; vertical-align:super; }
.posters { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; }
.poster { background:#efe1bf; background-image:radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 45%), radial-gradient(circle at 85% 90%, rgba(120,80,30,.18), transparent 50%);
  color:#3a2a18; border:1px solid #b89f72; box-shadow:0 3px 12px rgba(0,0,0,.28); padding:14px 14px 12px; text-align:center; cursor:pointer; transform:rotate(-.6deg); transition:transform .15s; }
.poster:nth-child(even) { transform:rotate(.7deg); }
.poster:hover { transform:scale(1.02); }
.poster .wtitle { font:400 44px/1 'Special Elite', 'Courier New', monospace; letter-spacing:.14em; border-bottom:3px double #6b5234; padding-bottom:4px; }
.poster .wtier { font:600 11px 'IBM Plex Mono', monospace; letter-spacing:.18em; margin-top:6px; color:#8a3b22; }
.poster .wph { aspect-ratio:1; background:#d9c7a0 center/cover; filter:sepia(.5) contrast(1.05); border:6px solid #f7eed8; box-shadow:0 1px 3px rgba(0,0,0,.3); margin:10px 0 2px; }
.poster .wcredit { font:10px 'IBM Plex Mono', monospace; color:#7a6548; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.poster .wname { font:italic 600 26px Fraunces, Georgia, serif; margin-top:6px; }
.poster .wtribe { font:12px 'IBM Plex Mono', monospace; color:#6d5a40; }
.poster .wwhy { list-style:none; padding:0; margin:8px 0; font:12px/1.5 'IBM Plex Mono', monospace; text-align:left; }
.poster .wwhy li { padding:2px 0; border-bottom:1px dotted rgba(107,82,52,.35); }
.poster .wreward { font:14px 'Special Elite', 'Courier New', monospace; letter-spacing:.12em; border-top:2px solid #6b5234; padding-top:6px; }
table.cal { border-collapse:collapse; width:100%; font-size:12px; }
table.cal th { font-weight:400; color:var(--muted); }
table.cal td, table.cal th { padding:3px 2px; text-align:center; }
table.cal td.nm { text-align:left; white-space:nowrap; padding-right:8px; }
table.cal td.m i { display:block; height:16px; border-radius:2px; background:var(--lit); }
table.cal .now { box-shadow:inset 0 0 0 2px var(--accent); }
table.cal tr[data-act] { cursor:pointer; }
table.cal tr[data-act]:hover td { background:var(--panel2); }
#caseMap { height:320px; border-radius:var(--radius); border:1px solid var(--line); margin-bottom:8px; }
#tripMap { height:380px; border-radius:var(--radius); border:1px solid var(--line); isolation:isolate; }
.tripstat { gap:28px; align-items:flex-start; }
.set.complete { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
details.set > summary, .set details > summary { cursor:pointer; }
.card.bounty, .card.lead { color:inherit; text-decoration:none; }
.card.lead .nm { font-style:normal; }
.card.lead .ph { display:block; }
.card.lead .few { color:var(--accent); }
.lacts { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:4px; font-size:12px; font-weight:600; }
details.tips { background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:8px 12px; margin-top:8px; }
details.tips summary { cursor:pointer; }
.tiplist { margin:8px 0 2px; padding-left:0; list-style:none; display:grid; gap:4px; }
.tiplist span { display:inline-block; width:1.6em; text-align:center; }
.card .nophoto { position:absolute; inset:0; display:grid; place-items:center; font-size:12px; color:var(--muted); }
.card.bounty .badge { z-index:1; }
.news-panel { border-left:4px solid var(--accent); }
.tripstat b { display:block; font:600 30px var(--head); color:var(--accent); line-height:1.1; }
.cardcanvas { width:100%; max-width:540px; height:auto; display:block; margin:0 auto 12px; border-radius:4px; box-shadow:0 6px 20px rgba(0,0,0,.25); }
@media (max-width:600px) { .vs { grid-template-columns:1fr; } .vsmark { text-align:center; } .mosaic { max-width:150px; } }

/* ---------- Header ---------- */
header.top { position:sticky; top:0; z-index:500; background:var(--bg); border-bottom:2px solid var(--line); }
header.top .wrap { padding-top:10px; padding-bottom:0; }
.brand { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.brand h1 { font-size:26px; margin:0; }
.brand .sub { color:var(--muted); font-size:12px; }
.lvl { margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.lvl b { font-family:var(--head); font-size:18px; }
nav.tabs { display:flex; gap:4px; margin-top:8px; overflow-x:auto; scrollbar-width:none; }
nav.tabs button { border-bottom:none; border-radius:var(--radius) var(--radius) 0 0; background:transparent; white-space:nowrap; }
nav.tabs button.on { background:var(--panel); border-color:var(--line); font-weight:600; }
nav.tabs button .lock { opacity:.6; font-size:11px; }
main { padding-top:18px; }

/* ---------- Onboarding ---------- */
#onboard { min-height:100vh; padding:20px 16px 40px; }
#onboard .land, #onboard .box { max-width:920px; margin:0 auto; }
#onboard .land { display:flex; flex-direction:column; gap:16px; }
#onboard .box { margin-top:16px; }
#onboard h1 { font-size:44px; margin:0; }
.landhead .pitch { font:500 21px/1.35 Fraunces, Georgia, serif; margin:4px 0 0; max-width:34em; }
.landstrip { display:grid; grid-auto-flow:column; grid-auto-columns:136px; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -16px; padding:0 16px 6px; scrollbar-width:thin; }
@media (min-width:760px) { .landstrip { grid-auto-flow:row; grid-template-columns:repeat(6, minmax(0, 1fr)); overflow:visible; margin:0; padding:0; } }
.lcard { scroll-snap-align:start; display:flex; flex-direction:column; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; color:inherit; text-decoration:none; }
a.lcard:hover { border-color:var(--accent); }
.lcard .ph { display:block; aspect-ratio:1; background:var(--panel2) center/cover no-repeat; }
.lcard.blank .ph { animation:pulse 1.4s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity:.55; } }
.lcard .nm { padding:6px 8px 0; font:italic 600 15px var(--head); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lcard .cn, .card .cn, .rcard .cn { font-size:11.5px; line-height:1.3; color:var(--ink); }
.lcard .cn { padding:0 8px; }
.lcard .cr { margin-top:auto; padding:3px 8px 6px; font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.landstarts { display:flex; flex-direction:column; gap:12px; max-width:560px; }
.landstarts button.big { min-height:58px; font-size:17px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.landstarts button.big small { font-weight:400; font-size:13px; }
#loginForm label { display:block; font-weight:600; margin-bottom:8px; }
.profhero h1 { font-size:36px; margin:4px 0 0; }
.herobtns { gap:6px; margin:10px 0 0; }
.herobtns button { padding:5px 10px; font-size:13px; }
.spoods { display:grid; grid-auto-flow:column; grid-auto-columns:116px; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin; }
.spoods .lcard { cursor:pointer; }
.spoods .lcard .cn { padding-bottom:6px; }
#impBox h2 { margin-bottom:4px; }
#impLine { margin:0 0 10px; }
.revgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; margin:12px 0 8px; perspective:900px; }
@media (max-width:600px) { .revgrid { grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; } }
.rcard { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; min-width:0; }
.rcard .ph { display:block; aspect-ratio:1; background:var(--panel2) center/cover no-repeat; filter:grayscale(1) sepia(.6) blur(7px) brightness(.6) contrast(1.2); transition:filter .8s ease-out; }
.rcard::after { content:'?'; position:absolute; top:0; left:0; right:0; aspect-ratio:1; display:grid; place-items:center; font:44px var(--head); color:var(--ink); opacity:.55; transition:opacity .3s; pointer-events:none; }
.rcard .nm { padding:5px 7px 0; font:italic 600 14px var(--head); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rcard .nm.q { font-style:normal; letter-spacing:.2em; color:var(--muted); }
.rcard .cn { display:block; padding:0 7px 6px; min-height:1.4em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rcard.on { cursor:pointer; border-color:var(--accent); animation:flip .6s ease-out; }
.rcard.on .ph { filter:none; }
.rcard.on::after { opacity:0; }
@keyframes flip { from { transform:rotateY(90deg); } to { transform:none; } }
.revend h2 { font-size:30px; margin:2px 0 0; }
.finds { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; }
.fcard { display:flex; flex-direction:column; background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; color:inherit; min-width:0; }
.fcard:hover { border-color:var(--accent); }
.fcard .ph { aspect-ratio:4/3; background:var(--dim) center/cover no-repeat; }
.fcard .ph.none { display:grid; place-items:center; font:40px var(--head); color:var(--muted); }
.fcard .meta { padding:8px 10px 10px; display:flex; flex-direction:column; gap:2px; }
.fcard .nm { font:italic 600 18px var(--head); }
.fcard .cr { font-size:10px; color:var(--muted); margin-top:2px; }
@media (max-width:600px) { .finds { grid-template-columns:1fr; gap:8px; } .fcard { flex-direction:row; } .fcard .ph { width:104px; flex:none; aspect-ratio:1; } }

/* ---------- Dex grid ---------- */
.dexgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; position:relative; transition:transform .12s; }
.card:hover { transform:translateY(-2px); border-color:var(--accent); }
.card .ph { aspect-ratio:1; background:var(--panel2) center/cover no-repeat; position:relative; }
.card.unknown .ph, .modal .hero.unknown { filter:grayscale(1) sepia(.6) blur(7px) brightness(.6) contrast(1.2); }

</div>

<div id="fieldRoot"></div>
<div id="modalRoot"></div>

<script>
'use strict';
/* =====================================================================
   SPOODEX — single-file prototype
   Layers:  api (throttled iNat client) → sync (incremental import + cache)
            → model (pure derivation: genera, states, mastery, XP, quests)
            → views (render functions per screen)
   Saves live in IndexedDB (prefs in localStorage); iNaturalist is the source of truth.
   ===================================================================== */

const SALTICIDAE = 48139;               // iNat taxon id for Salticidae
const API = 'https://api.inaturalist.org/v1';
const ID_AID = 'https://themoojuice.github.io/Identification-aid/';   // owner's genus key (separate repo, own Pages site)
const API2 = 'https://api.inaturalist.org/v2';   // v2 lets us ask for only the fields we need
const REF_TTL = 7 * 864e5;              // regional reference trees refresh weekly
const FULL_RESYNC_AFTER = 14 * 864e5;   // periodic full resync catches deletions / re-IDs out of Salticidae

// iNat controlled terms (verified against /v1/controlled_terms)
const ANN = { MALE:'9|11', FEMALE:'9|10', ADULT:'1|2', JUV:'1|8', NYMPH:'1|5', EGG:'22|30', MOLT:'22|28', CONSTRUCTION:'22|35' };

// Heuristic behaviour detection from description / tags / observation fields
const BEH_RX = {
  feed:  /\b(feed\w*|fed|prey|eating|meal|caught|captur\w*|kill\w*)\b/i,
  court: /\b(court\w*|mating|mated|copulat\w*|display\w*|danc\w*)\b/i,
  egg:   /\b(egg ?sacs?|eggs|brood\w*|guard\w*|spiderlings?|retreat|nest|moult\w*|molt\w*|exuvi\w*)\b/i,
};

const TIERS = [
  { min:0,   name:'SPOODEX Mk 0',          sub:'A slightly suspicious digital notebook', chassis:'notebook', module:'Genus records & nearby scanner' },
  { min:5,   name:'Field Notebook',        sub:'Now with a pencil. Region statistics installed.', chassis:'notebook', module:'Region statistics' },
  { min:15,  name:'SPOODEX Mk II',         sub:'Laminated. Mostly waterproof. Lineage tree installed.', chassis:'kit', module:'Lineage tree' },
  { min:30,  name:'SPOODEX Mk III',        sub:'Rarity ledgers installed.', chassis:'kit', module:'Rarity ledgers' },
  { min:50,  name:'Naturalist Cabinet',    sub:'Brass fittings. Mastery ledgers installed.', chassis:'cabinet', module:'Mastery XP ledger' },
  { min:75,  name:'Arachnologist Rig',     sub:'Gilt edges on everything you have mastered.', chassis:'cabinet', module:'Gilded labels for mastered genera' },
  { min:100, name:'Spood Research Station',sub:'Please wipe your boots.', chassis:'cabinet', module:'Everything, plus smugness' },
];
const tierIdx = n => TIERS.reduce((a,t,i)=> n>=t.min ? i : a, 0);

const CRITERIA = [
  { k:'male',      icon:'♂', label:'Photograph a male' },
  { k:'female',    icon:'♀', label:'Photograph a female' },
  { k:'juv',       icon:'◦', label:'Photograph a juvenile' },
  { k:'feed',      icon:'🍴', label:'Record feeding / prey capture' },
  { k:'court',     icon:'💃', label:'Record courtship or display' },
  { k:'egg',       icon:'🕸', label:'Silk & brood: egg sac, retreat, nest or moult' },
  { k:'places',    icon:'📍', label:'Record at 3+ localities (~10 km apart)' },
  { k:'months',    icon:'🗓', label:'Record in 3+ different months' },
  { k:'supported', icon:'🤝', label:'Community-supported genus ID' },
  { k:'species',   icon:'🔬', label:'An observation identified to species' },
];
const MASTERY_AT = 7;

/* ---------------- utils ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => (n ?? 0).toLocaleString();
const pct = (a,b) => b ? Math.min(100, Math.round(100*a/b)) : 0;
const ordinal = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const photoSize = (url, size) => url ? url.replace(/\/(square|thumb|small|medium|large|original)\./, `/${size}.`) : '';
const stripHtml = s => { const d = document.createElement('div'); d.innerHTML = s || ''; return d.textContent; };
const cellLabel = c => c && c.label ? esc(c.label + (c.near ? ` (near ${c.near})` : '')) : c ? `${Math.abs(c.lat).toFixed(2)}°${c.lat<0?'S':'N'} ${Math.abs(c.lng).toFixed(2)}°${c.lng<0?'W':'E'}` : '';
const cellKey = (lat, lng, deg) => `${Math.floor(lat/deg)}:${Math.floor(lng/deg)}`;

// Saves live in IndexedDB (localStorage caps out around 5 MB). Reads come from an in-memory copy loaded once at boot,
// so store.get/set stay synchronous; writes are batched into IndexedDB in the background. Prefs and the last login
// stay in localStorage. Where IndexedDB is unavailable, everything falls back to localStorage as before.
const LS_ONLY = new Set(['prefs', 'lastLogin']);
const store = {
  db: null, mem: new Map(), dirty: new Map(), timer: 0, warned: false,
  idb(k) { return this.db && !LS_ONLY.has(k); },
  async init() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('spoodex', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('IndexedDB blocked'));
      });
      await new Promise((res, rej) => {
        const tx = this.db.transaction('kv'), cur = tx.objectStore('kv').openCursor();
        cur.onsuccess = () => { const c = cur.result; if (c) { this.mem.set(c.key, c.value); c.continue(); } };
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    } catch (e) { console.warn('SPOODEX: IndexedDB unavailable, using localStorage', e); this.db = null; return; }
    // One-time move of older localStorage saves; they're only removed once IndexedDB has them
    try {
      const moved = [];
      for (let i = 0; i < localStorage.length; i++) {
        const lk = localStorage.key(i), k = lk.slice(8);
        if (!lk.startsWith('spoodex:') || LS_ONLY.has(k)) continue;
        if (!this.mem.has(k)) { const v = localStorage.getItem(lk); this.mem.set(k, v); this.dirty.set(k, v); }
        moved.push(lk);
      }
      if (moved.length) { await this.flush(); moved.forEach(lk => localStorage.removeItem(lk)); }
    } catch (e) { console.warn('SPOODEX: could not move old saves', e); }
  },
  get(k, d=null) {
    try { const v = this.idb(k) ? this.mem.get(k) : localStorage.getItem('spoodex:'+k); return v == null ? d : JSON.parse(v); }
    catch { return d; }
  },
  set(k, v) {
    try {
      const j = JSON.stringify(v);
      if (this.idb(k)) { this.mem.set(k, j); this.dirty.set(k, j); this.later(); }
      else localStorage.setItem('spoodex:'+k, j);
      return true;
    } catch (e) { console.warn('SPOODEX storage write failed', e); return false; }
  },
  del(k) {
    if (this.idb(k)) { this.mem.delete(k); this.dirty.set(k, undefined); this.later(); }
    else try { localStorage.removeItem('spoodex:'+k); } catch {}
  },
  later() { if (!this.timer) this.timer = setTimeout(() => this.flush().catch(() => {}), 300); },
  flush() {
    clearTimeout(this.timer); this.timer = 0;
    if (!this.db || !this.dirty.size) return Promise.resolve();
    const batch = [...this.dirty]; this.dirty.clear();
    return new Promise((res, rej) => {
      const tx = this.db.transaction('kv', 'readwrite'), os = tx.objectStore('kv');
      for (const [k, v] of batch) v === undefined ? os.delete(k) : os.put(v, k);
      tx.oncomplete = () => res();
      tx.onabort = () => {
        for (const [k, v] of batch) if (!this.dirty.has(k)) this.dirty.set(k, v);   // retried with the next write
        if (!this.warned) { this.warned = true; toast('Browser storage is full; some progress may re-import next time.'); }
        rej(tx.error);
      };
    });
  },
  async usage() { try { return (await navigator.storage.estimate()).usage || 0; } catch { return 0; } },
};
addEventListener('pagehide', () => store.flush().catch(() => {}));
document.addEventListener('visibilitychange', () => { if (document.hidden) store.flush().catch(() => {}); });

/* ---------------- api: throttled to ~1 req/s per iNat recommended practice ---------------- */
let nextSlot = 0;
async function api(path, params = {}, base = API) {
  const qs = new URLSearchParams(Object.entries(params).filter(([,v]) => v != null && v !== '')).toString();
  const url = `${base}${path}${qs ? '?'+qs : ''}`;
  for (let attempt = 0; attempt < 5; attempt++) {
    if (!navigator.onLine) throw new Error('Offline');
    const now = Date.now(), slot = Math.max(now, nextSlot);
    nextSlot = slot + 1100;
    if (slot > now) await sleep(slot - now);
    let r;
    // Back off the whole queue, not just this call, so queued requests don't keep hammering a rate-limited API.
    // iNat's 429s carry no CORS header, so in a browser they surface as network errors rather than status 429.
    const backoff = async () => { const wait = 5000 * (attempt+1); nextSlot = Math.max(nextSlot, Date.now() + wait); await sleep(wait); };
    try { r = await fetch(url); } catch (e) { if (!navigator.onLine) throw new Error('Offline'); await backoff(); continue; }
    if (r.status === 429 || r.status >= 500) { await backoff(); continue; }
    if (!r.ok) throw new Error(`iNaturalist returned ${r.status} for ${path}`);
    return r.json();
  }
  throw new Error('iNaturalist is busy or rate-limiting; try again in a minute.');
}

/* ---------------- state ---------------- */
const S = {
  login: null,
  u: null,       // per-user save: {obs, meta, seen, scans, completed, lastQuests}
  nodes: store.get('nodes', {}),   // taxon id -> {n:name, r:rank, l:rank_level, p:parent}
  places: store.get('places', {}), // place id -> {n, l:admin_level}
  info: store.get('info', {}),     // genus id -> {p:photo, s:summary, w:wiki url, a:attribution, c:obs count}
  ref: store.get('ref', {}),       // scopeKey -> {ts, g:{genusId: recordCount}}
  observers: store.get('observers', {}),
  pheno: store.get('pheno', {}),       // `${genus}:${place}` -> {ts, m:[12 month counts]}
  prefs: store.get('prefs', { scope:'country', reveal:false, peek:false, chassis:'auto', filter:'all' }),
  tab: 'profile',
  M: null,       // derived model
};
const ukey = l => 'u:' + String(l).toLowerCase();
function saveUser() { if (!store.set(ukey(S.login), S.u)) toast('Browser storage is full; progress will re-import next time.'); }
function saveShared() { store.set('nodes', S.nodes); store.set('places', S.places); store.set('info', S.info); store.set('ref', S.ref); store.set('observers', S.observers); }
function savePrefs() { store.set('prefs', S.prefs); }
if (S.prefs.chassis === 'console') S.prefs.chassis = 'auto';

function addNode(t) {
  if (!t || !t.id || !t.rank) return;
  const c = S.nodes[t.id]?.c;   // the common name: only /taxa calls fill it in (cnFrom), so keep it when other calls re-add the taxon
  S.nodes[t.id] = { n:t.name, r:t.rank, l:t.rank_level, p:t.parent_id };
  if (c != null) S.nodes[t.id].c = c;
}
// From a /taxa result: iNat's English common name, or '' when it has none (so it isn't asked for again)
function cnFrom(t) { addNode(t); if (S.nodes[t.id]) S.nodes[t.id].c = t.preferred_common_name || ''; }
const cnOf = id => S.nodes[id]?.c || '';

/* ---------------- sync: full import, then incremental via updated_since ---------------- */
function trimObs(o) {
  const t = o.taxon || {};
  addNode(t);
  const anc = [...(t.ancestor_ids || [])];
  if (t.id && !anc.includes(t.id)) anc.push(t.id);
  let ct = null;
  if (o.community_taxon_id) {
    if (o.community_taxon_id === t.id) ct = anc;
    else {
      const idn = (o.identifications || []).find(i => i.taxon && i.taxon.id === o.community_taxon_id);
      if (idn) { addNode(idn.taxon); ct = [...(idn.taxon.ancestor_ids || []), idn.taxon.id]; }
    }
  }
  const ann = (o.annotations || [])
    .filter(a => (a.votes || []).reduce((s,v) => s + (v.vote_flag === false ? -1 : 1), 0) >= 0)
    .map(a => a.controlled_attribute_id + '|' + a.controlled_value_id);
  const text = [o.description || '', ...(o.tags || []), ...(o.ofvs || []).map(f => `${f.name} ${f.value}`)].join(' ');
  const beh = Object.keys(BEH_RX).filter(k => BEH_RX[k].test(text));
  const c = o.geojson && o.geojson.coordinates;
  return {
    id:o.id, d:o.observed_on || (o.created_at || '').slice(0,10), q:o.quality_grade, cap:!!o.captive,
    t:{ id:t.id, n:t.name, r:t.rank, l:t.rank_level }, anc, ct,
    lat: c ? c[1] : null, lng: c ? c[0] : null, ob: !!o.obscured, pg:o.place_guess || '',
    pl:o.place_ids || [], ph:(o.photos || []).slice(0,3).map(p => p.url), ann, beh,
  };
}

// Exactly what trimObs reads. v2 returns only these: about 1.6 KB per record instead of about 60 KB from v1.
const TAXON_FIELDS = '(id:!t,name:!t,rank:!t,rank_level:!t,parent_id:!t,ancestor_ids:!t)';
const OBS_FIELDS = `(id:!t,observed_on:!t,created_at:!t,quality_grade:!t,captive:!t,obscured:!t,place_guess:!t,place_ids:!t,description:!t,tags:!t,geojson:!t,community_taxon_id:!t,taxon:${TAXON_FIELDS},identifications:(taxon:${TAXON_FIELDS}),annotations:(controlled_attribute_id:!t,controlled_value_id:!t,votes:(vote_flag:!t)),ofvs:(name:!t,value:!t),photos:(url:!t))`;

const GUEST = '__guest';
const SAMPLE_LOGIN = 'themoojuice';   // "Try a sample naturalist": any public account with plenty of salticids
const isGuest = () => S.login === GUEST;
const who = () => isGuest() ? 'Guest naturalist' : S.login;

async function fetchPlaces(ids, log = () => {}) {
  const need = [...new Set(ids)].filter(id => !S.places[id]);
  if (need.length) log(`Looking up ${need.length} places…`);
  for (let i = 0; i < need.length; i += 100) {
    const batch = need.slice(i, i+100);
    const d = await api('/places/' + batch.join(','));
    batch.forEach(id => S.places[id] = { n:null, l:null });
    d.results.forEach(p => S.places[p.id] = { n:p.name, l:p.admin_level });
  }
}

// Import (or incrementally refresh) one naturalist's salticid records into a save object {obs, meta}.
// Used for the player and for whoever they are comparing against.
async function importRecords(login, save, { full=false, log=()=>{} } = {}) {
  const t0 = new Date().toISOString();
  save.meta = save.meta || {};
  if (!full && save.meta.lastFull && Date.now() - Date.parse(save.meta.lastFull) > FULL_RESYNC_AFTER) full = true;
  if (!save.meta.lastSync) full = true;
  const since = full ? null : save.meta.lastSync;
  const obs = full ? {} : (save.obs || {});
  let idAbove = 0, got = 0, total = null;
  log(full ? `Asking iNaturalist for ${login}'s jumping spider records…` : `Checking ${login} for records updated since ${since.slice(0,16).replace('T',' ')}…`, 0);
  while (true) {
    const d = await api('/observations', { taxon_id:SALTICIDAE, user_login:login, per_page:200, order_by:'id', order:'asc', id_above:idAbove || null, updated_since:since, fields:OBS_FIELDS }, API2);
    if (total == null) { total = d.total_results; log(`${fmt(total)} jumping spider record${total===1?'':'s'} ${full?'found':'updated'}.`, 0); }
    for (const o of d.results) obs[o.id] = trimObs(o);
    got += d.results.length;
    if (d.results.length) log(`Read ${fmt(got)} of ${fmt(total)} records`, got / total);
    if (d.results.length < 200) break;
    idAbove = d.results[d.results.length - 1].id;
  }
  save.obs = obs;
  if (full && !Object.keys(obs).length) log(`No public jumping spider records for "${login}" yet.`, 1);
  // Taxonomy tree of these records gives names/ranks for every ancestor (tribes, subfamilies, genera).
  log('Sorting them into genera…');
  const tree = await api('/observations/taxonomy', { taxon_id:SALTICIDAE, user_login:login });
  tree.results.forEach(addNode);
  await fetchPlaces(Object.values(obs).flatMap(o => o.pl), log);
  save.meta.lastSync = t0;
  if (full) save.meta.lastFull = t0;
  return total;
}

async function loadRefs(log = () => {}) {
  log('Loading the regional checklists…');
  for (const sc of new Set(['country', 'state', S.prefs.scope])) if (sc === 'world' || scopePlace(sc)) await ensureRef(sc);
}
async function sync({ full=false, log=()=>{} } = {}) {
  if (!isGuest()) await importRecords(S.login, S.u, { full, log });
  saveUser(); saveShared();
  if (S.u.base && !S.u.base.places) await resolveBasePlaces(log);
  S.M = buildModel();
  await loadRefs(log);
  S.M = buildModel();
}

// Country/state/local area for a point, borrowed from the nearest public observation's standard places.
async function placesNear(lat, lng, far = 50) {
  const q = { lat, lng, per_page:1, verifiable:true, fields:'place_ids' };
  let d = await api('/observations', { ...q, radius:5 }, API2);
  if (!d.results.length) d = await api('/observations', { ...q, radius:far }, API2);
  const pl = d.results[0]?.place_ids || [];
  await fetchPlaces(pl);
  const pick = lvl => pl.find(p => S.places[p]?.l === lvl) || null;
  return { country:pick(0), state:pick(10), local:pick(20) };
}
// Home base: lets beginners and guests scan before they have recorded anything.
async function resolveBasePlaces(log = () => {}) {
  const b = S.u.base; if (!b) return;
  log('Finding your home base…');
  const p = await placesNear(b.lat, b.lng);
  b.places = { country:p.country, state:p.state };
  // Only generic labels need a "near …" hint; searched place names already say where they are
  b.near = ['Your location', 'Map point'].includes(b.label) ? (S.places[p.local]?.n || S.places[p.state]?.n || null) : null;
  saveUser(); saveShared();
}
async function setBase(lat, lng, label) {
  S.u.base = { lat:+(+lat).toFixed(2), lng:+(+lng).toFixed(2), label };
  saveUser();
  try {
    await resolveBasePlaces();
    S.M = buildModel();
    await loadRefs();
    S.M = buildModel();
    toast(`Home base set: ${label}${S.u.base.near ? ' (near ' + S.u.base.near + ')' : ''}`);
    S.tab = 'map'; render();
    runScan(S.M.homeCell.lat, S.M.homeCell.lng);
  } catch (e) { toast(e.message); }
}
function geolocate() {
  if (!navigator.geolocation) return toast('Location is not available in this browser.');
  toast('Asking your browser for your location…');
  navigator.geolocation.getCurrentPosition(
    p => setBase(p.coords.latitude, p.coords.longitude, 'Your location'),
    err => toast('Could not get your location: ' + err.message),
    { timeout:15000, maximumAge:600000 });
}

function scopePlace(scope) {
  const M = S.M;
  if (scope === 'world') return null;
  return scope === 'state' ? (M.home.state || M.home.country) : M.home.country;
}
function scopeLabel(scope) {
  const id = scopePlace(scope);
  return id ? (S.places[id]?.n || 'home region') : 'the world';
}
const ensureRef = (scope, force = false) => ensureRefPlace(scopePlace(scope), force);
async function ensureRefPlace(pid, force = false) {
  const key = pid ? 'p' + pid : 'world';
  const cur = S.ref[key];
  if (!force && cur && cur.s && cur.t != null && Date.now() - cur.ts < REF_TTL) return cur;
  const d = await api('/observations/taxonomy', { taxon_id:SALTICIDAE, place_id:pid, verifiable:true });
  const g = {}, s = {};
  let t = 0;
  d.results.forEach(r => {
    addNode(r);
    const c = r.descendant_obs_count || r.count || 0;
    if (r.rank === 'genus') g[r.id] = c;
    if (r.rank === 'species') s[r.id] = c;
    if (r.id === SALTICIDAE) t = c;
  });
  S.ref[key] = { ts:Date.now(), g, s, t };
  saveShared();
  return S.ref[key];
}
function refFor(scope) {
  const pid = scopePlace(scope);
  return S.ref[pid ? 'p'+pid : 'world'] || null;
}

// Background: genus portraits + natural history blurbs (default photo & Wikipedia summary via iNat)
let infoBusy = false;
async function ensureInfo(ids) {
  // re-asks once for taxa cached before v1.20, which have no common name or photo licence yet
  const need = [...new Set(ids)].filter(id => !S.info[id] || (S.nodes[id] && S.nodes[id].c === undefined));
  if (!need.length || infoBusy) return;
  infoBusy = true;
  try {
    for (let i = 0; i < need.length; i += 30) {
      const batch = need.slice(i, i+30);
      const d = await api('/taxa/' + batch.join(','));
      batch.forEach(id => { S.info[id] = S.info[id] || {}; if (S.nodes[id] && S.nodes[id].c === undefined) S.nodes[id].c = ''; });
      d.results.forEach(t => {
        const dp = t.default_photo || {};
        cnFrom(t);
        S.info[t.id] = { p:dp.medium_url || dp.url || '', a:dp.attribution || '', lc:dp.license_code || null, s:stripHtml(t.wikipedia_summary || ''), w:t.wikipedia_url || '', c:t.observations_count || 0 };
      });
      saveShared();
      softRender();
    }
  } catch (e) { console.warn(e); }
  infoBusy = false;
}

/* ---------------- model: pure derivation from cached observations ---------------- */
function speciesOf(anc) { for (const id of anc || []) if (S.nodes[id]?.r === 'species') return id; return null; }
function genusOfNode(id) { let c = id, guard = 0; while (c && S.nodes[c]?.r !== 'genus' && guard++ < 10) c = S.nodes[c]?.p; return S.nodes[c]?.r === 'genus' ? c : null; }
function genusOf(anc) { for (const id of anc || []) if (S.nodes[id]?.r === 'genus') return id; return null; }
function lineage(id) {
  const out = []; let cur = S.nodes[id]?.p, guard = 0;
  while (cur && cur !== SALTICIDAE && guard++ < 20) { if (S.nodes[cur]) out.unshift({ id:cur, ...S.nodes[cur] }); cur = S.nodes[cur]?.p; }
  return out;
}
const lineageText = id => lineage(id).map(n => n.n).join(' › ') || 'Salticidae';
// One line about the animal: the first sentence of its Wikipedia summary (via iNat) that says more than "X is a genus of jumping
// spiders" or who described it and when. Empty when there's no such sentence (hand-written lines are the owner's call, HANDOVER §12).
const WOW_SKIP = /first described|described by|synonym|was (named|erected|described)|named (in|by|after)|type species|\bcontains? .{0,30}\bspecies\b|\bas of \d{4}|\buntil \d{4}|moved to|transferred to|formerly/i;
const GENUS_NOTES = {};   // genus id -> one line written by the owner; replaces the Wikipedia line (HANDOVER §12)
function wowLine(id) {
  if (GENUS_NOTES[id]) return GENUS_NOTES[id];
  const s = (S.info[id]?.s || '').replace(/\s+/g, ' ').trim(), name = S.nodes[id]?.n || ''; if (!s) return '';
  const sents = [];
  for (const p of s.split(/(?<=[.!?])\s+(?=[A-Z])/)) {   // glue back splits after initials and abbreviations ("C. L. Koch", "e.g. Portia")
    const prev = sents[sents.length - 1];
    if (prev && /(\b[A-Z]|\b(e\.g|i\.e|etc|sp|spp|cf|ca|approx|St|Mt|Dr|Prof|al|vs|no))\.$/.test(prev)) sents[sents.length - 1] = prev + ' ' + p; else sents.push(p);
  }
  for (const t of sents) {
    if (WOW_SKIP.test(t)) continue;
    const rest = t.split(name).join('').replace(/\b(is|was|are|a|an|the|of|in|genus|genera|spiders?|family|salticidae|jumping|or|and|its|this|monotypic)\b|[(),.;:]/gi, '').trim();
    if (rest.length >= 4) return t.length > 240 ? t.slice(0, t.lastIndexOf(' ', 230)) + '…' : t;
  }
  return '';
}
const cnHtml = (id, cls = 'cn') => cnOf(id) ? `<div class="${cls}">${esc(cnOf(id))}</div>` : '';

function buildModel(obsMap = S.u.obs, base = S.u.base) {
  const all = Object.values(obsMap).filter(o => !o.cap).sort((a,b) => (a.d||'').localeCompare(b.d||'') || a.id - b.id);
  const G = new Map(), leads = new Map(), SP = new Map();
  let xpTotal = 0;
  const cells25 = new Map(), dayDisc = new Map(), fieldDays = new Set(), behObs = { feed:0, court:0, egg:0 };
  const monthsAll = new Set(), cellsAll01 = new Set();
  for (const o of all) {
    if (o.d) { fieldDays.add(o.d); monthsAll.add(+o.d.slice(5,7)); }
    o.beh.forEach(b => behObs[b]++);
    if (o.ann.includes(ANN.EGG) || o.ann.includes(ANN.MOLT) || o.ann.includes(ANN.CONSTRUCTION)) { if (!o.beh.includes('egg')) behObs.egg++; }
    if (o.lat != null) {
      cellsAll01.add(cellKey(o.lat,o.lng,.1));
      const k = cellKey(o.lat, o.lng, .25);
      const c = cells25.get(k) || { k, lat:(Math.floor(o.lat/.25)+.5)*.25, lng:(Math.floor(o.lng/.25)+.5)*.25, n:0, g:new Set() };
      c.n++; cells25.set(k, c);
    }
    const gid = genusOf(o.anc);
    if (!gid) {
      const L = leads.get(o.t.id) || { id:o.t.id, name:o.t.n || 'Unknown', rank:o.t.r, obs:[] };
      L.obs.push(o); leads.set(o.t.id, L); continue;
    }
    if (o.lat != null) cells25.get(cellKey(o.lat,o.lng,.25)).g.add(gid);
    let g = G.get(gid);
    const events = [];
    if (!g) {
      g = { id:gid, name:S.nodes[gid]?.n || '?', obs:[], first:o, species:new Set(), c01:new Set(), months:new Set(), years:new Set(),
            f:{}, xp:0, xpLog:[], photos:[], places:new Set(), dup:0 };
      G.set(gid, g);
      events.push(['New genus', 100]);
      if (o.d) dayDisc.set(o.d, (dayDisc.get(o.d) || 0) + 1);
    }
    g.obs.push(o);
    const sid = speciesOf(o.anc);
    if (sid) {
      let sp = SP.get(sid);
      if (!sp) { sp = { id:sid, name:S.nodes[sid]?.n || o.t.n, gid, obs:[], first:o, photos:[] }; SP.set(sid, sp); }
      sp.obs.push(o);
      for (const p of o.ph) if (sp.photos.length < 8) sp.photos.push({ url:p, id:o.id });
      (g.sp = g.sp || new Set()).add(sid);
    }
    const f = g.f, mark = (k, label, xp) => { if (!f[k]) { f[k] = true; if (g.obs.length > 1) events.push([label, xp]); } };
    if (o.ann.includes(ANN.MALE)) mark('male', 'Male recorded', 40);
    if (o.ann.includes(ANN.FEMALE)) mark('female', 'Female recorded', 40);
    if (o.ann.includes(ANN.JUV) || o.ann.includes(ANN.NYMPH)) mark('juv', 'Juvenile recorded', 40);
    if (o.beh.includes('feed')) mark('feed', 'Feeding behaviour', 80);
    if (o.beh.includes('court')) mark('court', 'Courtship / display', 80);
    if (o.beh.includes('egg') || o.ann.includes(ANN.EGG) || o.ann.includes(ANN.MOLT) || o.ann.includes(ANN.CONSTRUCTION)) mark('egg', 'Silk & brood evidence', 80);
    if (o.ct && o.ct.includes(gid)) mark('supported', 'Community-supported ID', 50);
    if (o.q === 'research') f.rg = true;
    if (o.t.l != null && o.t.l <= 10) {
      const sp = o.t.l === 10 ? o.t.n : o.t.n.split(' ').slice(0,2).join(' ');
      if (!g.species.has(sp)) { g.species.add(sp); f.species = true; if (g.obs.length > 1) events.push(['New species in genus', 60]); }
    }
    if (o.lat != null) { const k = cellKey(o.lat,o.lng,.1); if (!g.c01.has(k)) { g.c01.add(k); if (g.obs.length > 1) events.push(['New locality', 40]); } }
    if (o.d) {
      const m = +o.d.slice(5,7); if (!g.months.has(m)) { g.months.add(m); if (g.obs.length > 1) events.push(['New month', 20]); }
      g.years.add(o.d.slice(0,4));
    }
    o.pl.forEach(p => g.places.add(p));
    if (!events.length) { g.dup++; events.push(['Duplicate record', Math.max(1, Math.round(10 / g.dup))]); }
    for (const [label, xp] of events) { g.xp += xp; xpTotal += xp; g.xpLog.push({ d:o.d, label, xp, id:o.id }); }
    for (const p of o.ph) if (g.photos.length < 24) g.photos.push({ url:p, id:o.id });
  }
  // Discovery states & levels
  let order = 0;
  const genera = [...G.values()].sort((a,b) => (a.first.d||'').localeCompare(b.first.d||'') || a.first.id - b.first.id);
  for (const g of genera) {
    g.discIndex = ++order;
    g.f.places = g.c01.size >= 3;
    g.f.months = g.months.size >= 3;
    g.level = CRITERIA.filter(c => g.f[c.k]).length;
    g.state = g.level >= MASTERY_AT ? 'MASTERED' : g.f.supported ? 'SUPPORTED' : 'DISCOVERED';
    g.last = g.obs[g.obs.length-1];
    // cover photo: prefer research-grade record photo
    const rg = g.obs.find(o => o.q === 'research' && o.ph.length);
    g.cover = rg ? rg.ph[0] : (g.photos[0]?.url || '');
  }
  for (const g of genera) g.sp = g.sp || new Set();
  for (const sp of SP.values()) { const rgo = sp.obs.find(o => o.q === 'research' && o.ph.length); sp.cover = rgo ? rgo.ph[0] : (sp.photos[0]?.url || ''); }
  // Home region = most frequent country & state across records
  const cnt = {}; all.forEach(o => o.pl.forEach(p => cnt[p] = (cnt[p]||0) + 1));
  const best = lvl => Object.keys(cnt).filter(p => S.places[p]?.l === lvl).sort((a,b) => cnt[b]-cnt[a])[0];
  const bp = base?.places || {};
  const home = { country: best(0) ? +best(0) : bp.country || null, state: best(10) ? +best(10) : bp.state || null };
  const homeCell = base ? { ...pointFromKey(`pt:${base.lat},${base.lng}`), label:base.label, near:base.near }
                        : ([...cells25.values()].sort((a,b) => b.n - a.n)[0] || null);
  // Discovery streaks over field days
  const days = [...fieldDays].sort();
  let run = 0, bestRun = 0;
  for (const d of days) { if (dayDisc.has(d)) { run++; bestRun = Math.max(bestRun, run); } else run = 0; }
  const year = String(new Date().getFullYear());
  return {
    obs:all, G, genera, leads:[...leads.values()].sort((a,b) => b.obs.length - a.obs.length), xp:xpTotal,
    cells25, cellsAll01, fieldDays:days, dayDisc, streak:run, bestStreak:bestRun, home, homeCell, behObs, monthsAll,
    newThisYear: genera.filter(g => (g.first.d||'').startsWith(year)).length,
    S: SP, species: SP.size,
    tier: tierIdx(G.size),
  };
}

// Scan points: either a 25 km grid square you've recorded in, or an arbitrary "pt:lat,lng"
function pointFromKey(k) {
  const m = /^pt:(-?[\d.]+),(-?[\d.]+)$/.exec(k || ''); if (!m) return null;
  return { k, lat:+m[1], lng:+m[2], n:0, g:new Set() };
}
function pointFor(k) { return S.M.cells25.get(k) || (S.M.homeCell?.k === k ? S.M.homeCell : pointFromKey(k)); }

/* ---------------- scope helpers ---------------- */
function scopeGenera(scope = S.prefs.scope) {
  const ref = refFor(scope);
  const inScope = ref ? Object.keys(ref.g).map(Number) : [];
  const set = new Set(inScope);
  const extras = S.M.genera.filter(g => !set.has(g.id)).map(g => g.id);
  return { ref, inScope, extras, found: inScope.filter(id => S.M.G.has(id)).length };
}
// Taxonomic order: DFS through the merged tree, alphabetical within each node
function taxonomicOrder(ids) {
  const want = new Set(ids), kids = {};
  const add = id => { const p = S.nodes[id]?.p; if (!p || id === SALTICIDAE) return; (kids[p] = kids[p] || new Set()).add(id); if (p !== SALTICIDAE) add(p); };
  ids.forEach(add);
  const out = [];
  const walk = id => { const ch = [...(kids[id] || [])].sort((a,b) => (S.nodes[a]?.n||'').localeCompare(S.nodes[b]?.n||'')); ch.forEach(c => { if (want.has(c)) out.push(c); walk(c); }); };
  walk(SALTICIDAE);
  ids.forEach(id => { if (!out.includes(id)) out.push(id); });
  return { order:out, kids };
}
const sortedCache = new WeakMap();
function refCount(id, kind = 'g', scope = S.prefs.scope) { const t = refFor(scope)?.[kind]; return t && t[id] != null ? t[id] : null; }
// Rarity: how few iNat records a taxon has in a place, as one of five colour tiers used across the whole app (v1.18; the owner's
// colours: red rarest, then blue, yellow, green, and white for the commonest). Ranked against every genus (or species) recorded
// there; one not recorded there at all counts as red. `lv` 5…1 is the numeric weight (prestige, event points, sorting).
const RARITY = [
  { lv:5, k:'red', n:'Exceptional', c:'#c8322a', p:.10 },
  { lv:4, k:'blue', n:'Rare', c:'#2f6fb5', p:.25 },
  { lv:3, k:'yellow', n:'Scarce', c:'#e0b81c', p:.45 },
  { lv:2, k:'green', n:'Uncommon', c:'#3f9a4a', p:.70 },
  { lv:1, k:'white', n:'Common', c:'#f4efe2', p:1 },
];
function tierIn(table, id) {
  if (!table) return null;
  if (table[id] == null) return RARITY[0];
  let counts = sortedCache.get(table);
  if (!counts) { counts = Object.values(table).sort((a,b) => a-b); sortedCache.set(table, counts); }
  const p = counts.findIndex(c => c >= table[id]) / Math.max(1, counts.length - 1);   // share of taxa with fewer records
  return RARITY.find(t => p <= t.p) || RARITY[RARITY.length - 1];
}
const tierOf = (id, kind = 'g', scope = S.prefs.scope) => tierIn(refFor(scope)?.[kind], id);
const rarityOf = (id, kind = 'g', pid = S.M?.home.state || S.M?.home.country) => tierIn(pid && S.ref['p' + pid]?.[kind], id);
const rarityIdx = r => r ? RARITY.indexOf(r) : RARITY.length;
const rarityChip = r => r ? `<span class="rchip" style="--rc:${r.c}" title="${esc(r.n)}: rarity by how few iNat records it has">${esc(r.n)}</span>` : '';
function rarityTier(id, scope = S.prefs.scope, kind = 'g') {
  const table = refFor(scope)?.[kind]; if (!table || table[id] == null) return null;
  const t = tierIn(table, id);
  return { count:table[id], tier:t, label:t.n, stars:t.lv };
}
// Rarity weight 1 (white) … 5 (red) in scope; a taxon absent from the regional reference counts as red
const starsFor = (id, kind = 'g') => starsIn(id, kind, S.prefs.scope);
function rarityNote(id, kind = 'g') {
  const c = refCount(id, kind), where = scopeLabel(S.prefs.scope);
  if (c != null) return `${fmt(c)} iNat record${c === 1 ? '' : 's'} in ${where}`;
  return refFor(S.prefs.scope)?.[kind] ? `none on iNat in ${where}` : '';
}
// Collection prestige: rarity-weighted collection size (genera ×10, species ×3)
function prestige(M) {
  let p = 0;
  M.G.forEach((g, id) => p += 10 * starsFor(id, 'g'));
  M.S.forEach((s, id) => p += 3 * starsFor(id, 's'));
  return p;
}
const moduleOn = minTier => S.prefs.peek || S.M.tier >= minTier;

/* ---------------- field style & titles ---------------- */
function fieldStyle(M) {
  const s = [];
  if (M.cellsAll01.size >= 25) s.push(['🧭','Explorer', `${M.cellsAll01.size} localities`]);
  const beh = M.behObs.feed + M.behObs.court + M.behObs.egg;
  if (beh >= 5) s.push(['🕸','Behaviour observer', `${beh} behaviour records`]);
  const lifeStage = M.genera.filter(g => g.f.male && g.f.female).length;
  if (lifeStage >= 5) s.push(['⚥','Dimorphism detective', `${lifeStage} genera with both sexes`]);
  if (M.monthsAll.size >= 10) s.push(['🗓','Year-round spooder', `${M.monthsAll.size} months of the year`]);
  const mastered = M.genera.filter(g => g.state === 'MASTERED').length;
  if (mastered) s.push(['🏅','Genus master', `${mastered} mastered`]);
  return s;
}
function favouriteLineages(M) {
  const c = {};
  M.genera.forEach(g => { const L = lineage(g.id); const tribe = L.find(n => n.r === 'tribe') || L.find(n => n.r === 'subfamily'); if (tribe) { c[tribe.n] = c[tribe.n] || { n:tribe.n, g:0, o:0 }; c[tribe.n].g++; c[tribe.n].o += g.obs.length; } });
  return Object.values(c).sort((a,b) => b.g - a.g || b.o - a.o);
}
function generatedTitle(M) {
  const fav = favouriteLineages(M)[0];
  const nouns = ['Notebook Scribbler','Spood Apprentice','Spood Naturalist','Spood Wrangler','Spood Wizard','Arachno-Sage','Station Chief'];
  const noun = nouns[Math.min(M.tier, nouns.length-1)];
  if (!fav) return 'Aspiring Spooder';
  const adj = fav.n.replace(/ini$/, 'ine').replace(/inae$/, 'ine');
  return `${adj} ${noun}`;
}

/* ---------------- quests: generated from genuine gaps ---------------- */
function scanFor(cell) { return cell ? S.u.scans[cell.k] : null; }
function buildQuests(M) {
  const q = [];
  if (!M.G.size) q.push({ id:'first', kind:'first', icon:'🕷', title:'Your First Spood', text:'Find a jumping spider, photograph it and upload it to iNaturalist. Once it is identified to genus, sync SPOODEX and your first card unlocks.', reward:100 });
  if (!M.homeCell) q.push({ id:'base', kind:'base', icon:'🏠', title:'Pick a Home Base', text:'Tell SPOODEX where you usually spood and it will list the genera recorded around you.', reward:0 });
  const act = M.homeCell && S.u.active?.[M.homeCell.k];
  if (act) {
    const miss = act.g.filter(x => !M.G.has(x.id)).sort((a,b) => b.c - a.c);
    if (miss.length) q.push({ id:'active:'+M.homeCell.k+':'+act.d1, kind:'hunt', icon:'🔥', title:'Active Right Now',
      text:`${miss.length} genera you haven't recorded have been found within 25 km of your home base in the last ${ACTIVE_DAYS} days.`,
      targets:miss.slice(0,6).map(x => x.id), recent:Object.fromEntries(miss.map(x => [x.id, x.c])), reward:300 });
    else if (act.g.length) q.push({ id:'active-mastery', kind:'info', icon:'🔥', title:'Everything Active Is Already Yours',
      text:`All ${act.g.length} genera recorded near your home base in the last ${ACTIVE_DAYS} days are in your SPOODEX.`,
      targets:act.g.slice(0,6).map(x => x.id), reward:0 });
  }
  const scan = scanFor(M.homeCell);
  if (scan) {
    const missing = scan.g.filter(x => !M.G.has(x.id)).sort((a,b) => b.c - a.c);
    if (missing.length) q.push({ id:'hunt:'+M.homeCell.k, kind:'hunt', icon:'🎯', title:'Genus Hunt',
      text:`${missing.length} Salticidae genera recorded within 25 km of your home base aren't in your SPOODEX. Find one.`,
      targets:missing.slice(0,6).map(x => x.id), reward:250 });
  } else if (M.homeCell) {
    q.push({ id:'scan-home', kind:'scan', icon:'📡', title:'Calibrate the scanner', text:'Scan the area around your home base to reveal nearby genera you have not recorded yet.', reward:0 });
  }
  const ref = refFor(S.prefs.scope);
  if (ref && moduleOn(2)) {
    const { kids } = taxonomicOrder(Object.keys(ref.g).map(Number));
    const tribes = Object.keys(S.nodes).map(Number).filter(id => ['tribe','subfamily'].includes(S.nodes[id].r) && kids[id]);
    const under = (id) => { const out = []; const w = x => (kids[x] ? [...kids[x]] : []).forEach(c => { if (S.nodes[c]?.r === 'genus') out.push(c); w(c); }); w(id); return out; };
    const empty = tribes.map(id => ({ id, g:under(id) })).filter(t => t.g.length && !t.g.some(g => M.G.has(g)))
      .sort((a,b) => b.g.reduce((s,x) => s + (ref.g[x]||0), 0) - a.g.reduce((s,x) => s + (ref.g[x]||0), 0));
    if (empty[0]) q.push({ id:'lineage:'+empty[0].id, kind:'lineage', icon:'🌳', title:'Unexplored Lineage',
      text:`You have nothing from ${S.nodes[empty[0].id].n} (${S.nodes[empty[0].id].r}). ${empty[0].g.length} ${empty[0].g.length===1?'genus':'genera'} from it ${empty[0].g.length===1?'is':'are'} recorded in ${scopeLabel(S.prefs.scope)}.`, node:empty[0].id, targets:empty[0].g, reward:300 });
  }
  const ns = nearestSet(refFor(S.prefs.scope));
  if (ns) q.push({ id:'set:' + ns.key + ':' + ns.have, kind:'hunt', icon:'🏆', title:`Complete the Set: ${ns.name}`,
    text:`You have ${ns.have} of the ${ns.ids.length} genera in the ${ns.name} set that are recorded in ${scopeLabel(S.prefs.scope)}. ${ns.left} to go. See them under SPOODEX › Sets.`,
    targets:ns.ids.filter(id => !M.G.has(id)), reward:200 });
  if (M.leads.length) {
    const n = M.leads.reduce((s,l) => s + l.obs.length, 0);
    q.push({ id:'resolve', kind:'resolve', icon:'❓', title:'Something Is Lurking',
      text:`${n} mystery spood${n === 1 ? '' : 's'}: records not yet identified to genus (${M.leads.slice(0,3).map(l => l.name).join(', ')}…). Add face-on, top and side photos, or ask for an ID.`,
      obs:M.leads.flatMap(l => l.obs.map(o => o.id)).slice(0,50), reward:100 });
  }
  const near = M.genera.filter(g => g.state !== 'MASTERED').sort((a,b) => b.level - a.level || b.obs.length - a.obs.length)[0];
  if (near) {
    const miss = CRITERIA.filter(c => !near.f[c.k]);
    q.push({ id:'master:'+near.id, kind:'master', icon:'🏅', title:`Towards Mastery: ${near.name}`,
      text:`${near.name} is at level ${near.level}/10. Still to do: ${miss.slice(0,3).map(c => c.label.toLowerCase()).join('; ')}.`, gid:near.id, crit:miss[0]?.k, reward:150 });
  }
  const behs = [['feed','Feeding frenzy','Photograph a salticid feeding or with prey'],['court','Dance floor','Record courtship or display'],['egg','Silk & brood','Find an egg sac, retreat, nest or moult']]
    .sort((a,b) => M.behObs[a[0]] - M.behObs[b[0]]);
  q.push({ id:'beh:'+behs[0][0], kind:'beh', icon:'🔍', title:`Behaviour: ${behs[0][1]}`, text:`${behs[0][2]}. You have ${M.behObs[behs[0][0]]} so far. Mention it in the description or tags so SPOODEX can see it.`, beh:behs[0][0], base:M.behObs[behs[0][0]], reward:80 });
  const holeMonths = [...Array(12).keys()].map(i => i+1).filter(m => !M.monthsAll.has(m));
  const thisMonth = new Date().getMonth() + 1;
  if (holeMonths.includes(thisMonth)) q.push({ id:'month:'+thisMonth, kind:'month', icon:'🗓', title:'Off-Season Spooding', text:`You've never recorded a salticid in ${MONTHS[thisMonth-1]}.`, m:thisMonth, reward:120 });
  q.push({ id:'explore', kind:'explore', icon:'🧭', title:'Change of Scenery', text:`Record a salticid in a new 25 km grid square (you have ${M.cells25.size}).`, base:M.cells25.size, reward:150 });
  const oneSex = M.genera.filter(g => (g.f.male ^ g.f.female)).sort((a,b) => b.obs.length - a.obs.length)[0];
  if (oneSex) q.push({ id:'sex:'+oneSex.id, kind:'master', icon:oneSex.f.male ? '♀' : '♂', title:'The Other Half', text:`You've recorded a ${oneSex.f.male ? 'male' : 'female'} ${oneSex.name} but never a ${oneSex.f.male ? 'female' : 'male'}. Annotate sex on iNat when you do.`, gid:oneSex.id, crit:oneSex.f.male ? 'female' : 'male', reward:40 });
  // Daily pick, seeded by date
  const seed = new Date().toISOString().slice(0,10).split('-').reduce((a,b) => a*31 + +b, 7);
  const pickable = q.filter(x => x.kind !== 'scan');
  if (pickable.length) pickable[seed % pickable.length].daily = true;
  return q;
}
function questDone(q, M) {
  switch (q.kind) {
    case 'hunt': case 'lineage': return (q.targets || []).some(id => M.G.has(id));
    case 'resolve': return (q.obs || []).some(id => S.u.obs[id] && genusOf(S.u.obs[id].anc));
    case 'master': return !!M.G.get(q.gid)?.f[q.crit];
    case 'beh': return M.behObs[q.beh] > q.base;
    case 'month': return M.monthsAll.has(q.m);
    case 'explore': return M.cells25.size > q.base;
    case 'first': return M.G.size > 0;
    default: return false;
  }
}

function viewDexSpecies() {
  const M = S.M, P = S.prefs;

  const byG = new Map();
  for (const id of inScope) { const g = genusOfNode(id) || 0; if (!byG.has(g)) byG.set(g, []); byG.get(g).push(id); }

    const ids = byG.get(g).filter(keep).sort((a,b) => (S.nodes[a]?.n||'').localeCompare(S.nodes[b]?.n||''));
    if (!ids.length) return '';
    const all = byG.get(g), have = all.filter(id => M.S.has(id)).length;
    const gname = !g ? 'Unplaced' : (M.G.has(g) || P.reveal) ? `<i>${esc(S.nodes[g]?.n)}</i>` : '???';
    return `<h3 style="margin-top:14px">${gname} <span class="small muted">${have}/${all.length}</span></h3>
      <div class="dexgrid">${ids.map(speciesCard).join('')}</div>`;
  }).join('');
  return `
  <div class="panel row" style="margin-bottom:14px">
    ${layerSwitch()}
    <b style="font-family:var(--head);font-size:20px">${found} / ${inScope.length || '?'}</b>

    <select data-pref="scope">${['country','state','world'].map(s => `<option value="${s}" ${P.scope===s?'selected':''}>${esc(s==='world'?'World (your genera)':scopeLabel(s))}</option>`).join('')}</select>
    <div class="bar" style="max-width:220px"><i style="width:${pct(found, inScope.length)}%"></i></div>
    <span>${[['all','All'],['found','Recorded'],['missing','Missing']].map(([k,l]) => `<span class="chip ${(P.filter===k || (k==='found' && ['supported','mastered'].includes(P.filter)))?'on':''}" data-filter="${k}" style="cursor:pointer">${l}</span>`).join(' ')}</span>
    <label class="small"><input type="checkbox" data-pref="reveal" ${P.reveal?'checked':''}> reveal names</label>
  </div>

async function runScan(lat, lng, km = scanKm(), per = scanPer()) {
  const seq = ++scanSeq, stale = () => seq !== scanSeq;

    S.u.scanHist = [S.u.mscan, ...(S.u.scanHist || []).filter(h => !(h.lat === lat && h.lng === lng && h.km === km && h.per === per))].slice(0, SCAN_HIST);

/* ---------------- elevation: height above sea level of your records, read from the same terrain tiles as the 3D map ---------------- */
const ELEV_Z = 12;
S.elev = store.get('elev', {});   // observation id -> metres. Never shown per record, never shared.
let elevBusy = false;
// Terrarium PNGs: metres = R×256 + G + B/256 − 32768. One z12 tile (~9 km) per group of nearby records.
async function fillElev() {
  if (elevBusy || !S.M) return;
  const tiles = new Map(), n = 2 ** ELEV_Z;
  for (const o of S.M.obs) {
    if (o.lat == null || o.ob || S.elev[o.id] != null) continue;
    const r = o.lat * Math.PI / 180, x = (o.lng + 180) / 360 * n, y = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n;
    const key = `${Math.floor(x)}/${Math.floor(y)}`;
    if (!tiles.has(key)) tiles.set(key, []);
    tiles.get(key).push([o.id, Math.floor(x % 1 * 256), Math.floor(y % 1 * 256)]);
  }
  if (!tiles.size) return;
  elevBusy = true;
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const cx = cv.getContext('2d', { willReadFrequently:true });
  for (const [key, pts] of tiles) {
    try {
      const r = await fetch(TERRAIN_TILES.replace('{z}/{x}/{y}', `${ELEV_Z}/${key}`));
      if (!r.ok) continue;
      // no colour management or premultiplying, or the encoded heights shift
      const bmp = await createImageBitmap(await r.blob(), { colorSpaceConversion:'none', premultiplyAlpha:'none' });
      cx.clearRect(0, 0, 256, 256); cx.drawImage(bmp, 0, 0); bmp.close();
      const px = cx.getImageData(0, 0, 256, 256).data;
      for (const [id, x, y] of pts) { const i = (y * 256 + x) * 4; S.elev[id] = Math.round(px[i] * 256 + px[i + 1] + px[i + 2] / 256 - 32768); }
      store.set('elev', S.elev);
    } catch (e) { console.warn(e); break; }
  }
  elevBusy = false;
  if (S.tab === 'dex' && S.prefs.layer === 'sets') softRender();
}
const elevsOf = gid => (S.M.G.get(gid)?.obs || []).filter(o => !o.ob).map(o => S.elev[o.id]).filter(v => v != null);
const topElev = gid => Math.max(-Infinity, ...elevsOf(gid));
function altitudeLine(g) {
  const e = elevsOf(g.id); if (!e.length) return '';
  const r50 = v => Math.max(0, Math.round(v / 50) * 50), lo = r50(Math.min(...e)), hi = r50(Math.max(...e));
  return `<dt>Altitude</dt><dd>${lo === hi ? `~${fmt(lo)} m` : `${fmt(lo)}–${fmt(hi)} m`}</dd>`;
}

const ACTIVE_DAYS = 30, ACTIVE_TTL = 6 * 3600e3;
async function scanActive(k, force = false, into = null) {

/* ---------------- best months: iNat month-of-year histogram per genus, in your home state ---------------- */
const PHENO_TTL = 30 * 864e5;
const phenoPlace = () => S.M?.home.state || S.M?.home.country || null;
const phenoKey = (gid, pid = phenoPlace()) => `${gid}:${pid || 'w'}`;
const phenoQueue = new Map();   // phenoKey -> [genus, place]
let phenoBusy = false;
function ensurePheno(ids, pid = phenoPlace()) {
  ids.forEach(id => { const k = phenoKey(id, pid), p = S.pheno[k]; if (!p || Date.now() - p.ts > PHENO_TTL) phenoQueue.set(k, [id, pid]); });
  if (!phenoBusy && phenoQueue.size) drainPheno();
}
async function drainPheno() {
  phenoBusy = true;
  while (phenoQueue.size) {
    const [k, [id, pid]] = phenoQueue.entries().next().value; phenoQueue.delete(k);
    try {
      const d = await api('/observations/histogram', { taxon_id:id, place_id:pid, interval:'month_of_year', verifiable:true });
      const m = d.results?.month_of_year || {};
      S.pheno[k] = { ts:Date.now(), m:[...Array(12)].map((_, i) => m[i+1] || 0) };
      store.set('pheno', S.pheno);
      phenoUpdated();
    } catch (e) { console.warn(e); break; }
  }
  phenoBusy = false;
}
// Peak = months with ≥60% of the busiest (smoothed) month's records, written as circular ranges ("Nov–Feb")
function peakInfo(gid, pid = phenoPlace(), nowM = new Date().getMonth()) {
  const p = S.pheno[phenoKey(gid, pid)]; if (!p) return null;
  const tot = p.m.reduce((a,b) => a+b, 0);
  if (tot < 12) return { few:true, tot, m:p.m };
  // smooth with neighbouring months (1-2-1) so sparse genera read as seasons, not noise
  const sm = p.m.map((v, i) => (p.m[(i+11) % 12] + 2*v + p.m[(i+1) % 12]) / 4);
  const max = Math.max(...sm), on = sm.map(v => v >= max * .6);
  if (on.every(Boolean)) return { text:'year-round', now:true, tot, m:p.m };
  const ranges = [];
  for (let i = 0; i < 12; i++) {
    if (!on[i] || on[(i+11) % 12]) continue;
    let j = i; while (on[(j+1) % 12]) j = (j+1) % 12;
    ranges.push(i === j ? MONTHS[i] : `${MONTHS[i]}–${MONTHS[j]}`);
  }
  return { text:ranges.join(', '), now:on[nowM], tot, m:p.m };
}
function phenoHtml(gid) {
  const p = peakInfo(gid);
  if (!p) return '<span class="muted">· checking season…</span>';
  if (p.few) return '<span class="muted">· too few records to call a season</span>';
  return `${p.now ? '<b class="inseason">🌡 in season now</b> · ' : ''}<span class="muted">peak ${esc(p.text)}</span>`;
}
const phenoTag = gid => `<span class="small" data-pheno="${gid}">${phenoHtml(gid)}</span>`;
function phenoChart(gid, pid = phenoPlace(), nowM = new Date().getMonth()) {
  const p = peakInfo(gid, pid, nowM), where = esc(S.places[pid]?.n || 'the world');
  if (!p) return '<p class="small muted">Checking when it turns up…</p>';
  const max = Math.max(1, ...p.m);
  return `<div class="pheno">${p.m.map((v, i) => `<div title="${MONTHS[i]}: ${v} records"><i style="height:${Math.round(100 * v / max)}%" class="${i === nowM ? 'now' : ''}"></i><span>${MONTHS[i][0]}</span></div>`).join('')}</div>
    <p class="small">${p.few ? 'Too few records to call a season yet.' : `${p.now ? `<b class="inseason">🌡 In season ${monthTxt(nowM)}.</b> ` : ''}Peak: <b>${esc(p.text)}</b>.`} <span class="muted">${fmt(p.tot)} verifiable iNat records in ${where}, by month observed.</span></p>`;
}
function phenoUpdated() {
  document.querySelectorAll('[data-pheno]').forEach(el => el.innerHTML = phenoHtml(+el.dataset.pheno));
  document.querySelectorAll('[data-phenochart]').forEach(el => { const d = el.dataset;
    el.innerHTML = phenoChart(+d.phenochart, d.phenopid ? +d.phenopid : undefined, d.phenom ? +d.phenom : undefined); });

/* ---------------- mastery fix-it: point at the exact records that could tick a box ---------------- */
function fixIt(g, k) {
  if (isGuest()) return '';
  const base = `https://www.inaturalist.org/observations?user_id=${encodeURIComponent(S.login)}&taxon_id=${g.id}&verifiable=any`;
  const count = f => g.obs.filter(f).length, s = n => n === 1 ? '' : 's';
  const has = (o, attr) => o.ann.some(a => a.startsWith(attr + '|'));
  const link = (url, text) => `<div class="fix small">↳ <a href="${esc(url)}" target="_blank" rel="noopener">${text} ↗</a></div>`;
  const tip = text => `<div class="fix small muted">↳ ${text}</div>`;
  switch (k) {
    case 'male': case 'female': {
      const n = count(o => !has(o, '9'));
      return n ? link(`${base}&without_term_id=9`, `${n} record${s(n)} with no sex annotation. Annotate any adults`) : tip('Every record is sexed. Go find the other one!');
    }
    case 'juv': {
      const n = count(o => !has(o, '1'));
      return n ? link(`${base}&without_term_id=1`, `${n} record${s(n)} with no life-stage annotation. Mark any juveniles`) : tip('Look for small, pale, often differently-patterned individuals.');
    }
    case 'feed':  return link(base, 'Photographed it with prey? Add "feeding" or "prey" to the description or a tag');
    case 'court': return link(base, 'Caught a display? Add "courtship" or "display" to the description or a tag');
    case 'egg':   return link(base, 'Got an egg sac, retreat or moult? Add an Evidence annotation or mention it in the description');
    case 'supported': {
      const n = count(o => !(o.ct && o.ct.includes(g.id)));
      return n ? link(`${base}&quality_grade=needs_id`, `${n} record${s(n)} not yet community-supported. Add sharper photos or @mention an identifier`) : '';
    }
    case 'species': {
      const n = count(o => o.t.l > 10);
      return n ? link(`${base}&hrank=genus&lrank=genus`, `${n} record${s(n)} stuck at genus. Try keying one to species`) : '';
    }
    case 'places': return tip(`Fieldwork: record it somewhere ~10 km from your ${g.c01.size} existing localit${g.c01.size === 1 ? 'y' : 'ies'}.`);
    case 'months': { const p = peakInfo(g.id); return tip(`Fieldwork: record it in a new month${p && !p.few ? ` (peak ${esc(p.text)})` : ''}.`); }
    default: return '';
  }
}

/* ---------------- reveal ceremony ---------------- */
// After a sync: a full-screen photo for each new genus, and for each mystery spood that has been identified to genus since.
// Items: {g genus, isNew, o the record that was a mystery spood, more (identified records not shown)}.
const SOLVED_SHOWN = 3;
function celebrations(fresh, solved) {
  const freshIds = new Set(fresh.map(g => g.id));
  const items = fresh.map(g => ({ g, isNew:true, o:solved.find(o => genusOf(o.anc) === g.id) }));
  const old = solved.filter(o => !freshIds.has(genusOf(o.anc)));
  old.slice(0, SOLVED_SHOWN).forEach(o => items.push({ g:S.M.G.get(genusOf(o.anc)), o }));
  const out = items.filter(x => x.g);
  if (old.length > SOLVED_SHOWN && out.length) out[out.length - 1].more = old.length - SOLVED_SHOWN;
  return out;
}

/* ---------------- regional ladder: top salticid observers of a place, ranked by what they've recorded there ---------------- */
const LADDER_TTL = 864e5, LADDER_N = 25, LADDER_KEEP = 4;
S.ladder = store.get('ladder', {});   // 'p<placeId>' -> {ts, n:observers in place, icons{login:url}, queue:[logins still to read], rows:[{login, obs, g:[ids], s:[ids]}]}
let ladderBusy = null, ladderErr = null;
const ladderScope = () => S.prefs.ladderScope || 'state';
const ladderKey = () => { const p = scopePlace(ladderScope()); return p ? 'p' + p : null; };
const isMe = l => !isGuest() && String(l).toLowerCase() === String(S.login).toLowerCase();
function starsIn(id, kind, scope) { const r = rarityTier(id, scope, kind); return r ? r.stars : (refFor(scope)?.[kind] ? 5 : 1); }

  return !L || Date.now() - L.ts > LADDER_TTL || !L.queue || L.queue.length || (!isGuest() && S.login && !L.rows.some(r => isMe(r.login)));
}
async function loadLadder(force = false) {
  const scope = ladderScope(), key = ladderKey();
  if (!key || ladderBusy) return;
  let L = S.ladder[key];
  if (force || !L || Date.now() - L.ts > LADDER_TTL) {
    L = S.ladder[key] = { ts:Date.now(), n:null, icons:{}, queue:null, rows:[] };
    const old = Object.keys(S.ladder).sort((a,b) => S.ladder[b].ts - S.ladder[a].ts).slice(LADDER_KEEP);
    old.forEach(k => delete S.ladder[k]);
  }
  ladderBusy = key; ladderErr = null;
  const pid = +key.slice(1), redraw = () => { if (S.tab === 'ladder') render(); };
  try {
    await ensureRef(scope);
    if (!L.queue) {
      const d = await api('/observations/observers', { taxon_id:SALTICIDAE, place_id:pid, verifiable:true, per_page:LADDER_N });
      L.n = d.total_results;
      d.results.forEach(r => L.icons[r.user.login] = r.user.icon_url || '');
      L.queue = d.results.map(r => r.user.login);
    }
    if (!isGuest() && S.login && ![...L.queue, ...L.rows.map(r => r.login)].some(isMe)) L.queue.push(S.login);
    redraw();
    // One taxonomy call per person gives every genus/species they've recorded in the place. Progress is saved, so it resumes.
    while (L.queue.length && ladderKey() === key) {
      const login = L.queue[0];
      try {
        const d = await api('/observations/taxonomy', { taxon_id:SALTICIDAE, user_login:login, place_id:pid, verifiable:true });
        const row = { login, obs:0, g:[], s:[] };
        d.results.forEach(t => { addNode(t); if (t.rank === 'genus') row.g.push(t.id); else if (t.rank === 'species') row.s.push(t.id); else if (t.id === SALTICIDAE) row.obs = t.descendant_obs_count || 0; });
        L.rows.push(row);
      } catch (e) { if (!/returned 4\d\d/.test(e.message)) throw e; }   // account gone or renamed: skip it
      L.queue.shift();
      store.set('ladder', S.ladder);
      redraw();
    }
    saveShared();
  } catch (e) { ladderErr = e.message; }

  redraw();
}

  rows.sort((a,b) => b[k] - a[k] || b.gn - a.gn || b.sn - a.sn || b.obs - a.obs || a.login.localeCompare(b.login));

/* ---------------- share of the record: your records as a fraction of iNat's for a region (no extra calls) ---------------- */
const inPlace = (o, pid) => o.q !== 'casual' && o.pl.includes(pid);
const gLink = id => `<a href="#" data-genus="${id}"><i>${esc(S.nodes[id]?.n || '?')}</i></a>`;
const pctTxt = p => p >= .995 ? '100%' : p >= .1 ? Math.round(p * 100) + '%' : p >= .01 ? (p * 100).toFixed(1) + '%' : p > 0 ? '<1%' : '0%';
function recordShare(pid) {
  const ref = pid && S.ref['p' + pid], M = S.M; if (!ref) return null;
  // Regional totals can be a few days older than your records, so never let "all" fall below "yours"
  const rows = M.genera.map(g => { const mine = g.obs.filter(o => inPlace(o, pid)).length; if (!mine) return null;
    const all = Math.max(mine, ref.g[g.id] || 0); return { g, mine, all, pc:mine / all }; }).filter(Boolean)
    .sort((a,b) => b.pc - a.pc || b.mine - a.mine);
  const mine = M.obs.filter(o => inPlace(o, pid)).length;
  const total = Math.max(mine, ref.t || Object.values(ref.g).reduce((a,b) => a + b, 0));
  let spSole = 0;
  M.S.forEach(sp => { const m = sp.obs.filter(o => inPlace(o, pid)).length; if (m && ref.s && m >= (ref.s[sp.id] || 0)) spSole++; });
  return { rows, mine, total, pc:total ? mine / total : 0, sole:rows.filter(r => r.mine >= r.all), spSole, where:S.places[pid]?.n || 'your region' };
}

/* ---------------- pioneer badges: is your record the earliest verifiable one on iNat in a place? ---------------- */
const PIONEER_TTL = 30 * 864e5;

let pioneerBusy = false;

function pioneerTargets() {
  if (isGuest() || !S.M) return [];
  const out = [];

    const ps = [...g.places].filter(p => [0, 10].includes(S.places[p]?.l));
    const local = g.first.pl.find(p => S.places[p]?.l === 20);
    if (local) ps.push(local);

  }

      const cur = S.pioneer[k]; if (cur && Date.now() - cur.ts < PIONEER_TTL) continue;
      const [gid, pid] = k.split(':').map(Number);
      const d = await api('/observations', { taxon_id:gid, place_id:pid, verifiable:true, order_by:'observed_on', order:'asc', per_page:1 });
      const o = d.results[0];
      S.pioneer[k] = { ts:Date.now(), u:o?.user?.login || '', d:o?.observed_on || '', id:o?.id || 0 };

async function ownerPhotos(ids) {

    const batch = need.slice(i, i + 30);
    const d = isMe(OWNER) ? { results:[] } : await api('/observations', { user_login:OWNER, taxon_id:batch.join(','), quality_grade:'research', photos:true,
      order_by:'votes', order:'desc', per_page:200, fields:'(id:!t,taxon:(id:!t,ancestor_ids:!t),photos:(url:!t))' }, API2);

    near:t.area ? null : t.g, recent:t.act, stale:!soon, posters:TRIP_POSTERS };
}

async function loadTrip(force = false) {

function tripSpots(list, ctx) {

    const hn = S.haunts[hauntKey(x.id, ctx)];
    if (!hn || (hn.wide && ctx.centre)) continue;
    for (const [k, n, last] of hn.cells) {
      const e = cells.get(k) || { k, g:[], n:0, last:'' };
      e.g.push(x.id); e.n += n; if (last > e.last) e.last = last;
      cells.set(k, e);

  return [...cells.values()].map(e => { const d = ctx.centre ? kmBetween(ctx.centre, cellCenter(e.k)) : null;

function newsHtml() {
