<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPOODEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ---------- Chassis themes: the instrument evolves with the player ---------- */
:root, [data-chassis="notebook"] {
  --bg:#e7d8b9; --panel:#f5ecd6; --panel2:#efe2c3; --ink:#2b2419; --muted:#6d604a;
  --accent:#a8412a; --lit:#2f6b3a; --line:#c4ad84; --dim:#cdbb96; --glow:none;
  --head:'Special Elite', 'Courier New', monospace; --body:'IBM Plex Mono', ui-monospace, monospace;
  --radius:4px; --paper:repeating-linear-gradient(0deg, transparent 0 27px, rgba(80,60,30,.08) 27px 28px);
}
[data-chassis="kit"] {
  /* Field guide: herbarium paper, eucalypt sage, ochre */
  --bg:#e4e2d3; --panel:#faf7ee; --panel2:#efebdc; --ink:#23291f; --muted:#5f6a56;
  --accent:#b5651d; --lit:#4f7a45; --line:#b9b89e; --dim:#d9d8c4; --glow:none;
  --head:'Fraunces', Georgia, serif; --radius:8px;
  --paper:radial-gradient(circle at 20% 10%, rgba(120,140,90,.08), transparent 40%), radial-gradient(circle at 90% 80%, rgba(180,120,40,.06), transparent 45%);
}
[data-chassis="cabinet"] {
  /* Museum specimen cabinet: walnut, brass, cream labels */
  --bg:#2e221a; --panel:#f6eedb; --panel2:#ebdfc2; --ink:#2a2118; --muted:#6e5c46;
  --accent:#8f6420; --lit:#3f6b3a; --line:#b89f72; --dim:#dccfb0; --glow:none;
  --head:'Fraunces', Georgia, serif; --radius:3px;
  --paper:repeating-linear-gradient(95deg, rgba(0,0,0,.05) 0 3px, transparent 3px 9px, rgba(255,220,170,.025) 9px 11px, transparent 11px 17px);
}
[data-chassis="cabinet"] header.top { background:#1f1712; border-bottom-color:#8f6420; color:#efe4cc; }
[data-chassis="cabinet"] header.top .muted, [data-chassis="cabinet"] .brand .sub { color:#c9b48f; }
[data-chassis="cabinet"] header.top h1 { color:#e2bf7a; }
[data-chassis="cabinet"] nav.tabs button { color:#efe4cc; }
[data-chassis="cabinet"] header.top .lvl button { color:var(--ink); }
[data-chassis="cabinet"] nav.tabs button.on { color:var(--ink); }
[data-chassis="cabinet"] #view > h2, [data-chassis="cabinet"] #view > h3, [data-chassis="cabinet"] #view > p { color:#efe4cc; }
[data-chassis="cabinet"] #view > h3 .muted { color:#c9b48f; }
[data-chassis="cabinet"] .panel, [data-chassis="cabinet"] .card { box-shadow:0 2px 0 #1a120d, 0 6px 16px rgba(0,0,0,.35); }
[data-chassis="cabinet"] .panel { border-top:3px solid #b08a45; }
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:var(--bg); background-image:var(--paper); color:var(--ink); font:14px/1.5 var(--body); min-height:100vh; }
a { color:var(--accent); }
button, select, input { font:inherit; color:inherit; }
button { cursor:pointer; background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:6px 12px; }
button:hover { border-color:var(--accent); }
button.primary { background:var(--accent); color:var(--panel); border-color:var(--accent); font-weight:600; }
input, select { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:6px 10px; }
h1,h2,h3 { font-family:var(--head); font-weight:400; margin:0 0 8px; letter-spacing:.02em; }
.wrap { max-width:1180px; margin:0 auto; padding:0 16px 60px; }
.muted { color:var(--muted); }
.small { font-size:12px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
.bar { height:10px; background:var(--dim); border-radius:99px; overflow:hidden; min-width:80px; flex:1; }
.bar > i { display:block; height:100%; background:var(--lit); box-shadow:var(--glow); }
.chip { display:inline-block; padding:2px 8px; border:1px solid var(--line); border-radius:99px; font-size:12px; background:var(--panel2); }
.chip.on { background:var(--accent); color:var(--panel); border-color:var(--accent); }
.hand { font-family:'Caveat', cursive; font-size:20px; color:var(--accent); }
.hidden { display:none !important; }
.btnlink { display:inline-block; padding:6px 12px; border-radius:var(--radius); background:var(--accent); color:var(--panel); text-decoration:none; font-weight:600; border:1px solid var(--accent); }
table.cmp { width:100%; border-collapse:collapse; font-size:13px; }
table.cmp td, table.cmp th { padding:4px 6px; border-bottom:1px solid var(--dim); text-align:left; }
.card.gilded { border:2px solid #b08a45; box-shadow:inset 0 0 0 2px #e2bf7a; }
.leaflet-popup-content button { font:13px var(--body); }
.pheno { display:grid; grid-template-columns:repeat(12,1fr); gap:3px; height:80px; align-items:end; max-width:420px; }
.pheno div { height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
.pheno i { display:block; width:100%; min-height:2px; background:var(--dim); border-radius:2px 2px 0 0; }
.pheno i.now { background:var(--accent); }
.pheno span { font-size:10px; color:var(--muted); }
.inseason { color:var(--lit); }
.fix { margin:1px 0 4px 26px; }
.card .rar { position:absolute; top:6px; right:6px; z-index:2; font-size:11px; color:#e2bf7a; text-shadow:0 1px 2px #000; letter-spacing:1px; }
.sprow { display:flex; gap:10px; align-items:center; padding:4px 0; border-bottom:1px dashed var(--dim); }
.sprow .thumb { width:42px; height:42px; flex:none; border-radius:var(--radius); background:var(--panel2) center/cover; }
.sprow .thumb.unknown { filter:grayscale(1) sepia(.6) blur(3px) brightness(.6); }
.sprow:not(.have) { color:var(--muted); }
.vs { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:stretch; }
.vs .side { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; text-align:center; }
.vsmark { align-self:center; font:600 38px var(--head); color:#e2bf7a; text-shadow:0 2px 0 #8f6420; }
.mosaic { display:grid; grid-template-columns:1fr 1fr; gap:3px; aspect-ratio:1; max-width:220px; margin:0 auto 10px; }
.mosaic i { background:var(--panel2) center/cover; border-radius:2px; }
.prestige { font:600 30px var(--head); color:var(--accent); margin-top:6px; }
.envy .big { font-size:17px; margin:4px 0; }
.envy .big b { font:600 30px var(--head); color:var(--accent); }
.tug { display:flex; height:18px; border-radius:99px; overflow:hidden; border:1px solid var(--line); margin:12px 0 4px; }
.tug i:first-child { background:var(--lit); } .tug i:last-child { background:var(--accent); }
.jewels { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.jewel { position:relative; border-radius:var(--radius); overflow:hidden; aspect-ratio:4/5; background:var(--panel2) center/cover; border:2px solid #b08a45; box-shadow:inset 0 0 0 2px #e2bf7a; cursor:pointer; }
.jewel .lab { position:absolute; left:0; right:0; bottom:0; padding:8px; background:linear-gradient(transparent, rgba(20,12,6,.88) 40%); color:#f6eedb; }
.stars { color:#e2bf7a; letter-spacing:2px; }
td.win { font-weight:700; color:var(--lit); }
@media (max-width:600px) { .vs { grid-template-columns:1fr; } .vsmark { text-align:center; } .mosaic { max-width:150px; } }

/* ---------- Header ---------- */
header.top { position:sticky; top:0; z-index:500; background:var(--bg); border-bottom:2px solid var(--line); }
header.top .wrap { padding-top:10px; padding-bottom:0; }
.brand { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.brand h1 { font-size:26px; margin:0; }
.brand .sub { color:var(--muted); font-size:12px; }
.lvl { margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.lvl b { font-family:var(--head); font-size:18px; }
nav.tabs { display:flex; gap:4px; margin-top:8px; overflow-x:auto; scrollbar-width:none; }
nav.tabs button { border-bottom:none; border-radius:var(--radius) var(--radius) 0 0; background:transparent; white-space:nowrap; }
nav.tabs button.on { background:var(--panel); border-color:var(--line); font-weight:600; }
nav.tabs button .lock { opacity:.6; font-size:11px; }
main { padding-top:18px; }

/* ---------- Onboarding ---------- */
#onboard { min-height:100vh; display:grid; place-items:center; padding:16px; }
#onboard .box { width:min(620px,100%); }
#onboard h1 { font-size:44px; }
.term { background:#f9f3e3; color:#3a2f22; border:1px solid var(--line); font:12px/1.6 'Special Elite', 'Courier New', monospace; border-radius:6px; padding:12px; height:220px; overflow:auto; margin-top:14px; white-space:pre-wrap; }
.cascade { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; min-height:40px; }
.cascade span { font-family:var(--head); padding:3px 8px; border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); animation:pop .4s ease-out both; }
@keyframes pop { from { transform:scale(.3) rotate(-8deg); opacity:0; } to { transform:none; opacity:1; } }

/* ---------- Dex grid ---------- */
.dexgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; position:relative; transition:transform .12s; }
.card:hover { transform:translateY(-2px); border-color:var(--accent); }
.card .ph { aspect-ratio:1; background:var(--panel2) center/cover no-repeat; position:relative; }
.card.unknown .ph, .modal .hero.unknown { filter:grayscale(1) sepia(.6) blur(7px) brightness(.6) contrast(1.2); }
.card.unknown::after { content:'?'; position:absolute; top:0; left:0; right:0; aspect-ratio:1; display:grid; place-items:center; font:52px var(--head); color:var(--ink); opacity:.55; pointer-events:none; }
.card .meta { padding:6px 8px 8px; }
.card .num { font-size:11px; color:var(--muted); }
.card .nm { font-family:var(--head); font-size:15px; font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card.unknown .nm { font-style:normal; letter-spacing:.2em; color:var(--muted); }
.card .badge { position:absolute; top:6px; left:6px; font-size:10px; padding:1px 6px; border-radius:99px; background:var(--panel); border:1px solid var(--line); z-index:2; }
.b-disc { color:var(--ink); } .b-supp { color:var(--lit); border-color:var(--lit)!important; } .b-mast { background:var(--accent)!important; color:var(--panel)!important; border-color:var(--accent)!important; }
.pips { display:flex; gap:2px; margin-top:4px; }
.pips i { flex:1; height:4px; background:var(--dim); border-radius:2px; }
.pips i.on { background:var(--lit); }

/* ---------- Modal / reveal ---------- */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:1000; display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:24px 12px; }
.modal { width:min(880px,100%); background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:0; position:relative; }
.modal .hero { height:280px; background:var(--panel2) center/cover no-repeat; position:relative; }
.modal { overflow:hidden; }
.modal .body { padding:18px; }
.modal .x { position:absolute; top:10px; right:10px; z-index:3; }
.gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:6px; }
.gallery a { aspect-ratio:1; background:var(--panel2) center/cover; border-radius:var(--radius); display:block; }
.checks { list-style:none; padding:0; margin:0; }
.checks li { padding:3px 0; }
.checks li.done { color:var(--lit); }
.kv { display:grid; grid-template-columns:auto 1fr; gap:2px 14px; }
.kv dt { color:var(--muted); }
.kv dd { margin:0; }
#reveal { position:fixed; inset:0; z-index:2000; background:radial-gradient(circle at 50% 40%, #3a2c1f, #120d09 70%); color:#f3e9d2; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; animation:fadein .6s; }
#reveal .rph { width:min(420px,80vw); aspect-ratio:1; background:#111 center/cover; border-radius:8px; animation:zoom 1.4s cubic-bezier(.2,.8,.2,1) both; box-shadow:0 0 0 6px #f6eedb, 0 0 0 7px #8f6420, 0 20px 60px rgba(0,0,0,.6); }
#reveal .k { letter-spacing:.35em; font-size:12px; color:#d9b56a; margin-top:18px; animation:fadein 1s .8s both; }
#reveal h2 { font-family:'Fraunces', Georgia, serif; font-size:48px; color:#f6eedb; margin:6px 0; font-style:italic; animation:fadein 1s 1.1s both; text-shadow:none; }
#reveal p { color:#cdbd9c; margin:2px; animation:fadein 1s 1.4s both; }
@keyframes zoom { from { transform:scale(.2); filter:brightness(0); } 60% { filter:brightness(0); } to { transform:none; filter:none; } }
@keyframes fadein { from { opacity:0; } to { opacity:1; } }

/* ---------- Tree ---------- */
.tree ul { list-style:none; margin:0; padding-left:22px; border-left:1px dashed var(--line); }
.tree > ul { border-left:none; padding-left:0; }
.tree li { margin:2px 0; }
.tree summary { cursor:pointer; }
.tree .rank { color:var(--muted); font-size:11px; }
.tree .g { cursor:pointer; }
.tree .g.lit { color:var(--lit); font-style:italic; font-weight:600; text-shadow:var(--glow); }
.tree .g.dark { color:var(--muted); }
.tree .unexplored { color:var(--accent); font-size:11px; }
.tree .minibar { display:inline-block; width:70px; height:6px; background:var(--dim); border-radius:3px; vertical-align:middle; margin:0 6px; overflow:hidden; }
.tree .minibar i { display:block; height:100%; background:var(--lit); }

/* ---------- Map ---------- */
#map { height:520px; border-radius:var(--radius); border:1px solid var(--line); }
.maplayout { display:grid; grid-template-columns:2fr 1fr; gap:16px; }
@media (max-width:820px) { .maplayout { grid-template-columns:1fr; } #map { height:380px; } }

/* ---------- Quests ---------- */
.quest { border-left:4px solid var(--accent); }
.quest.daily { border-left-width:8px; }
.quest h3 { margin-bottom:2px; }
.reward { font-size:12px; color:var(--lit); }

/* ---------- Locked module plate ---------- */
.plate { text-align:center; padding:40px 16px; border:2px dashed var(--line); border-radius:var(--radius); }
.plate h2 { font-size:22px; }

@media (max-width:600px) {
  .brand h1 { font-size:20px; }
  .lvl { margin-left:0; }
  .modal .hero { height:200px; }
  #reveal h2 { font-size:30px; }
}
</style>
</head>
<body data-chassis="notebook">

<!-- ================= ONBOARDING ================= -->
<section id="onboard">
  <div class="box panel">
    <h1>SPOODEX</h1>
    <p class="hand">a living field guide built from the jumping spiders you've actually found</p>
    <p class="muted">Enter your iNaturalist username. SPOODEX reads your public Salticidae observations (read-only, no login), collapses them to genus, and builds your collection. Your iNat account is the save file.</p>
    <form id="loginForm" class="row">
      <input id="loginInput" placeholder="iNaturalist username" autocomplete="off" required style="flex:1;min-width:180px">
      <button class="primary" type="submit">Scan records</button>
    </form>
    <div class="row" style="margin-top:10px">
      <button type="button" data-act="sample">👀 Try a sample naturalist</button>
      <button type="button" data-act="guest">🧭 No records yet? Explore near me</button>
    </div>
    <div id="scanLog" class="term hidden"></div>
    <div id="cascade" class="cascade"></div>
    <div id="initDone" class="hidden" style="margin-top:14px;text-align:center">
      <h2 id="initTitle"></h2>
      <button class="primary" id="openDex">Open SPOODEX</button>
    </div>
  </div>
</section>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header class="top"><div class="wrap">
    <div class="row brand">
      <h1 id="chassisName">SPOODEX</h1><span class="sub" id="chassisSub"></span>
      <div class="lvl">
        <span class="muted" id="whoami"></span>
        <b id="lvlBadge"></b>
        <button id="syncBtn" title="Fetch new/updated observations since last sync">⟳ Sync</button>
        <button id="shareBtn" title="Copy a link to this SPOODEX">🔗 Share</button>
        <button id="menuBtn" title="Settings">⚙</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div></header>
  <main class="wrap" id="view"></main>
</div>

<div id="modalRoot"></div>

<script>
'use strict';
/* =====================================================================
   SPOODEX — single-file prototype
   Layers:  api (throttled iNat client) → sync (incremental import + cache)
            → model (pure derivation: genera, states, mastery, XP, quests)
            → views (render functions per screen)
   All state lives in localStorage; iNaturalist is the source of truth.
   ===================================================================== */

const SALTICIDAE = 48139;               // iNat taxon id for Salticidae
const API = 'https://api.inaturalist.org/v1';
const REF_TTL = 7 * 864e5;              // regional reference trees refresh weekly
const FULL_RESYNC_AFTER = 14 * 864e5;   // periodic full resync catches deletions / re-IDs out of Salticidae

// iNat controlled terms (verified against /v1/controlled_terms)
const ANN = { MALE:'9|11', FEMALE:'9|10', ADULT:'1|2', JUV:'1|8', NYMPH:'1|5', EGG:'22|30', MOLT:'22|28', CONSTRUCTION:'22|35' };

// Heuristic behaviour detection from description / tags / observation fields
const BEH_RX = {
  feed:  /\b(feed\w*|fed|prey|eating|meal|caught|captur\w*|kill\w*)\b/i,
  court: /\b(court\w*|mating|mated|copulat\w*|display\w*|danc\w*)\b/i,
  egg:   /\b(egg ?sacs?|eggs|brood\w*|guard\w*|spiderlings?|retreat|nest|moult\w*|molt\w*|exuvi\w*)\b/i,
};

const TIERS = [
  { min:0,   name:'SPOODEX Mk 0',          sub:'A slightly suspicious digital notebook', chassis:'notebook', module:'Genus records & nearby scanner' },
  { min:5,   name:'Field Notebook',        sub:'Now with a pencil. Region statistics installed.', chassis:'notebook', module:'Region statistics' },
  { min:15,  name:'SPOODEX Mk II',         sub:'Laminated. Mostly waterproof. Lineage tree installed.', chassis:'kit', module:'Lineage tree' },
  { min:30,  name:'SPOODEX Mk III',        sub:'Rarity ledgers installed.', chassis:'kit', module:'Rarity ledgers' },
  { min:50,  name:'Naturalist Cabinet',    sub:'Brass fittings. Mastery ledgers installed.', chassis:'cabinet', module:'Mastery XP ledger' },
  { min:75,  name:'Arachnologist Rig',     sub:'Gilt edges on everything you have mastered.', chassis:'cabinet', module:'Gilded labels for mastered genera' },
  { min:100, name:'Spood Research Station',sub:'Please wipe your boots.', chassis:'cabinet', module:'Everything, plus smugness' },
];
const tierIdx = n => TIERS.reduce((a,t,i)=> n>=t.min ? i : a, 0);

const CRITERIA = [
  { k:'male',      icon:'♂', label:'Photograph a male' },
  { k:'female',    icon:'♀', label:'Photograph a female' },
  { k:'juv',       icon:'◦', label:'Photograph a juvenile' },
  { k:'feed',      icon:'🍴', label:'Record feeding / prey capture' },
  { k:'court',     icon:'💃', label:'Record courtship or display' },
  { k:'egg',       icon:'🕸', label:'Silk & brood: egg sac, retreat, nest or moult' },
  { k:'places',    icon:'📍', label:'Record at 3+ localities (~10 km apart)' },
  { k:'months',    icon:'🗓', label:'Record in 3+ different months' },
  { k:'supported', icon:'🤝', label:'Community-supported genus ID' },
  { k:'species',   icon:'🔬', label:'An observation identified to species' },
];
const MASTERY_AT = 7;

/* ---------------- utils ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => (n ?? 0).toLocaleString();
const pct = (a,b) => b ? Math.min(100, Math.round(100*a/b)) : 0;
const ordinal = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const photoSize = (url, size) => url ? url.replace(/\/(square|thumb|small|medium|large|original)\./, `/${size}.`) : '';
const stripHtml = s => { const d = document.createElement('div'); d.innerHTML = s || ''; return d.textContent; };
const cellLabel = c => c && c.label ? esc(c.label + (c.near ? ` (near ${c.near})` : '')) : c ? `${Math.abs(c.lat).toFixed(2)}°${c.lat<0?'S':'N'} ${Math.abs(c.lng).toFixed(2)}°${c.lng<0?'W':'E'}` : '';
const cellKey = (lat, lng, deg) => `${Math.floor(lat/deg)}:${Math.floor(lng/deg)}`;

const store = {
  get(k, d=null) { try { const v = localStorage.getItem('spoodex:'+k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('spoodex:'+k, JSON.stringify(v)); return true; } catch (e) { console.warn('SPOODEX storage write failed', e); return false; } },
  del(k) { try { localStorage.removeItem('spoodex:'+k); } catch {} },
};

/* ---------------- api: throttled to ~1 req/s per iNat recommended practice ---------------- */
let nextSlot = 0;
async function api(path, params = {}) {
  const qs = new URLSearchParams(Object.entries(params).filter(([,v]) => v != null && v !== '')).toString();
  const url = `${API}${path}${qs ? '?'+qs : ''}`;
  for (let attempt = 0; attempt < 4; attempt++) {
    const now = Date.now(), slot = Math.max(now, nextSlot);
    nextSlot = slot + 1100;
    if (slot > now) await sleep(slot - now);
    let r;
    try { r = await fetch(url); } catch (e) { await sleep(2000); continue; }
    if (r.status === 429 || r.status >= 500) { await sleep(4000 * (attempt+1)); continue; }
    if (!r.ok) throw new Error(`iNaturalist returned ${r.status} for ${path}`);
    return r.json();
  }
  throw new Error('iNaturalist is busy or rate-limiting; try again in a minute.');
}

function addNode(t) {
  if (!t || !t.id || !t.rank) return;
  S.nodes[t.id] = { n:t.name, r:t.rank, l:t.rank_level, p:t.parent_id };
}

/* ---------------- sync: full import, then incremental via updated_since ---------------- */
function trimObs(o) {
  const t = o.taxon || {};
  addNode(t);
  const anc = [...(t.ancestor_ids || [])];
  if (t.id && !anc.includes(t.id)) anc.push(t.id);
  let ct = null;
  if (o.community_taxon_id) {
    if (o.community_taxon_id === t.id) ct = anc;
    else {
      const idn = (o.identifications || []).find(i => i.taxon && i.taxon.id === o.community_taxon_id);
      if (idn) { addNode(idn.taxon); ct = [...(idn.taxon.ancestor_ids || []), idn.taxon.id]; }
    }
  }
  const ann = (o.annotations || [])
    .filter(a => (a.votes || []).reduce((s,v) => s + (v.vote_flag === false ? -1 : 1), 0) >= 0)
    .map(a => a.controlled_attribute_id + '|' + a.controlled_value_id);
  const text = [o.description || '', ...(o.tags || []), ...(o.ofvs || []).map(f => `${f.name} ${f.value}`)].join(' ');
  const beh = Object.keys(BEH_RX).filter(k => BEH_RX[k].test(text));
  const c = o.geojson && o.geojson.coordinates;
  return {
    id:o.id, d:o.observed_on || (o.created_at || '').slice(0,10), q:o.quality_grade, cap:!!o.captive,
    t:{ id:t.id, n:t.name, r:t.rank, l:t.rank_level }, anc, ct,
    lat: c ? c[1] : null, lng: c ? c[0] : null, ob: !!o.obscured, pg:o.place_guess || '',
    pl:o.place_ids || [], ph:(o.photos || []).slice(0,3).map(p => p.url), ann, beh,
  };
}

const GUEST = '__guest';
const SAMPLE_LOGIN = 'themoojuice';   // "Try a sample naturalist": any public account with plenty of salticids
const isGuest = () => S.login === GUEST;
const who = () => isGuest() ? 'Guest naturalist' : S.login;

async function fetchPlaces(ids, log = () => {}) {
  const need = [...new Set(ids)].filter(id => !S.places[id]);
  if (need.length) log(`Mapping ${need.length} places…`);
  for (let i = 0; i < need.length; i += 100) {
    const batch = need.slice(i, i+100);
    const d = await api('/places/' + batch.join(','));
    batch.forEach(id => S.places[id] = { n:null, l:null });
    d.results.forEach(p => S.places[p.id] = { n:p.name, l:p.admin_level });
  }
}

// Import (or incrementally refresh) one naturalist's salticid records into a save object {obs, meta}.
// Used for the player and for whoever they are comparing against.
async function importRecords(login, save, { full=false, log=()=>{} } = {}) {
  const t0 = new Date().toISOString();
  save.meta = save.meta || {};
  if (!full && save.meta.lastFull && Date.now() - Date.parse(save.meta.lastFull) > FULL_RESYNC_AFTER) full = true;
  if (!save.meta.lastSync) full = true;
  const since = full ? null : save.meta.lastSync;
  const obs = full ? {} : (save.obs || {});
  let idAbove = 0, got = 0, total = null;
  log(full ? `Scanning naturalist records for ${login}…` : `Checking ${login} for records updated since ${since.slice(0,16).replace('T',' ')}…`);
  while (true) {
    const d = await api('/observations', { taxon_id:SALTICIDAE, user_login:login, per_page:200, order_by:'id', order:'asc', id_above:idAbove || null, updated_since:since });
    if (total == null) { total = d.total_results; log(`${fmt(total)} Salticidae observation${total===1?'':'s'} ${full?'found':'updated'}.`); }
    for (const o of d.results) obs[o.id] = trimObs(o);
    got += d.results.length;
    if (d.results.length) log(`  …received ${fmt(got)} / ${fmt(total)}`);
    if (d.results.length < 200) break;
    idAbove = d.results[d.results.length - 1].id;
  }
  save.obs = obs;
  if (full && !Object.keys(obs).length) log(`No public Salticidae observations for "${login}". Check the spelling, or go find a spood!`);
  // Taxonomy tree of these records gives names/ranks for every ancestor (tribes, subfamilies, genera).
  log('Resolving lineages…');
  const tree = await api('/observations/taxonomy', { taxon_id:SALTICIDAE, user_login:login });
  tree.results.forEach(addNode);
  await fetchPlaces(Object.values(obs).flatMap(o => o.pl), log);
  save.meta.lastSync = t0;
  if (full) save.meta.lastFull = t0;
  return total;
}

async function loadRefs(log = () => {}) {
  log('Loading regional reference collections…');
  for (const sc of new Set(['country', 'state', S.prefs.scope])) if (sc === 'world' || scopePlace(sc)) await ensureRef(sc);
}
async function sync({ full=false, log=()=>{} } = {}) {
  if (!isGuest()) await importRecords(S.login, S.u, { full, log });
  saveUser(); saveShared();
  if (S.u.base && !S.u.base.places) await resolveBasePlaces(log);
  S.M = buildModel();
  await loadRefs(log);
  S.M = buildModel();
}

// Home base: lets beginners and guests scan before they have recorded anything.
// Country/state are borrowed from the nearest public observation's standard places.
async function resolveBasePlaces(log = () => {}) {
  const b = S.u.base; if (!b) return;
  log('Locating home base…');
  let d = await api('/observations', { lat:b.lat, lng:b.lng, radius:5, per_page:1, verifiable:true });
  if (!d.results.length) d = await api('/observations', { lat:b.lat, lng:b.lng, radius:50, per_page:1, verifiable:true });
  const pl = d.results[0]?.place_ids || [];
  await fetchPlaces(pl);
  const pick = lvl => pl.find(p => S.places[p]?.l === lvl) || null;
  b.places = { country:pick(0), state:pick(10) };
  // Only generic labels need a "near …" hint; searched place names already say where they are
  b.near = ['Your location', 'Map point'].includes(b.label) ? (S.places[pick(20)]?.n || S.places[pick(10)]?.n || null) : null;
  saveUser(); saveShared();
}
async function setBase(lat, lng, label) {
  S.u.base = { lat:+(+lat).toFixed(2), lng:+(+lng).toFixed(2), label };
  saveUser();
  try {
    await resolveBasePlaces();
    S.M = buildModel();
    await loadRefs();
    S.M = buildModel();
    toast(`Home base set: ${label}${S.u.base.near ? ' (near ' + S.u.base.near + ')' : ''}`);
    S.tab = 'map'; render();
    showCell(S.M.homeCell.k); scanCell(S.M.homeCell.k);
  } catch (e) { toast(e.message); }
}
function geolocate() {
  if (!navigator.geolocation) return toast('Location is not available in this browser.');
  toast('Asking your browser for your location…');
  navigator.geolocation.getCurrentPosition(
    p => setBase(p.coords.latitude, p.coords.longitude, 'Your location'),
    err => toast('Could not get your location: ' + err.message),
    { timeout:15000, maximumAge:600000 });
}

function scopePlace(scope) {
  const M = S.M;
  if (scope === 'world') return null;
  return scope === 'state' ? (M.home.state || M.home.country) : M.home.country;
}
function scopeLabel(scope) {
  const id = scopePlace(scope);
  return id ? (S.places[id]?.n || 'home region') : 'the world';
}
async function ensureRef(scope) {
  const pid = scopePlace(scope);
  const key = pid ? 'p' + pid : 'world';
  const cur = S.ref[key];
  if (cur && cur.s && Date.now() - cur.ts < REF_TTL) return cur;
  const d = await api('/observations/taxonomy', { taxon_id:SALTICIDAE, place_id:pid, verifiable:true });
  const g = {}, s = {};
  d.results.forEach(r => {
    addNode(r);
    const c = r.descendant_obs_count || r.count || 0;
    if (r.rank === 'genus') g[r.id] = c;
    if (r.rank === 'species') s[r.id] = c;
  });
  S.ref[key] = { ts:Date.now(), g, s };
  saveShared();
  return S.ref[key];
}
function refFor(scope) {
  const pid = scopePlace(scope);
  return S.ref[pid ? 'p'+pid : 'world'] || null;
}

// Background: genus portraits + natural history blurbs (default photo & Wikipedia summary via iNat)
let infoBusy = false;
async function ensureInfo(ids) {
  const need = [...new Set(ids)].filter(id => !S.info[id]);
  if (!need.length || infoBusy) return;
  infoBusy = true;
  try {
    for (let i = 0; i < need.length; i += 30) {
      const batch = need.slice(i, i+30);
      const d = await api('/taxa/' + batch.join(','));
      batch.forEach(id => S.info[id] = S.info[id] || {});
      d.results.forEach(t => {
        const dp = t.default_photo || {};
        S.info[t.id] = { p:dp.medium_url || dp.url || '', a:dp.attribution || '', s:stripHtml(t.wikipedia_summary || ''), w:t.wikipedia_url || '', c:t.observations_count || 0 };
      });
      saveShared();
      softRender();
    }
  } catch (e) { console.warn(e); }
  infoBusy = false;
}

/* ---------------- model: pure derivation from cached observations ---------------- */
function speciesOf(anc) { for (const id of anc || []) if (S.nodes[id]?.r === 'species') return id; return null; }
function genusOfNode(id) { let c = id, guard = 0; while (c && S.nodes[c]?.r !== 'genus' && guard++ < 10) c = S.nodes[c]?.p; return S.nodes[c]?.r === 'genus' ? c : null; }
function genusOf(anc) { for (const id of anc || []) if (S.nodes[id]?.r === 'genus') return id; return null; }
function lineage(id) {
  const out = []; let cur = S.nodes[id]?.p, guard = 0;
  while (cur && cur !== SALTICIDAE && guard++ < 20) { if (S.nodes[cur]) out.unshift({ id:cur, ...S.nodes[cur] }); cur = S.nodes[cur]?.p; }
  return out;
}
const lineageText = id => lineage(id).map(n => n.n).join(' › ') || 'Salticidae';

function buildModel(obsMap = S.u.obs, base = S.u.base) {
  const all = Object.values(obsMap).filter(o => !o.cap).sort((a,b) => (a.d||'').localeCompare(b.d||'') || a.id - b.id);
  const G = new Map(), leads = new Map(), SP = new Map();
  let xpTotal = 0;
  const cells25 = new Map(), dayDisc = new Map(), fieldDays = new Set(), behObs = { feed:0, court:0, egg:0 };
  const monthsAll = new Set(), cellsAll01 = new Set();
  for (const o of all) {
    if (o.d) { fieldDays.add(o.d); monthsAll.add(+o.d.slice(5,7)); }
    o.beh.forEach(b => behObs[b]++);
    if (o.ann.includes(ANN.EGG) || o.ann.includes(ANN.MOLT) || o.ann.includes(ANN.CONSTRUCTION)) { if (!o.beh.includes('egg')) behObs.egg++; }
    if (o.lat != null) {
      cellsAll01.add(cellKey(o.lat,o.lng,.1));
      const k = cellKey(o.lat, o.lng, .25);
      const c = cells25.get(k) || { k, lat:(Math.floor(o.lat/.25)+.5)*.25, lng:(Math.floor(o.lng/.25)+.5)*.25, n:0, g:new Set() };
      c.n++; cells25.set(k, c);
    }
    const gid = genusOf(o.anc);
    if (!gid) {
      const L = leads.get(o.t.id) || { id:o.t.id, name:o.t.n || 'Unknown', rank:o.t.r, obs:[] };
      L.obs.push(o); leads.set(o.t.id, L); continue;
    }
    if (o.lat != null) cells25.get(cellKey(o.lat,o.lng,.25)).g.add(gid);
    let g = G.get(gid);
    const events = [];
    if (!g) {
      g = { id:gid, name:S.nodes[gid]?.n || '?', obs:[], first:o, species:new Set(), c01:new Set(), months:new Set(), years:new Set(),
            f:{}, xp:0, xpLog:[], photos:[], places:new Set(), dup:0 };
      G.set(gid, g);
      events.push(['New genus', 100]);
      if (o.d) dayDisc.set(o.d, (dayDisc.get(o.d) || 0) + 1);
    }
    g.obs.push(o);
    const sid = speciesOf(o.anc);
    if (sid) {
      let sp = SP.get(sid);
      if (!sp) { sp = { id:sid, name:S.nodes[sid]?.n || o.t.n, gid, obs:[], first:o, photos:[] }; SP.set(sid, sp); }
      sp.obs.push(o);
      for (const p of o.ph) if (sp.photos.length < 8) sp.photos.push({ url:p, id:o.id });
      (g.sp = g.sp || new Set()).add(sid);
    }
    const f = g.f, mark = (k, label, xp) => { if (!f[k]) { f[k] = true; if (g.obs.length > 1) events.push([label, xp]); } };
    if (o.ann.includes(ANN.MALE)) mark('male', 'Male recorded', 40);
    if (o.ann.includes(ANN.FEMALE)) mark('female', 'Female recorded', 40);
    if (o.ann.includes(ANN.JUV) || o.ann.includes(ANN.NYMPH)) mark('juv', 'Juvenile recorded', 40);
    if (o.beh.includes('feed')) mark('feed', 'Feeding behaviour', 80);
    if (o.beh.includes('court')) mark('court', 'Courtship / display', 80);
    if (o.beh.includes('egg') || o.ann.includes(ANN.EGG) || o.ann.includes(ANN.MOLT) || o.ann.includes(ANN.CONSTRUCTION)) mark('egg', 'Silk & brood evidence', 80);
    if (o.ct && o.ct.includes(gid)) mark('supported', 'Community-supported ID', 50);
    if (o.q === 'research') f.rg = true;
    if (o.t.l != null && o.t.l <= 10) {
      const sp = o.t.l === 10 ? o.t.n : o.t.n.split(' ').slice(0,2).join(' ');
      if (!g.species.has(sp)) { g.species.add(sp); f.species = true; if (g.obs.length > 1) events.push(['New species in genus', 60]); }
    }
    if (o.lat != null) { const k = cellKey(o.lat,o.lng,.1); if (!g.c01.has(k)) { g.c01.add(k); if (g.obs.length > 1) events.push(['New locality', 40]); } }
    if (o.d) {
      const m = +o.d.slice(5,7); if (!g.months.has(m)) { g.months.add(m); if (g.obs.length > 1) events.push(['New month', 20]); }
      g.years.add(o.d.slice(0,4));
    }
    o.pl.forEach(p => g.places.add(p));
    if (!events.length) { g.dup++; events.push(['Duplicate record', Math.max(1, Math.round(10 / g.dup))]); }
    for (const [label, xp] of events) { g.xp += xp; xpTotal += xp; g.xpLog.push({ d:o.d, label, xp, id:o.id }); }
    for (const p of o.ph) if (g.photos.length < 24) g.photos.push({ url:p, id:o.id });
  }
  // Discovery states & levels
  let order = 0;
  const genera = [...G.values()].sort((a,b) => (a.first.d||'').localeCompare(b.first.d||'') || a.first.id - b.first.id);
  for (const g of genera) {
    g.discIndex = ++order;
    g.f.places = g.c01.size >= 3;
    g.f.months = g.months.size >= 3;
    g.level = CRITERIA.filter(c => g.f[c.k]).length;
    g.state = g.level >= MASTERY_AT ? 'MASTERED' : g.f.supported ? 'SUPPORTED' : 'DISCOVERED';
    g.last = g.obs[g.obs.length-1];
    // cover photo: prefer research-grade record photo
    const rg = g.obs.find(o => o.q === 'research' && o.ph.length);
    g.cover = rg ? rg.ph[0] : (g.photos[0]?.url || '');
  }
  for (const g of genera) g.sp = g.sp || new Set();
  for (const sp of SP.values()) { const rgo = sp.obs.find(o => o.q === 'research' && o.ph.length); sp.cover = rgo ? rgo.ph[0] : (sp.photos[0]?.url || ''); }
  // Home region = most frequent country & state across records
  const cnt = {}; all.forEach(o => o.pl.forEach(p => cnt[p] = (cnt[p]||0) + 1));
  const best = lvl => Object.keys(cnt).filter(p => S.places[p]?.l === lvl).sort((a,b) => cnt[b]-cnt[a])[0];
  const bp = base?.places || {};
  const home = { country: best(0) ? +best(0) : bp.country || null, state: best(10) ? +best(10) : bp.state || null };
  const homeCell = base ? { ...pointFromKey(`pt:${base.lat},${base.lng}`), label:base.label, near:base.near }
                        : ([...cells25.values()].sort((a,b) => b.n - a.n)[0] || null);
  // Discovery streaks over field days
  const days = [...fieldDays].sort();
  let run = 0, bestRun = 0;
  for (const d of days) { if (dayDisc.has(d)) { run++; bestRun = Math.max(bestRun, run); } else run = 0; }
  const year = String(new Date().getFullYear());
  return {
    obs:all, G, genera, leads:[...leads.values()].sort((a,b) => b.obs.length - a.obs.length), xp:xpTotal,
    cells25, cellsAll01, fieldDays:days, dayDisc, streak:run, bestStreak:bestRun, home, homeCell, behObs, monthsAll,
    newThisYear: genera.filter(g => (g.first.d||'').startsWith(year)).length,
    S: SP, species: SP.size,
    tier: tierIdx(G.size),
  };
}

// Scan points: either a 25 km grid square you've recorded in, or an arbitrary "pt:lat,lng"
function pointFromKey(k) {
  const m = /^pt:(-?[\d.]+),(-?[\d.]+)$/.exec(k || ''); if (!m) return null;
  return { k, lat:+m[1], lng:+m[2], n:0, g:new Set() };
}
function pointFor(k) { return S.M.cells25.get(k) || (S.M.homeCell?.k === k ? S.M.homeCell : pointFromKey(k)); }

/* ---------------- scope helpers ---------------- */
function scopeGenera(scope = S.prefs.scope) {
  const ref = refFor(scope);
  const inScope = ref ? Object.keys(ref.g).map(Number) : [];
  const set = new Set(inScope);
  const extras = S.M.genera.filter(g => !set.has(g.id)).map(g => g.id);
  return { ref, inScope, extras, found: inScope.filter(id => S.M.G.has(id)).length };
}
// Taxonomic order: DFS through the merged tree, alphabetical within each node
function taxonomicOrder(ids) {
  const want = new Set(ids), kids = {};
  const add = id => { const p = S.nodes[id]?.p; if (!p || id === SALTICIDAE) return; (kids[p] = kids[p] || new Set()).add(id); if (p !== SALTICIDAE) add(p); };
  ids.forEach(add);
  const out = [];
  const walk = id => { const ch = [...(kids[id] || [])].sort((a,b) => (S.nodes[a]?.n||'').localeCompare(S.nodes[b]?.n||'')); ch.forEach(c => { if (want.has(c)) out.push(c); walk(c); }); };
  walk(SALTICIDAE);
  ids.forEach(id => { if (!out.includes(id)) out.push(id); });
  return { order:out, kids };
}
const sortedCache = new WeakMap();
function refCount(id, kind = 'g', scope = S.prefs.scope) { const t = refFor(scope)?.[kind]; return t && t[id] != null ? t[id] : null; }
function rarityTier(id, scope = S.prefs.scope, kind = 'g') {
  const table = refFor(scope)?.[kind]; if (!table || table[id] == null) return null;
  let counts = sortedCache.get(table);
  if (!counts) { counts = Object.values(table).sort((a,b) => a-b); sortedCache.set(table, counts); }
  const rank = counts.findIndex(c => c >= table[id]) / Math.max(1, counts.length - 1);
  return { count:table[id], label: rank < .33 ? 'Few records' : rank < .66 ? 'Moderate records' : 'Many records', stars: rank < .33 ? 3 : rank < .66 ? 2 : 1 };
}
// ★ 1–3 by iNat record scarcity in scope; a taxon absent from the regional reference counts as ★★★
function starsFor(id, kind = 'g') { const r = rarityTier(id, S.prefs.scope, kind); return r ? r.stars : (refFor(S.prefs.scope)?.[kind] ? 3 : 1); }
function rarityNote(id, kind = 'g') {
  const c = refCount(id, kind), where = scopeLabel(S.prefs.scope);
  if (c != null) return `${fmt(c)} iNat record${c === 1 ? '' : 's'} in ${where}`;
  return refFor(S.prefs.scope)?.[kind] ? `none on iNat in ${where}` : '';
}
// Collection prestige: rarity-weighted collection size (genera ×10, species ×3)
function prestige(M) {
  let p = 0;
  M.G.forEach((g, id) => p += 10 * starsFor(id, 'g'));
  M.S.forEach((s, id) => p += 3 * starsFor(id, 's'));
  return p;
}
const moduleOn = minTier => S.prefs.peek || S.M.tier >= minTier;

/* ---------------- field style & titles ---------------- */
function fieldStyle(M) {
  const s = [];
  if (M.cellsAll01.size >= 25) s.push(['🧭','Explorer', `${M.cellsAll01.size} localities`]);
  const beh = M.behObs.feed + M.behObs.court + M.behObs.egg;
  if (beh >= 5) s.push(['🕸','Behaviour observer', `${beh} behaviour records`]);
  const lifeStage = M.genera.filter(g => g.f.male && g.f.female).length;
  if (lifeStage >= 5) s.push(['⚥','Dimorphism detective', `${lifeStage} genera with both sexes`]);
  if (M.monthsAll.size >= 10) s.push(['🗓','Year-round spooder', `${M.monthsAll.size} months of the year`]);
  const mastered = M.genera.filter(g => g.state === 'MASTERED').length;
  if (mastered) s.push(['🏅','Genus master', `${mastered} mastered`]);
  return s;
}
function favouriteLineages(M) {
  const c = {};
  M.genera.forEach(g => { const L = lineage(g.id); const tribe = L.find(n => n.r === 'tribe') || L.find(n => n.r === 'subfamily'); if (tribe) { c[tribe.n] = c[tribe.n] || { n:tribe.n, g:0, o:0 }; c[tribe.n].g++; c[tribe.n].o += g.obs.length; } });
  return Object.values(c).sort((a,b) => b.g - a.g || b.o - a.o);
}
function generatedTitle(M) {
  const fav = favouriteLineages(M)[0];
  const nouns = ['Notebook Scribbler','Spood Apprentice','Spood Naturalist','Spood Wrangler','Spood Wizard','Arachno-Sage','Station Chief'];
  const noun = nouns[Math.min(M.tier, nouns.length-1)];
  if (!fav) return 'Aspiring Spooder';
  const adj = fav.n.replace(/ini$/, 'ine').replace(/inae$/, 'ine');
  return `${adj} ${noun}`;
}

/* ---------------- quests: generated from genuine gaps ---------------- */
function scanFor(cell) { return cell ? S.u.scans[cell.k] : null; }
function buildQuests(M) {
  const q = [];
  if (!M.G.size) q.push({ id:'first', kind:'first', icon:'🕷', title:'Your First Spood', text:'Find a jumping spider, photograph it and upload it to iNaturalist. Once it is identified to genus, sync SPOODEX and your first card unlocks.', reward:100 });
  if (!M.homeCell) q.push({ id:'base', kind:'base', icon:'🏠', title:'Pick a Home Base', text:'Tell SPOODEX where you usually spood and it will list the genera recorded around you.', reward:0 });
  const act = M.homeCell && S.u.active?.[M.homeCell.k];
  if (act) {
    const miss = act.g.filter(x => !M.G.has(x.id)).sort((a,b) => b.c - a.c);
    if (miss.length) q.push({ id:'active:'+M.homeCell.k+':'+act.d1, kind:'hunt', icon:'🔥', title:'Active Right Now',
      text:`${miss.length} genera you haven't recorded have been found within 25 km of your home base in the last ${ACTIVE_DAYS} days. They're out there now.`,
      targets:miss.slice(0,6).map(x => x.id), recent:Object.fromEntries(miss.map(x => [x.id, x.c])), reward:300 });
    else if (act.g.length) q.push({ id:'active-mastery', kind:'info', icon:'🔥', title:'Everything Active Is Already Yours',
      text:`All ${act.g.length} genera recorded near your home base in the last ${ACTIVE_DAYS} days are in your SPOODEX. Good time to chase mastery on them.`,
      targets:act.g.slice(0,6).map(x => x.id), reward:0 });
  }
  const scan = scanFor(M.homeCell);
  if (scan) {
    const missing = scan.g.filter(x => !M.G.has(x.id)).sort((a,b) => b.c - a.c);
    if (missing.length) q.push({ id:'hunt:'+M.homeCell.k, kind:'hunt', icon:'🎯', title:'Genus Hunt',
      text:`${missing.length} Salticidae genera recorded within 25 km of your home base aren't in your SPOODEX. Find one.`,
      targets:missing.slice(0,6).map(x => x.id), reward:250 });
  } else if (M.homeCell) {
    q.push({ id:'scan-home', kind:'scan', icon:'📡', title:'Calibrate the scanner', text:'Scan the area around your home base to reveal nearby genera you have not recorded yet.', reward:0 });
  }
  const ref = refFor(S.prefs.scope);
  if (ref && moduleOn(2)) {
    const { kids } = taxonomicOrder(Object.keys(ref.g).map(Number));
    const tribes = Object.keys(S.nodes).map(Number).filter(id => ['tribe','subfamily'].includes(S.nodes[id].r) && kids[id]);
    const under = (id) => { const out = []; const w = x => (kids[x] ? [...kids[x]] : []).forEach(c => { if (S.nodes[c]?.r === 'genus') out.push(c); w(c); }); w(id); return out; };
    const empty = tribes.map(id => ({ id, g:under(id) })).filter(t => t.g.length && !t.g.some(g => M.G.has(g)))
      .sort((a,b) => b.g.reduce((s,x) => s + (ref.g[x]||0), 0) - a.g.reduce((s,x) => s + (ref.g[x]||0), 0));
    if (empty[0]) q.push({ id:'lineage:'+empty[0].id, kind:'lineage', icon:'🌳', title:'Unexplored Lineage',
      text:`You have nothing from ${S.nodes[empty[0].id].n} (${S.nodes[empty[0].id].r}). ${empty[0].g.length} ${empty[0].g.length===1?'genus':'genera'} from it ${empty[0].g.length===1?'is':'are'} recorded in ${scopeLabel(S.prefs.scope)}.`, node:empty[0].id, targets:empty[0].g, reward:300 });
  }
  if (M.leads.length) {
    const n = M.leads.reduce((s,l) => s + l.obs.length, 0);
    q.push({ id:'resolve', kind:'resolve', icon:'👁', title:'Something Is Lurking',
      text:`${n} of your observations are stuck above genus (${M.leads.slice(0,3).map(l => l.name).join(', ')}…). Add better photos, annotate, or ask for IDs.`,
      obs:M.leads.flatMap(l => l.obs.map(o => o.id)).slice(0,50), reward:100 });
  }
  const near = M.genera.filter(g => g.state !== 'MASTERED').sort((a,b) => b.level - a.level || b.obs.length - a.obs.length)[0];
  if (near) {
    const miss = CRITERIA.filter(c => !near.f[c.k]);
    q.push({ id:'master:'+near.id, kind:'master', icon:'🏅', title:`Towards Mastery: ${near.name}`,
      text:`${near.name} is at level ${near.level}/10. Still to do: ${miss.slice(0,3).map(c => c.label.toLowerCase()).join('; ')}.`, gid:near.id, crit:miss[0]?.k, reward:150 });
  }
  const behs = [['feed','Feeding frenzy','Photograph a salticid feeding or with prey'],['court','Dance floor','Record courtship or display'],['egg','Silk & brood','Find an egg sac, retreat, nest or moult']]
    .sort((a,b) => M.behObs[a[0]] - M.behObs[b[0]]);
  q.push({ id:'beh:'+behs[0][0], kind:'beh', icon:'🔍', title:`Behaviour: ${behs[0][1]}`, text:`${behs[0][2]}. You have ${M.behObs[behs[0][0]]} so far. Mention it in the description or tags so SPOODEX can see it.`, beh:behs[0][0], base:M.behObs[behs[0][0]], reward:80 });
  const holeMonths = [...Array(12).keys()].map(i => i+1).filter(m => !M.monthsAll.has(m));
  const thisMonth = new Date().getMonth() + 1;
  if (holeMonths.includes(thisMonth)) q.push({ id:'month:'+thisMonth, kind:'month', icon:'🗓', title:'Off-Season Spooding', text:`You've never recorded a salticid in ${MONTHS[thisMonth-1]}. This month is your chance.`, m:thisMonth, reward:120 });
  q.push({ id:'explore', kind:'explore', icon:'🧭', title:'Change of Scenery', text:`Record a salticid in a new 25 km grid square (you have ${M.cells25.size}). Bonus if it's a habitat you rarely visit.`, base:M.cells25.size, reward:150 });
  const oneSex = M.genera.filter(g => (g.f.male ^ g.f.female)).sort((a,b) => b.obs.length - a.obs.length)[0];
  if (oneSex) q.push({ id:'sex:'+oneSex.id, kind:'master', icon:oneSex.f.male ? '♀' : '♂', title:'The Other Half', text:`You've recorded a ${oneSex.f.male ? 'male' : 'female'} ${oneSex.name} but never a ${oneSex.f.male ? 'female' : 'male'}. Annotate sex on iNat when you do.`, gid:oneSex.id, crit:oneSex.f.male ? 'female' : 'male', reward:40 });
  // Daily pick, seeded by date
  const seed = new Date().toISOString().slice(0,10).split('-').reduce((a,b) => a*31 + +b, 7);
  const pickable = q.filter(x => x.kind !== 'scan');
  if (pickable.length) pickable[seed % pickable.length].daily = true;
  return q;
}
function questDone(q, M) {
  switch (q.kind) {
    case 'hunt': case 'lineage': return (q.targets || []).some(id => M.G.has(id));
    case 'resolve': return (q.obs || []).some(id => S.u.obs[id] && genusOf(S.u.obs[id].anc));
    case 'master': return !!M.G.get(q.gid)?.f[q.crit];
    case 'beh': return M.behObs[q.beh] > q.base;
    case 'month': return M.monthsAll.has(q.m);
    case 'explore': return M.cells25.size > q.base;
    case 'first': return M.G.size > 0;
    default: return false;
  }
}

function cardHtml(id, num) {
  const M = S.M, g = M.G.get(id), info = S.info[id] || {};
  const lin = lineage(id), tribe = (lin.find(n => n.r === 'tribe') || lin.find(n => n.r === 'subfamily') || {}).n || 'Salticidae';
  if (!g) {
    const name = S.prefs.reveal ? `<i>${esc(S.nodes[id]?.n)}</i>` : '???';
    return `<div class="card unknown" data-genus="${id}"><div class="ph" style="background-image:url('${esc(info.p||'')}')"></div>
      <div class="meta"><div class="num">#${String(num).padStart(3,'0')} · ${esc(tribe)}</div><div class="nm">${name}</div><div class="pips">${'<i></i>'.repeat(10)}</div></div></div>`;
  }
  const cls = g.state === 'MASTERED' ? 'b-mast' : g.state === 'SUPPORTED' ? 'b-supp' : 'b-disc';
  return `<div class="card ${g.state === 'MASTERED' && moduleOn(5) ? 'gilded' : ''}" data-genus="${id}"><span class="badge ${cls}">${g.state}</span>
    <div class="ph" style="background-image:url('${esc(photoSize(g.cover,'small') || info.p || '')}')"></div>
    <div class="meta"><div class="num">#${String(num).padStart(3,'0')} · ${esc(tribe)}</div><div class="nm">${esc(g.name)}</div>
    <div class="small muted">${g.obs.length} obs · ${g.c01.size} loc. · ${g.sp.size} sp.</div>
    <div class="pips">${CRITERIA.map(c => `<i class="${g.f[c.k]?'on':''}"></i>`).join('')}</div></div></div>`;
}

function viewDex() {
  if (S.prefs.layer === 'species') return viewDexSpecies();
  const M = S.M, sc = scopeGenera(), P = S.prefs;
  const { order } = taxonomicOrder(sc.inScope);
  const num = new Map(order.map((id,i) => [id, i+1]));
  const filt = id => {
    const g = M.G.get(id);
    if (P.filter === 'found') return !!g;
    if (P.filter === 'missing') return !g;
    if (P.filter === 'supported') return g && g.state !== 'DISCOVERED';
    if (P.filter === 'mastered') return g && g.state === 'MASTERED';
    return true;
  };
  const shown = order.filter(filt);
  ensureInfo([...order, ...sc.extras]);
  const chips = [['all','All'],['found','Recorded'],['missing','Missing'],['supported','Supported+'],['mastered','Mastered']];
  return `
  <div class="panel row" style="margin-bottom:14px">
    ${layerSwitch()}
    <b style="font-family:var(--head);font-size:20px">${sc.found} / ${sc.inScope.length || '?'}</b>
    <span class="muted">genera on iNat in</span>
    <select data-pref="scope">${['country','state','world'].map(s => `<option value="${s}" ${P.scope===s?'selected':''}>${esc(s==='world'?'World':scopeLabel(s))}</option>`).join('')}</select>
    <div class="bar" style="max-width:220px"><i style="width:${pct(sc.found, sc.inScope.length)}%"></i></div>
    <span>${chips.map(([k,l]) => `<span class="chip ${P.filter===k?'on':''}" data-filter="${k}" style="cursor:pointer">${l}</span>`).join(' ')}</span>
    <label class="small"><input type="checkbox" data-pref="reveal" ${P.reveal?'checked':''}> reveal names</label>
  </div>
  ${sc.ref ? '' : M.home.country || P.scope === 'world' ? '<p class="muted">Loading reference collection…</p>' : '<div class="panel"><p>Set a home base so SPOODEX knows which genera belong in your region.</p><button class="primary" data-tab="map">Set home base</button></div>'}
  <div class="dexgrid">${shown.map(id => cardHtml(id, num.get(id))).join('')}</div>
  ${sc.extras.length ? `<h2 style="margin-top:22px">Recorded outside ${esc(scopeLabel(P.scope))} (+${sc.extras.length})</h2>
    <div class="dexgrid">${sc.extras.map(id => cardHtml(id, 0)).join('')}</div>` : ''}
  ${M.leads.length ? `<h2 style="margin-top:22px">👁 Glimpsed — something is lurking</h2>
    <p class="muted">Observations identified only above genus. Each could be a genus you haven't unlocked yet. Better photos, annotations or an ID request might crack them.</p>
    <div class="grid2">${M.leads.slice(0,12).map(l => `<div class="panel"><b>${esc(l.name)}</b> <span class="muted small">${esc(l.rank)}</span> — ${l.obs.length} obs
      <div class="gallery" style="margin-top:6px">${l.obs.slice(0,6).map(o => `<a href="https://www.inaturalist.org/observations/${o.id}" target="_blank" rel="noopener" style="background-image:url('${esc(o.ph[0]||'')}')"></a>`).join('')}</div></div>`).join('')}</div>` : ''}`;
}

/* ---------------- species layer: an optional side collection (level stays = genera) ---------------- */
function speciesInScope(scope = S.prefs.scope) {
  const ref = refFor(scope);
  let ids = ref?.s ? Object.keys(ref.s).map(Number) : [];
  // The world has thousands of salticid species; only list those in genera you've found
  if (scope === 'world') ids = ids.filter(id => S.M.G.has(genusOfNode(id)));
  return ids;

/* ---------------- best months: iNat month-of-year histogram per genus, in your home state ---------------- */
const PHENO_TTL = 30 * 864e5;
const phenoPlace = () => S.M?.home.state || S.M?.home.country || null;
const phenoKey = gid => `${gid}:${phenoPlace() || 'w'}`;
const phenoQueue = new Set();
let phenoBusy = false;
function ensurePheno(ids) {
  ids.forEach(id => { const p = S.pheno[phenoKey(id)]; if (!p || Date.now() - p.ts > PHENO_TTL) phenoQueue.add(id); });
  if (!phenoBusy && phenoQueue.size) drainPheno();
}
async function drainPheno() {
  phenoBusy = true;
  while (phenoQueue.size) {
    const id = phenoQueue.values().next().value; phenoQueue.delete(id);
    try {
      const d = await api('/observations/histogram', { taxon_id:id, place_id:phenoPlace(), interval:'month_of_year', verifiable:true });
      const m = d.results?.month_of_year || {};
      S.pheno[phenoKey(id)] = { ts:Date.now(), m:[...Array(12)].map((_, i) => m[i+1] || 0) };
      store.set('pheno', S.pheno);
      phenoUpdated();
    } catch (e) { console.warn(e); break; }
  }
  phenoBusy = false;
}
// Peak = months with ≥60% of the busiest (smoothed) month's records, written as circular ranges ("Nov–Feb")
function peakInfo(gid) {
  const p = S.pheno[phenoKey(gid)]; if (!p) return null;
  const tot = p.m.reduce((a,b) => a+b, 0), nowM = new Date().getMonth();
  if (tot < 12) return { few:true, tot, m:p.m };
  // smooth with neighbouring months (1-2-1) so sparse genera read as seasons, not noise
  const sm = p.m.map((v, i) => (p.m[(i+11) % 12] + 2*v + p.m[(i+1) % 12]) / 4);
  const max = Math.max(...sm), on = sm.map(v => v >= max * .6);
  if (on.every(Boolean)) return { text:'year-round', now:true, tot, m:p.m };
  const ranges = [];
  for (let i = 0; i < 12; i++) {
    if (!on[i] || on[(i+11) % 12]) continue;
    let j = i; while (on[(j+1) % 12]) j = (j+1) % 12;
    ranges.push(i === j ? MONTHS[i] : `${MONTHS[i]}–${MONTHS[j]}`);
  }
  return { text:ranges.join(', '), now:on[nowM], tot, m:p.m };
}
function phenoHtml(gid) {
  const p = peakInfo(gid);
  if (!p) return '<span class="muted">· checking season…</span>';
  if (p.few) return '<span class="muted">· too few records to call a season</span>';
  return `${p.now ? '<b class="inseason">🌡 in season now</b> · ' : ''}<span class="muted">peak ${esc(p.text)}</span>`;
}
const phenoTag = gid => `<span class="small" data-pheno="${gid}">${phenoHtml(gid)}</span>`;
function phenoChart(gid) {
  const p = peakInfo(gid), where = esc(S.places[phenoPlace()]?.n || 'the world');
  if (!p) return '<p class="small muted">Checking when it turns up…</p>';
  const max = Math.max(1, ...p.m), nowM = new Date().getMonth();
  return `<div class="pheno">${p.m.map((v, i) => `<div title="${MONTHS[i]}: ${v} records"><i style="height:${Math.round(100 * v / max)}%" class="${i === nowM ? 'now' : ''}"></i><span>${MONTHS[i][0]}</span></div>`).join('')}</div>
    <p class="small">${p.few ? 'Too few records to call a season yet.' : `${p.now ? '<b class="inseason">🌡 In season now.</b> ' : ''}Peak: <b>${esc(p.text)}</b>.`} <span class="muted">${fmt(p.tot)} verifiable iNat records in ${where}, by month observed.</span></p>`;
}
function phenoUpdated() {
  document.querySelectorAll('[data-pheno]').forEach(el => el.innerHTML = phenoHtml(+el.dataset.pheno));
  document.querySelectorAll('[data-phenochart]').forEach(el => el.innerHTML = phenoChart(+el.dataset.phenochart));

/* ---------------- mastery fix-it: point at the exact records that could tick a box ---------------- */
function fixIt(g, k) {
  if (isGuest()) return '';
  const base = `https://www.inaturalist.org/observations?user_id=${encodeURIComponent(S.login)}&taxon_id=${g.id}&verifiable=any`;
  const count = f => g.obs.filter(f).length, s = n => n === 1 ? '' : 's';
  const has = (o, attr) => o.ann.some(a => a.startsWith(attr + '|'));
  const link = (url, text) => `<div class="fix small">↳ <a href="${esc(url)}" target="_blank" rel="noopener">${text} ↗</a></div>`;
  const tip = text => `<div class="fix small muted">↳ ${text}</div>`;
  switch (k) {
    case 'male': case 'female': {
      const n = count(o => !has(o, '9'));
      return n ? link(`${base}&without_term_id=9`, `${n} record${s(n)} with no sex annotation. Annotate any adults`) : tip('Every record is sexed. Go find the other one!');
    }
    case 'juv': {
      const n = count(o => !has(o, '1'));
      return n ? link(`${base}&without_term_id=1`, `${n} record${s(n)} with no life-stage annotation. Mark any juveniles`) : tip('Look for small, pale, often differently-patterned individuals.');
    }
    case 'feed':  return link(base, 'Photographed it with prey? Add "feeding" or "prey" to the description or a tag');
    case 'court': return link(base, 'Caught a display? Add "courtship" or "display" to the description or a tag');
    case 'egg':   return link(base, 'Got an egg sac, retreat or moult? Add an Evidence annotation or mention it in the description');
    case 'supported': {
      const n = count(o => !(o.ct && o.ct.includes(g.id)));
      return n ? link(`${base}&quality_grade=needs_id`, `${n} record${s(n)} not yet community-supported. Add sharper photos or @mention an identifier`) : '';
    }
    case 'species': {
      const n = count(o => o.t.l > 10);
      return n ? link(`${base}&hrank=genus&lrank=genus`, `${n} record${s(n)} stuck at genus. Try keying one to species`) : '';
    }
    case 'places': return tip(`Fieldwork: record it somewhere ~10 km from your ${g.c01.size} existing localit${g.c01.size === 1 ? 'y' : 'ies'}.`);
    case 'months': { const p = peakInfo(g.id); return tip(`Fieldwork: record it in a new month${p && !p.few ? ` (peak ${esc(p.text)})` : ''}.`); }
    default: return '';
  }
}

/* ---------------- compare: built to provoke envy ---------------- */

  const form = `<div class="panel" style="margin-bottom:16px"><h2>Compare SPOODEXes</h2>
    <p class="muted small">Enter another iNaturalist username to see what they've found that you haven't, and the other way round. Public records only.</p>

    ${C?.error ? `<p>${esc(C.error)}</p>` : ''}</div>`;
  if (!C || !C.M || C.loading) return form;
  const T = C.M, me = esc(who()), them = esc(C.login), where = esc(scopeLabel(S.prefs.scope));
  ensurePheno([...T.G.keys()].filter(id => !M.G.has(id)).slice(0, 20));

  const envyThem = envy(themG, themS), envyMe = envy(meG, meS), tot = Math.max(1, envyThem + envyMe);

  // VS banner
  const side = (X, name, cls) => {
    const covers = [...X.G.values()].sort(byRarity('g')).filter(g => g.cover).slice(0,4);
    return `<div class="side ${cls}"><div class="mosaic">${covers.map(g => `<i style="background-image:url('${esc(photoSize(g.cover,'small'))}')"></i>`).join('')}</div>
      <div style="font-family:var(--head);font-size:20px">${name}</div>
      <div class="hand">${esc(generatedTitle(X))}</div>
      <div>LEVEL <b>${X.G.size}</b> · ${X.S.size} species</div>
      <div class="prestige">${fmt(prestige(X))} ✦</div><div class="small muted">collection prestige</div></div>`;
  };

  // Crown jewels: each side's rarest exclusives (genera outrank species)
  const jewels = (gs, ss) => [...gs.map(x => ({ x, kind:'g' })), ...ss.map(x => ({ x, kind:'s' }))]
    .sort((a,b) => (starsFor(b.x.id,b.kind)*(b.kind==='g'?10:3)) - (starsFor(a.x.id,a.kind)*(a.kind==='g'?10:3)) || (refCount(a.x.id,a.kind) ?? -1) - (refCount(b.x.id,b.kind) ?? -1))
    .slice(0,3);
  const jewel = ({ x, kind }) => `<div class="jewel" data-genus="${kind==='g' ? x.id : x.gid}" style="background-image:url('${esc(photoSize(x.cover,'medium'))}')">
    <div class="lab"><div class="stars">${'★'.repeat(starsFor(x.id,kind))}${'☆'.repeat(3-starsFor(x.id,kind))}</div>
    <div style="font-family:var(--head);font-size:18px;font-style:italic">${esc(x.name)}</div>
    <div class="small">${kind==='g' ? 'genus' : 'species'} · ${esc(rarityNote(x.id, kind))}</div></div></div>`;

  // Head-to-head, crowns for the winner of each row
  const yrs = X => new Set(X.fieldDays.map(d => d.slice(0,4))).size;
  const rg = X => X.obs.length ? Math.round(100 * X.obs.filter(o => o.q === 'research').length / X.obs.length) : 0;
  const beh = X => X.behObs.feed + X.behObs.court + X.behObs.egg;
  const since = X => +(X.fieldDays[0] || '9999').slice(0,4);
  const rows = [
    ['Genera', X => X.G.size], ['Species', X => X.S.size], ['Collection prestige ✦', X => prestige(X)],
    ['Mastered genera', X => X.genera.filter(g => g.state === 'MASTERED').length], ['Observations', X => X.obs.length],
    ['Research Grade', X => rg(X), v => v + '%'], ['Localities (~10 km)', X => X.cellsAll01.size], ['Field days', X => X.fieldDays.length],
    ['Lineages represented', X => favouriteLineages(X).length], ['Behaviour records', beh], ['Best discovery streak', X => X.bestStreak],
    ['Spooding since', since, v => v === 9999 ? '—' : v, true],
  ];
  let winsM = 0, winsT = 0;
  const h2h = rows.map(([label, f, show = fmt, lowerWins]) => {
    const a = f(M), b = f(T), aw = lowerWins ? a < b : a > b, bw = lowerWins ? b < a : b > a;
    winsM += aw; winsT += bw;
    return `<tr><td class="muted">${label}</td><td class="${aw?'win':''}">${aw?'👑 ':''}${show(a)}</td><td class="${bw?'win':''}">${bw?'👑 ':''}${show(b)}</td></tr>`;

  const gap = d => { d = Math.abs(d); return d >= 365 ? `${(d/365).toFixed(1)} years` : d >= 60 ? `${Math.round(d/30)} months` : `${Math.round(d)} days`; };

  const mini = (x, kind, note) => `<div class="card" data-genus="${kind==='g' ? x.id : x.gid}"><span class="rar">${'★'.repeat(starsFor(x.id,kind))}</span>

  return form + `
  <div class="vs">${side(M, me, 'me')}<div class="vsmark">VS</div>${side(T, them, 'them')}</div>

  <div class="panel envy" style="margin-top:16px">
    <div class="big">${them} has <b>${themG.length}</b> genera and <b>${themS.length}</b> species you've never recorded.</div>
    <div class="big">You have <b>${meG.length}</b> genera and <b>${meS.length}</b> species ${them} has never recorded.</div>
    <div class="tug" title="Envy meter: rarity-weighted exclusives"><i style="width:${pct(envyMe, tot)}%"></i><i style="width:${100 - pct(envyMe, tot)}%"></i></div>
    <div class="row small" style="justify-content:space-between"><span>${me}: ${fmt(envyMe)} ✦ of exclusives</span><span>${them}: ${fmt(envyThem)} ✦ of exclusives</span></div>
    <p class="hand" style="margin:8px 0 0">${verdict}</p>
    ${isGuest() ? '' : `<p><button class="primary" data-act="share">😈 Copy link and send it to ${them}</button></p>`}
  </div>

  <h2 style="margin-top:22px">Crown jewels</h2>
  <p class="small muted">Each side's rarest finds the other doesn't have. ★ = how few iNat records exist in ${where} (not conservation status).</p>
  <div class="grid2">
    <div><h3>${me}</h3><div class="jewels">${jewels(meG, meS).map(jewel).join('') || '<p>No exclusives yet.</p>'}</div></div>
    <div><h3>${them}</h3><div class="jewels">${jewels(themG, themS).map(jewel).join('') || '<p>No exclusives. You have it all.</p>'}</div></div>
  </div>

  <div class="grid2" style="margin-top:16px">
    <div class="panel"><h3>Head to head <span class="small muted">· ${me} ${winsM}–${winsT} ${them}</span></h3>

      ${firstsM.slice(0,3).map(l => `<div class="small">🏁 ${me} found <a href="#" data-genus="${l.g.id}"><i>${esc(l.g.name)}</i></a> ${gap(l.days)} before ${them}</div>`).join('')}
      ${firstsT.slice(0,3).map(l => `<div class="small">🏁 ${them} found <a href="#" data-genus="${l.g.id}"><i>${esc(l.g.name)}</i></a> ${gap(l.days)} before ${me}</div>`).join('')}
      <h3 style="margin-top:12px">Lineage by lineage</h3>
      <table class="cmp"><tr><th></th><th>${me}</th><th>${them}</th></tr>${lineageRows(M, T)}</table></div>
  </div>

  <h2 style="margin-top:22px">Your hit list: only ${them} has these</h2>
  <p class="small muted">Their photos, so you know exactly what you're looking for.</p>
  <h3>Genera (${themG.length})</h3>${grid(themG, 'g', 'Nothing! You have every genus they have.')}
  ${themG.length ? `<div class="panel small" style="margin-top:8px"><b>When to look for them</b>${themG.slice(0,20).map(g => `<div><a href="#" data-genus="${g.id}"><i>${esc(g.name)}</i></a> ${phenoTag(g.id)}</div>`).join('')}</div>` : ''}
  <h3 style="margin-top:12px">Species (${themS.length})</h3>${grid(themS, 's', 'Nothing! You have every species they have.')}

  <h2 style="margin-top:22px">Their envy list: only ${me} has these</h2>
  <h3>Genera (${meG.length})</h3>${grid(meG, 'g', 'Nothing yet.')}
  <h3 style="margin-top:12px">Species (${meS.length})</h3>${grid(meS, 's', 'Nothing yet.')}

  <h2 style="margin-top:22px">Shared genera (${both.length})</h2>
  <div class="panel"><table class="cmp"><tr><th>Genus</th><th>${me}</th><th>${them}</th></tr>
    ${both.map(g => { const t = T.G.get(g.id), aw = g.level > t.level, bw = t.level > g.level;
      return `<tr><td><a href="#" data-genus="${g.id}"><i>${esc(g.name)}</i></a></td><td class="${aw?'win':''}">L${g.level} · ${g.obs.length} obs · ${g.sp.size} sp.</td><td class="${bw?'win':''}">L${t.level} · ${t.obs.length} obs · ${t.sp.size} sp.</td></tr>`; }).join('')}</table></div>`;
}
function lineageRows(M, T) {
  const tribeOf = id => { const L = lineage(id); return (L.find(n => n.r === 'tribe') || L.find(n => n.r === 'subfamily') || { n:'(unplaced)' }).n; };
  const t = {};
  M.G.forEach((g, id) => { const k = tribeOf(id); (t[k] = t[k] || { a:0, b:0 }).a++; });
  T.G.forEach((g, id) => { const k = tribeOf(id); (t[k] = t[k] || { a:0, b:0 }).b++; });
  return Object.entries(t).sort((x,y) => (y[1].a + y[1].b) - (x[1].a + x[1].b))
    .map(([n, v]) => `<tr><td>${esc(n)}</td><td class="${v.a>v.b?'win':''}">${v.a}</td><td class="${v.b>v.a?'win':''}">${v.b}</td></tr>`).join('');
}
async function loadCompare(login) {
  login = String(login || '').trim().replace(/^@/, '');
  if (!login || S.cmp?.loading) return;
  if (login.toLowerCase() === String(S.login).toLowerCase()) { toast("That's you! Try someone else's username."); return; }
  const cached = store.get('cmp');
  const save = cached && cached.login.toLowerCase() === login.toLowerCase() ? cached.save : { obs:{}, meta:{} };
  S.cmp = { login, save, loading:true, log:[] };
  if (S.tab === 'compare') render();
  const log = line => { S.cmp.log.push(line); const el = $('#cmpLog'); if (el) { el.textContent = S.cmp.log.slice(-6).join('\n'); el.scrollTop = el.scrollHeight; } };
  try {
    await importRecords(login, save, { log });
    saveShared();
    S.cmp.M = buildModel(save.obs, null);
    if (!store.set('cmp', { login, save })) store.del('cmp');   // one cached rival at a time
  } catch (e) { S.cmp.error = e.message; }
  S.cmp.loading = false;
  updateUrl();
  if (S.tab === 'compare') render();
}

/* ---------------- boot / flows ---------------- */
function loadUser(login) {
  S.login = login;
  S.u = store.get(ukey(login), null) || { obs:{}, meta:{}, seen:[], scans:{}, completed:[] };
  S.u.scans = S.u.scans || {}; S.u.completed = S.u.completed || []; S.u.seen = S.u.seen || [];
  store.set('lastLogin', login);
}
// Shareable state lives in the URL: ?u=<login>&vs=<rival>. Locations never go in links.
function updateUrl() {
  const p = new URLSearchParams();
  if (S.login && !isGuest()) p.set('u', S.login);
  if (S.cmp?.M && S.cmp.login) p.set('vs', S.cmp.login);
  const qs = p.toString();
  try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch {}
}
async function copyLink() {
  updateUrl();
  const url = location.href;
  try { await navigator.clipboard.writeText(url); toast('Link copied. Anyone with it sees this SPOODEX (public iNat data only).'); }
  catch { window.prompt('Copy this link:', url); }
}
async function doSync(full) {
  const btn = $('#syncBtn'); btn.disabled = true; btn.textContent = '⟳ Syncing…';
  const prevQuests = S.M ? buildQuests(S.M) : [];
  const prevSeen = new Set(S.u.seen);
  try {
    await sync({ full });
    if (S.M.homeCell) try { await scanActive(S.M.homeCell.k); } catch (e) { console.warn(e); }
    // quests completed by this sync
    const at = new Date().toISOString().slice(0,10);
    for (const q of prevQuests) if (!['scan','base'].includes(q.kind) && questDone(q, S.M) && !S.u.completed.some(c => c.id === q.id && c.at === at)) S.u.completed.push({ id:q.id, title:q.title, reward:q.reward, at });
    const fresh = S.M.genera.filter(g => !prevSeen.has(g.id));
    S.u.seen = S.M.genera.map(g => g.id); saveUser();
    if (S.tab !== 'map') render();
    if (fresh.length) revealQueue(fresh); else if (!isGuest()) toast('Synced. No new genera this time, but the field awaits.');
  } catch (e) { toast(e.message); }
  btn.disabled = false; btn.textContent = '⟳ Sync';
}
async function onboard(login) {
  loadUser(login);
  const log = $('#scanLog'); log.classList.remove('hidden'); log.textContent = '';
  const w = s => { log.textContent += s + '\n'; log.scrollTop = log.scrollHeight; };
  w('beep.'); w('SPOODEX Mk 0 booting…');
  document.querySelectorAll('#onboard button').forEach(b => b.disabled = true);
  try {
    await sync({ full:!S.u.meta.lastSync, log:w });
    const M = S.M;
    w(`Identifying unique genera… ${M.G.size} found.`);
    const cas = $('#cascade'); cas.innerHTML = '';
    for (const [i, g] of M.genera.entries()) {
      const s = document.createElement('span'); s.innerHTML = `<i>${esc(g.name)}</i>`; s.style.animationDelay = (i * 60) + 'ms'; cas.appendChild(s);
    }
    await sleep(Math.min(4000, M.genera.length * 60 + 600));
    S.u.seen = M.genera.map(g => g.id); saveUser();
    $('#initTitle').textContent = M.G.size ? `SPOODEX INITIALISED — ${M.G.size} GENERA DISCOVERED` : 'SPOODEX INITIALISED — NO GENERA YET. LET\'S FIX THAT.';
    $('#initDone').classList.remove('hidden');
  } catch (e) { w('ERROR: ' + e.message); }
  document.querySelectorAll('#onboard button').forEach(b => b.disabled = false);
}
function enterApp(tab) {
  $('#onboard').classList.add('hidden'); $('#app').classList.remove('hidden');
  S.tab = tab || (S.M.G.size ? 'profile' : 'map');
  updateUrl(); render();
  if (S.pendingVs) { const v = S.pendingVs; S.pendingVs = null; S.tab = 'compare'; render(); loadCompare(v); }
}
function startGuest() {
  loadUser(GUEST);
  S.M = buildModel();
  enterApp('map');
  if (S.u.base) loadRefs().then(() => { S.M = buildModel(); }).catch(() => {});
}
function toast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:6px;z-index:3000;max-width:90vw';
  document.body.appendChild(t); setTimeout(() => t.remove(), 4000);
}
function settings() {
  $('#modalRoot').innerHTML = `<div class="overlay" data-close="1"><div class="modal"><button class="x" data-close="1">✕</button><div class="body">
    <h2>Settings</h2>
    <p>${isGuest() ? 'Browsing as a guest.' : `Viewing <b>${esc(S.login)}</b> (public data only). Last sync ${esc((S.u.meta.lastSync||'').slice(0,16).replace('T',' '))}.`}</p>
    <div class="row"><label>Chassis skin <select data-pref="chassis">${['auto','notebook','kit','cabinet'].map(c => `<option ${S.prefs.chassis===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label><input type="checkbox" data-pref="peek" ${S.prefs.peek?'checked':''}> Unlock all modules (prototype peek)</label></div>
    <div class="row" style="margin-top:14px">
      ${isGuest() ? '' : '<button data-act="share">🔗 Copy share link</button><button data-act="full">Full resync</button>'}
      <button data-act="switch">Switch user</button>
      <button data-act="wipe">Forget this user's cache</button>
    </div></div></div></div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-genus],[data-close],[data-filter],[data-scan],[data-act],[data-base],[data-layer]');
  if (!t) return;
  if (t.dataset.close && e.target !== t && !e.target.closest('.x')) return;
  if (t.dataset.genus) { e.preventDefault(); openGenus(+t.dataset.genus); return; }
  if (t.dataset.close) { $('#modalRoot').innerHTML = ''; return; }
  if (t.dataset.tab) { $('#modalRoot').innerHTML = ''; S.tab = t.dataset.tab; render(); return; }
  if (t.dataset.filter) { S.prefs.filter = t.dataset.filter; savePrefs(); render(); return; }
  if (t.dataset.layer) { S.prefs.layer = t.dataset.layer; savePrefs(); render(); return; }
  if (t.dataset.scan) { if (S.tab !== 'map') { S.tab = 'map'; render(); } showCell(t.dataset.scan); scanCell(t.dataset.scan); return; }
  if (t.dataset.base) { e.preventDefault(); const [lat, lng, ...rest] = t.dataset.base.split('|'); setBase(lat, lng, rest.join('|')); return; }
  const a = t.dataset.act;
  if (a === 'peek') { S.prefs.peek = true; savePrefs(); render(); }
  if (a === 'full') { $('#modalRoot').innerHTML = ''; doSync(true); }
  if (a === 'share') copyLink();
  if (a === 'geo') geolocate();
  if (a === 'clearBase') { delete S.u.base; saveUser(); S.M = buildModel(); render(); }
  if (a === 'guest') startGuest();
  if (a === 'sample') { $('#loginInput').value = SAMPLE_LOGIN; onboard(SAMPLE_LOGIN); }
  if (a === 'switch') { store.del('lastLogin'); location.href = location.pathname; }
  if (a === 'wipe') { store.del(ukey(S.login)); store.del('lastLogin'); location.href = location.pathname; }
});
document.addEventListener('submit', async e => {
  const f = e.target.dataset.form; if (!f) return;
  e.preventDefault();
  if (f === 'compare') loadCompare(e.target.login.value);
  if (f === 'placeSearch') {
    const q = e.target.q.value.trim(); if (!q) return;
    const out = $('#placeResults'); out.textContent = 'Searching…';
    try {
      const d = await api('/places/autocomplete', { q, per_page:8 });
      out.innerHTML = d.results.filter(p => p.location).map(p => {
        const [lat, lng] = p.location.split(','), label = p.display_name || p.name;
        return `<div><a href="#" data-base="${esc(`${lat}|${lng}|${label}`)}">${esc(label)}</a></div>`;
      }).join('') || 'No places found.';
    } catch (err) { out.textContent = err.message; }
  }
});
document.addEventListener('change', async e => {
  const p = e.target.dataset.pref; if (!p) return;
  S.prefs[p] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; savePrefs();
  if (p === 'scope') { try { await ensureRef(S.prefs.scope); } catch (err) { toast(err.message); } S.M = buildModel(); }
  render();
  if ($('#modalRoot').innerHTML && ['chassis','peek'].includes(p)) settings();
});
$('#syncBtn').addEventListener('click', () => doSync(false));
$('#shareBtn').addEventListener('click', copyLink);
$('#menuBtn').addEventListener('click', settings);
$('#loginForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#loginInput').value.trim().replace(/^@/, ''); if (v) onboard(v); });
$('#openDex').addEventListener('click', () => enterApp());

// ?u=<login> opens that SPOODEX (importing it if needed); ?vs=<login> jumps to Compare.
// Otherwise a returning player opens straight from cache, then quietly syncs.
(function boot() {
  const q = new URLSearchParams(location.search);
  const u = (q.get('u') || '').trim().replace(/^@/, '');
  S.pendingVs = (q.get('vs') || '').trim() || null;
  const target = u || store.get('lastLogin');
  if (target && store.get(ukey(target))) {
    loadUser(target);
    try { S.M = buildModel(); enterApp(); doSync(false); return; } catch (e) { console.warn(e); }
  }
  if (u) { $('#loginInput').value = u; onboard(u); }
})();
</script>
</body>
